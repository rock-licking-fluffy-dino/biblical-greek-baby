<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Oikos</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oikos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f0ea">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --ink: #201e1d;
    --green: #4f7a5c;
    --green-text: #2d4a36;
    --green-tint: rgba(79,122,92,0.16);
    --muted: rgba(32,30,29,0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: var(--font-sans);
    color: var(--ink);
    background: linear-gradient(180deg,#fbfaf7,#f2f0ea);
  }
  body {
    background:
      radial-gradient(circle at 88% -8%, rgba(79,122,92,0.22), transparent 55%),
      linear-gradient(180deg,#fbfaf7,#f2f0ea);
    min-height: 100vh;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    min-height: 100vh;
  }
  #screen {
    padding: calc(env(safe-area-inset-top) + 24px) 18px 116px;
  }
  .text-muted { color: var(--muted); }
  .kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--green-text);
    font-weight: 600;
  }

  /* generic layered glass panel */
  .glass { position: relative; }
  .glass-fill, .glass-edge { position: absolute; inset: 0; pointer-events: none; }
  .glass-fill {
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(255,255,255,0.55);
  }
  .glass-edge {
    box-shadow: inset 1px 1px 1px rgba(255,255,255,0.9), inset -1px -1px 1px rgba(255,255,255,0.3);
    border: 0.5px solid rgba(255,255,255,0.5);
  }
  .glass-content { position: relative; z-index: 1; }

  /* header */
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .app-title { font-weight: 800; font-size: 21px; letter-spacing: -0.01em; margin: 0; }
  .app-tagline { font-size: 11px; margin-top: 1px; color: var(--green-text); font-weight: 600; }
  .app-subtitle { font-size: 12px; margin-top: 3px; }
  .icon-btn {
    position: relative; width: 38px; height: 38px; border-radius: 9999px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0;
    background: rgba(255,255,255,0.55); backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%);
    box-shadow: inset 1px 1px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.3);
    border: 0.5px solid rgba(0,0,0,0.06);
  }
  .pill { position: relative; border-radius: 9999px; }
  .pill .glass-fill { border-radius: 9999px; backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%); background: rgba(255,255,255,0.55); }
  .pill .glass-edge { border-radius: 9999px; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.3); border: 0.5px solid rgba(0,0,0,0.06); }
  .pill .glass-content { padding: 7px 14px; font-size: 12px; color: var(--green-text); font-weight: 600; white-space: nowrap; }

  /* home: continue card */
  .continue-card { border-radius: 24px; padding: 20px; margin-bottom: 14px; box-shadow: 0 12px 32px rgba(32,30,29,0.1); }
  .continue-card .glass-fill { border-radius: 24px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); background: rgba(255,255,255,0.6); }
  .continue-card .glass-edge { border-radius: 24px; }
  .continue-card h2 { margin: 0 0 6px; font-weight: 800; font-size: 25px; }
  .continue-words { margin: 0 0 16px; font-size: 13px; }
  .resume-btn { position: relative; width: 100%; border: none; border-radius: 16px; padding: 13px 0; overflow: hidden; cursor: pointer; }
  .resume-btn .resume-fill { position: absolute; inset: 0; background: rgba(79,122,92,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .resume-btn .resume-edge { position: absolute; inset: 0; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.3); }
  .resume-btn span { position: relative; z-index: 1; color: #fff; font-weight: 800; font-size: 14px; }
  .resume-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* stats row */
  .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat-chip { flex: 1; border-radius: 18px; padding: 12px 6px; text-align: center; }
  .stat-chip .glass-fill { border-radius: 18px; background: rgba(255,255,255,0.5); }
  .stat-chip .glass-edge { border-radius: 18px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .stat-value { font-weight: 800; font-size: 19px; }
  .stat-label { font-size: 10px; margin-top: 2px; }

  /* chapters grid (shared: home display grid + setup multi-select grid) */
  .chapters-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chapter-chip {
    text-align: center; padding: 8px 0; border-radius: 10px; font-size: 11px;
    cursor: pointer; user-select: none; border: none; font-family: var(--font-sans);
  }
  .chapter-chip.done { background: var(--green); color: #fff; font-weight: 600; }
  .chapter-chip.not-done { background: rgba(255,255,255,0.5); color: var(--muted); border: 0.5px solid rgba(32,30,29,0.08); }
  .chapter-chip.selectable { background: rgba(255,255,255,0.5); color: var(--ink); border: 0.5px solid rgba(32,30,29,0.1); font-weight: 600; }
  .chapter-chip.selected { background: var(--green); color: #fff; }

  /* setup screen */
  .setup-panel { border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .setup-panel .glass-fill { border-radius: 20px; background: rgba(255,255,255,0.55); }
  .setup-panel .glass-edge { border-radius: 20px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .setup-section + .setup-section { margin-top: 16px; }
  .setup-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .link-btn {
    background: none; border: none; color: var(--green-text); font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 0; font-family: var(--font-sans); text-decoration: underline; text-underline-offset: 2px;
  }
  .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    flex: 1 1 auto; border: 0.5px solid rgba(32,30,29,0.1); background: rgba(255,255,255,0.5);
    color: var(--ink); border-radius: 12px; padding: 10px 8px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: var(--font-sans); text-align: center; white-space: nowrap;
  }
  .seg-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .seg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .setup-note { font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  .start-btn {
    position: relative; width: 100%; border: none; border-radius: 16px; padding: 14px 0;
    overflow: hidden; cursor: pointer; margin-top: 16px;
  }
  .start-btn .resume-fill { position: absolute; inset: 0; background: rgba(79,122,92,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .start-btn .resume-edge { position: absolute; inset: 0; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.3); }
  .start-btn span { position: relative; z-index: 1; color: #fff; font-weight: 800; font-size: 14px; }
  .start-btn:disabled .resume-fill { background: rgba(32,30,29,0.15); }
  .start-btn:disabled span { color: rgba(32,30,29,0.4); }
  .start-btn:disabled { cursor: not-allowed; }

  /* flashcard */
  .progress-row { display: flex; justify-content: space-between; font-size: 12px; color: rgba(32,30,29,0.55); margin-bottom: 10px; }
  .progress-track { height: 6px; background: rgba(32,30,29,0.08); border-radius: 9999px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 6px; background: var(--green); border-radius: 9999px; transition: width 0.25s ease; }
  .prompt-panel { border-radius: 28px; padding: 34px 20px; margin-bottom: 22px; box-shadow: 0 16px 40px rgba(32,30,29,0.12); text-align: center; }
  .prompt-panel .glass-fill { border-radius: 28px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); background: rgba(255,255,255,0.62); }
  .prompt-panel .glass-edge { border-radius: 28px; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.9); }
  .prompt-word { font-weight: 800; font-size: 44px; word-break: break-word; }
  .prompt-word.is-english { font-size: 26px; line-height: 1.3; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { position: relative; border: none; border-radius: 16px; padding: 15px 16px; text-align: left; cursor: pointer; font-family: var(--font-sans); }
  .option-btn:disabled { cursor: default; }
  .option-fill { position: absolute; inset: 0; border-radius: 16px; background: rgba(255,255,255,0.4); }
  .option-edge { position: absolute; inset: 0; border-radius: 16px; border: 0.5px solid rgba(255,255,255,0.5); }
  .option-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--ink); gap: 10px; }
  .option-btn.is-correct .option-fill { background: var(--green-tint); }
  .option-btn.is-correct .option-content { color: var(--green-text); }
  .option-btn.is-wrong .option-fill { background: rgba(32,30,29,0.06); }
  .option-btn.is-wrong .option-content { color: var(--muted); }
  .option-btn.is-faded .option-content { color: var(--muted); }
  .option-icon { flex-shrink: 0; display: flex; }

  /* typed answer */
  .typed-row { display: flex; gap: 8px; }
  .typed-input-wrap { position: relative; flex: 1; border-radius: 16px; overflow: hidden; }
  .typed-input-wrap .glass-fill { border-radius: 16px; background: rgba(255,255,255,0.4); }
  .typed-input-wrap .glass-edge { border-radius: 16px; border: 0.5px solid rgba(255,255,255,0.5); }
  .typed-input {
    position: relative; z-index: 1; width: 100%; border: none; background: transparent;
    padding: 15px 16px; font-size: 15px; font-family: var(--font-sans); color: var(--ink); outline: none;
  }
  .typed-input-wrap.is-correct .glass-fill { background: var(--green-tint); }
  .typed-input-wrap.is-correct .typed-input { color: var(--green-text); }
  .typed-input-wrap.is-wrong .glass-fill { background: rgba(32,30,29,0.06); }
  .typed-input-wrap.is-wrong .typed-input { color: var(--muted); }
  .typed-submit {
    position: relative; border: none; border-radius: 16px; padding: 0 20px; overflow: hidden; cursor: pointer;
  }
  .typed-submit .resume-fill { position: absolute; inset: 0; background: rgba(79,122,92,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .typed-submit span { position: relative; z-index: 1; color: #fff; font-weight: 800; font-size: 13px; }
  .typed-submit:disabled { cursor: not-allowed; opacity: 0.5; }
  .typed-feedback { text-align: center; font-size: 12.5px; margin-top: 14px; min-height: 16px; }

  /* progress screen */
  .rings-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .rings-row .ring-panel { flex: 1; margin-bottom: 0; padding: 18px 10px; }
  .ring-panel { border-radius: 24px; padding: 26px 20px; margin-bottom: 16px; box-shadow: 0 12px 32px rgba(32,30,29,0.1); text-align: center; }
  .ring-panel .glass-fill { border-radius: 24px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); background: rgba(255,255,255,0.6); }
  .ring-panel .glass-edge { border-radius: 24px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .ring-panel .kicker { margin-bottom: 10px; }
  .ring-label { font-size: 12px; margin-top: 6px; }
  .ring-caption { font-size: 11.5px; margin-top: 2px; line-height: 1.4; }

  /* quiz empty state (no quiz selected) */
  .quiz-empty-note { text-align: center; font-size: 12.5px; margin-bottom: 16px; line-height: 1.4; }
  .flip-hint { font-size: 11px; margin-top: 14px; }
  .quiz-empty-actions { display: flex; gap: 10px; margin-top: 6px; }
  .quiz-empty-actions .start-btn { width: auto; flex: 1; }
  .ghost-btn {
    position: relative; flex: 1; border: none; border-radius: 16px; padding: 13px 0; overflow: hidden; cursor: pointer;
    background: rgba(255,255,255,0.5); border: 0.5px solid rgba(32,30,29,0.1); color: var(--ink); font-weight: 700;
    font-family: var(--font-sans); font-size: 14px;
  }
  .list-panel { border-radius: 20px; padding: 6px 16px; margin-bottom: 16px; }
  .list-panel .glass-fill { border-radius: 20px; background: rgba(255,255,255,0.5); }
  .list-panel .glass-edge { border-radius: 20px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .chapter-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .chapter-row .ch-num { width: 20px; font-size: 12px; color: rgba(32,30,29,0.55); }
  .chapter-row .ch-track { flex: 1; height: 6px; background: rgba(32,30,29,0.08); border-radius: 9999px; }
  .chapter-row .ch-fill { height: 6px; background: var(--green); border-radius: 9999px; }
  .chapter-row .ch-pct { width: 32px; text-align: right; font-size: 12px; color: rgba(32,30,29,0.55); }
  .missed-row { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; font-size: 14px; }
  .missed-greek { font-weight: 600; }
  .missed-english { text-align: right; }
  .empty-note { text-align: center; font-size: 13px; padding: 14px 0; }

  /* nav bar */
  .tab-bar-wrap { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); z-index: 30; }
  .tab-bar { position: relative; display: flex; align-items: center; gap: 6px; padding: 9px; border-radius: 9999px; box-shadow: 0 6px 20px rgba(0,0,0,0.16); }
  .tab-bar .glass-fill { border-radius: 9999px; backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); background: rgba(255,255,255,0.6); }
  .tab-bar .glass-edge { border-radius: 9999px; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.3); border: 0.5px solid rgba(0,0,0,0.06); }
  .tab-btn { position: relative; z-index: 1; width: 52px; height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }
  .tab-btn.active { color: var(--green); }
  .tab-btn svg { width: 26px; height: 26px; }

  /* ---------- home ---------- */
  .home-hero { margin-top: 30px; }
  .greeting {
    margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;
    font-size: clamp(30px, 9vw, 38px);
  }
  .stats-line {
    margin: 12px 0 0; font-size: 12.5px; line-height: 1.6; color: rgba(32,30,29,0.55);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 7px;
  }
  .stats-line .stat-bit { white-space: nowrap; }
  .stats-line .sep { color: rgba(32,30,29,0.28); }
  .stats-line strong { font-weight: 700; color: var(--green-text); }
  .home-actions { margin-top: 28px; }
  .home-actions .start-btn { margin-top: 0; padding: 17px 0; border-radius: 18px; box-shadow: 0 10px 26px rgba(79,122,92,0.26); }
  .home-actions .start-btn span { font-size: 15.5px; }
  .home-secondary { text-align: center; margin-top: 15px; }

  /* ---------- step-by-step setup ---------- */
  .setup-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .back-btn {
    width: 32px; height: 32px; border-radius: 9999px; flex-shrink: 0; cursor: pointer;
    border: 0.5px solid rgba(32,30,29,0.1); background: rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .step-count { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--green-text); }
  .step-track { height: 4px; background: rgba(32,30,29,0.08); border-radius: 9999px; overflow: hidden; margin-bottom: 18px; }
  .step-fill { height: 4px; background: var(--green); border-radius: 9999px; transition: width 240ms cubic-bezier(.2,.7,.3,1); }
  .step-title { margin: 0 0 4px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .step-hint { margin: 0 0 16px; font-size: 12.5px; line-height: 1.45; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    position: relative; width: 100%; text-align: left; cursor: pointer; font-family: var(--font-sans);
    border: 0.5px solid rgba(32,30,29,0.1); background: rgba(255,255,255,0.5); border-radius: 14px;
    padding: 13px 16px; font-size: 14px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .choice-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
  .choice-sub { display: block; font-size: 11.5px; font-weight: 400; margin-top: 2px; color: rgba(32,30,29,0.45); }
  .choice-btn.active .choice-sub { color: rgba(255,255,255,0.78); }
  .choice-tick { flex-shrink: 0; opacity: 0; transition: opacity 150ms ease; }
  .choice-btn.active .choice-tick { opacity: 1; }
  .summary-card {
    border-radius: 16px; padding: 14px 16px; background: rgba(255,255,255,0.5);
    border: 0.5px solid rgba(255,255,255,0.6);
  }
  .summary-line { font-size: 13.5px; font-weight: 700; line-height: 1.5; }
  .summary-sub { font-size: 11.5px; margin-top: 4px; line-height: 1.45; }
  .setup-panel .start-btn.step-next { margin-top: 16px; }

  /* ---------- flip card (flashcards + review word) ---------- */
  .flip { perspective: 1200px; cursor: pointer; }
  .flip-inner {
    position: relative; transition: transform 280ms cubic-bezier(.2,.7,.3,1);
    transform-style: preserve-3d; min-height: 116px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .flip.is-flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; width: 100%; }
  .flip-back {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%) rotateY(180deg);
  }
  .card-actions { display: flex; gap: 10px; margin-top: 18px; }
  .card-actions .ghost-btn, .card-actions .start-btn { flex: 1; margin-top: 0; }
  .card-actions .ghost-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- motion ---------- */
  button { transition: transform 150ms cubic-bezier(.2,.7,.3,1); }
  button:not(:disabled):active { transform: scale(0.97); }
  .step-in-fwd { animation: oikos-step-fwd 220ms cubic-bezier(.2,.7,.3,1); }
  .step-in-back { animation: oikos-step-back 220ms cubic-bezier(.2,.7,.3,1); }
  @keyframes oikos-step-fwd { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes oikos-step-back { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  @keyframes oikos-pulse-correct {
    0% { background: rgba(255,255,255,0.4); }
    45% { background: rgba(79,122,92,0.30); }
    100% { background: var(--green-tint); }
  }
  @keyframes oikos-pulse-wrong {
    0% { background: rgba(255,255,255,0.4); }
    45% { background: rgba(32,30,29,0.13); }
    100% { background: rgba(32,30,29,0.06); }
  }
  .option-btn.is-correct .option-fill { animation: oikos-pulse-correct 300ms ease both; }
  .option-btn.is-wrong .option-fill { animation: oikos-pulse-wrong 300ms ease both; }
  .typed-input-wrap.is-correct .glass-fill { animation: oikos-pulse-correct 300ms ease both; }
  .typed-input-wrap.is-wrong .glass-fill { animation: oikos-pulse-wrong 300ms ease both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .fade-in { animation: oikos-fade 0.18s ease; }
  @keyframes oikos-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div class="tab-bar-wrap">
    <div class="tab-bar">
      <div class="glass-fill"></div>
      <div class="glass-edge"></div>
      <button class="tab-btn" id="tab-home" title="Home">
        <svg viewBox="0 0 20 20" fill="none"><path d="M2.5 8.5 10 2l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 8v8.5h4.5V12h3v4.5H16V8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>

/* ---------- storage: works inside Claude artifacts (window.storage) and on any
   normal web host / home-screen app (falls back to localStorage) ---------- */
const storageAdapter = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
    } catch (e) { /* key may not exist yet */ }
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(key, value, false);
        return;
      }
    } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(key, value); } catch (e) { /* non-fatal */ }
  }
};

const STATS_KEY = 'koine-drill-word-stats';
const STREAK_KEY = 'oikos-streak';

let state = {
  screen: 'home',            // 'home' | 'setup' (step flow) | 'flashcard' (quiz) | 'cards' (flashcards) | 'progress'
  stats: {},                 // wordKey -> { seen, correct }
  streak: { count: 0, lastDate: null },
  setup: {
    selectedChapters: new Set(),
    count: 20,                // 10 | 20 | 30
    direction: 'gtoe',        // 'gtoe' | 'etog' | 'mixed'
    mode: 'mc',               // 'mc' | 'typed' | 'cards'
    step: 1,                  // 1 chapters, 2 format, 3 direction, 4 word count, 5 start
    anim: 'fwd'               // direction of the last step transition, for the slide animation
  },
  quiz: null,                 // { settings, pool, items, index, score, answered, selectedOpt, typedValue, typedCorrect }
  cards: null,                // flashcard session: { chapters, items, index, revealed }
  lastSession: 'quiz',        // 'quiz' | 'cards' -- which one the Review tab should open
  randomWord: null,           // { chapter, greek, english } shown when no quiz is selected
  randomWordRevealed: false
};

function wordKey(chapter, greek) { return chapter + '::' + greek; }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function loadData() {
  const rawStats = await storageAdapter.get(STATS_KEY);
  try { state.stats = rawStats ? JSON.parse(rawStats) : {}; } catch (e) { state.stats = {}; }
  const rawStreak = await storageAdapter.get(STREAK_KEY);
  try { state.streak = rawStreak ? JSON.parse(rawStreak) : { count: 0, lastDate: null }; } catch (e) { state.streak = { count: 0, lastDate: null }; }
}

function saveStats() { storageAdapter.set(STATS_KEY, JSON.stringify(state.stats)); }
function saveStreak() { storageAdapter.set(STREAK_KEY, JSON.stringify(state.streak)); }

function bumpStreak() {
  const today = todayStr();
  if (state.streak.lastDate === today) return;
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  const yestStr = yest.getFullYear() + '-' + String(yest.getMonth() + 1).padStart(2, '0') + '-' + String(yest.getDate()).padStart(2, '0');
  state.streak.count = (state.streak.lastDate === yestStr) ? state.streak.count + 1 : 1;
  state.streak.lastDate = today;
  saveStreak();
}

function recordAttempt(chapter, greek, correct) {
  const k = wordKey(chapter, greek);
  if (!state.stats[k]) state.stats[k] = { seen: 0, correct: 0 };
  state.stats[k].seen += 1;
  if (correct) state.stats[k].correct += 1;
  saveStats();
}

/* ---------- derived data ---------- */
function chapterMastery(ch) {
  const words = VOCAB[ch] || [];
  let seen = 0, correct = 0;
  words.forEach(w => {
    const s = state.stats[wordKey(ch, w.greek)];
    if (s) { seen += s.seen; correct += s.correct; }
  });
  if (seen === 0) return 0;
  return Math.round((correct / seen) * 100);
}

/*
 * "accuracy" measures how often you answer correctly among the questions
 * you've actually been asked so far -- it is NOT the same as how much of
 * the 23-chapter syllabus you have covered. Two words attempted with one
 * mistake is already 50% accuracy; twenty words attempted with two
 * mistakes is 90% accuracy -- both are possible after "finishing" only a
 * couple of chapters. Coverage of the syllabus is shown separately, as
 * "{wordsSeen} of {totalWords} words" and "chapters mastered".
 */
function overallStats() {
  let totalSeenWords = 0, totalWords = 0, sumSeen = 0, sumCorrect = 0;
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      totalWords += 1;
      const s = state.stats[wordKey(ch, w.greek)];
      if (s && s.seen > 0) {
        totalSeenWords += 1;
        sumSeen += s.seen;
        sumCorrect += s.correct;
      }
    });
  });
  const accuracy = sumSeen > 0 ? Math.round((sumCorrect / sumSeen) * 100) : 0;
  const chaptersMastered = CHAPTERS.filter(ch => chapterMastery(ch) >= MASTERY_THRESHOLD).length;
  return { wordsSeen: totalSeenWords, totalWords, accuracy, chaptersMastered, totalChapters: CHAPTERS.length };
}

function continueChapter() {
  const next = CHAPTERS.find(ch => chapterMastery(ch) < MASTERY_THRESHOLD);
  return next !== undefined ? next : CHAPTERS[CHAPTERS.length - 1];
}

/* a word counts as "learned" once it's been answered correctly enough
   of the time it has been asked (same threshold used for chapter mastery) */
function learnedWordsCount() {
  let count = 0;
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      const s = state.stats[wordKey(ch, w.greek)];
      if (s && s.seen > 0 && (s.correct / s.seen) * 100 >= MASTERY_THRESHOLD) count += 1;
    });
  });
  return count;
}

function allWords() {
  const out = [];
  CHAPTERS.forEach(ch => (VOCAB[ch] || []).forEach(w => out.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim() })));
  return out;
}

function pickRandomWord() {
  const words = allWords();
  return words[Math.floor(Math.random() * words.length)];
}

function wordsToReview(limit) {
  const rows = [];
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      const s = state.stats[wordKey(ch, w.greek)];
      if (s && s.seen > 0 && s.correct < s.seen) {
        rows.push({ greek: w.greek, english: w.english, accuracy: s.correct / s.seen });
      }
    });
  });
  rows.sort((a, b) => a.accuracy - b.accuracy);
  return rows.slice(0, limit);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool(chapters) {
  const pool = [];
  chapters.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => pool.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim() }));
  });
  return pool;
}

function pickDistractors(correctItem, pool, field, n) {
  const others = shuffle(pool.filter(w => w[field] !== correctItem[field]));
  const seenVals = new Set([correctItem[field]]);
  const out = [];
  for (const w of others) {
    if (out.length >= n) break;
    if (seenVals.has(w[field])) continue;
    seenVals.add(w[field]);
    out.push(w[field]);
  }
  return out;
}

/* ---------- generous grading for typed answers ---------- */
function extractAlternatives(englishStr) {
  let alts = [];
  const parenRegex = /\(([^)]+)\)/g;
  let m;
  while ((m = parenRegex.exec(englishStr)) !== null) alts.push(m[1]);
  const cleaned = englishStr.replace(parenRegex, '');
  cleaned.split(/[,;]/).forEach(seg => {
    seg.split('/').forEach(sub => {
      const t = sub.trim();
      if (t) alts.push(t);
    });
  });
  return alts.filter(Boolean);
}

function normalizeAnswer(s) {
  return s.toLowerCase().trim()
    .replace(/^i\s+/, '')
    .replace(/^(a|an|the)\s+/, '')
    .replace(/[.!?]+$/, '')
    .replace(/\s+/g, ' ');
}

function wordBoundaryMatch(haystack, needle) {
  if (!needle) return false;
  const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('\\b' + escaped + '\\b').test(haystack);
}

function checkTypedAnswer(userInput, correctEnglish) {
  const user = normalizeAnswer(userInput);
  if (!user) return false;
  const alts = extractAlternatives(correctEnglish).map(normalizeAnswer);
  return alts.some(alt => {
    if (!alt) return false;
    if (user === alt) return true;
    if (alt.split(' ').length === 1) {
      return wordBoundaryMatch(user, alt) || wordBoundaryMatch(alt, user);
    }
    return user.includes(alt) || alt.includes(user);
  });
}

/* ---------- quiz construction ---------- */
function makeQuizItems(sourceItems, pool, settings) {
  return sourceItems.map(item => {
    let dir = settings.mode === 'typed' ? 'gtoe' : settings.direction;
    if (dir === 'mixed') dir = Math.random() < 0.5 ? 'gtoe' : 'etog';
    const answerField = dir === 'gtoe' ? 'english' : 'greek';
    const promptField = dir === 'gtoe' ? 'greek' : 'english';
    const q = {
      item, dir, promptField, answerField,
      prompt: item[promptField],
      correctAnswer: item[answerField]
    };
    if (settings.mode === 'mc') {
      const distractors = pickDistractors(item, pool, answerField, 3);
      q.options = shuffle([item[answerField], ...distractors]);
    }
    return q;
  });
}

function startQuiz(settings) {
  const chapters = [...settings.selectedChapters].sort((a, b) => a - b);
  const pool = buildPool(chapters);
  const n = Math.min(settings.count, pool.length);
  const chosen = shuffle(pool).slice(0, n);
  state.cards = null;
  state.lastSession = 'quiz';
  state.quiz = {
    settings: { ...settings, selectedChapters: chapters },
    pool,
    items: makeQuizItems(chosen, pool, settings),
    index: 0,
    score: 0,
    answered: false,
    selectedOpt: null,
    typedValue: '',
    typedCorrect: null
  };
  state.screen = 'flashcard';
  render();
}

function quickResume() {
  const ch = continueChapter();
  startQuiz({
    selectedChapters: new Set([ch]),
    count: (VOCAB[ch] || []).length,
    direction: 'gtoe',
    mode: 'mc'
  });
}

function quizInProgress() {
  return !!(state.quiz && state.quiz.index < state.quiz.items.length);
}

function goHome() { state.screen = 'home'; render(); }

function goQuizTab() {
  const cards = cardsInProgress(), quiz = quizInProgress();
  state.screen = (cards && (state.lastSession === 'cards' || !quiz)) ? 'cards' : 'flashcard';
  render();
}

function openSetup() {
  state.setup.step = 1;
  state.setup.anim = 'fwd';
  state.screen = 'setup';
  render();
}

function goProgress() { state.screen = 'progress'; render(); }

function exitQuiz() {
  if (window.confirm("Exit this quiz? Your progress on this quiz will be lost.")) {
    state.quiz = null;
    state.screen = 'home';
    render();
  }
}

function shuffleRandomWord() {
  state.randomWord = pickRandomWord();
  state.randomWordRevealed = false;
  render();
}

function revealRandomWord() {
  state.randomWordRevealed = true;
}

/* ---------- quiz setup screen actions ---------- */
function toggleSetupChapter(ch) {
  if (state.setup.selectedChapters.has(ch)) state.setup.selectedChapters.delete(ch);
  else state.setup.selectedChapters.add(ch);
  render();
}
function setupSelectAll() { CHAPTERS.forEach(c => state.setup.selectedChapters.add(c)); render(); }
function setupSelectNone() { state.setup.selectedChapters.clear(); render(); }
function setSetupMode(m) {
  state.setup.mode = m;
  if (m === 'typed') state.setup.direction = 'gtoe';
  render();
}
function setSetupDirection(d) { state.setup.direction = d; render(); }
function setSetupCount(n) { state.setup.count = n; render(); }

/* the steps that actually apply for the chosen format:
   flashcards stop after the format step, type-answer skips direction */
function stepPath() {
  if (state.setup.mode === 'cards') return [1, 2];
  if (state.setup.mode === 'typed') return [1, 2, 4, 5];
  return [1, 2, 3, 4, 5];
}

function goToStep(n, anim) {
  state.setup.step = n;
  state.setup.anim = anim || 'fwd';
  render();
}

function setupNext() {
  const step = state.setup.step;
  if (step === 1) { goToStep(2, 'fwd'); return; }
  if (step === 2) {
    if (state.setup.mode === 'cards') { startCards(); return; }
    goToStep(state.setup.mode === 'typed' ? 4 : 3, 'fwd');
    return;
  }
  if (step === 3) { goToStep(4, 'fwd'); return; }
  if (step === 4) { goToStep(5, 'fwd'); return; }
}

function setupBack() {
  const step = state.setup.step;
  if (step === 1) { goHome(); return; }
  if (step === 2) { goToStep(1, 'back'); return; }
  if (step === 3) { goToStep(2, 'back'); return; }
  if (step === 4) { goToStep(state.setup.mode === 'mc' ? 3 : 2, 'back'); return; }
  goToStep(4, 'back');
}

/* choosing a format / direction / word count also moves the flow along, so a
   step is a single tap -- prior choices are kept, so Back is non-destructive */
function chooseFormat(m) { setSetupMode(m); setupNext(); }
function chooseDirection(d) { state.setup.direction = d; setupNext(); }
function chooseCount(n) { state.setup.count = n; setupNext(); }

/* ---------- flashcard sessions (no scoring: browsing only, like the review card) ---------- */
function startCards() {
  const chapters = [...state.setup.selectedChapters].sort((a, b) => a - b);
  const pool = buildPool(chapters);
  if (!pool.length) return;
  state.cards = { chapters, items: shuffle(pool), index: 0, revealed: false };
  state.lastSession = 'cards';
  state.screen = 'cards';
  render();
}

function cardsInProgress() { return !!(state.cards && state.cards.index < state.cards.items.length); }

function nextCard() {
  const c = state.cards;
  if (!c) return;
  if (c.index >= c.items.length - 1) { exitCards(); return; }
  c.index += 1;
  c.revealed = false;
  render();
}

function prevCard() {
  const c = state.cards;
  if (!c || c.index === 0) return;
  c.index -= 1;
  c.revealed = false;
  render();
}

function exitCards() {
  state.cards = null;
  state.screen = 'home';
  render();
}

function launchSetupQuiz() {
  const pool = buildPool([...state.setup.selectedChapters]);
  const minNeeded = state.setup.mode === 'typed' ? 1 : 4;
  if (pool.length < minNeeded) return;
  startQuiz({
    selectedChapters: new Set(state.setup.selectedChapters),
    count: state.setup.count,
    direction: state.setup.direction,
    mode: state.setup.mode
  });
}

/* ---------- answering ---------- */
function goNextQuestion(q) {
  if (q.index < q.items.length - 1) {
    q.index += 1;
    q.answered = false;
    q.selectedOpt = null;
    q.typedValue = '';
    q.typedCorrect = null;
    render();
  } else {
    state.screen = 'home';
    render();
  }
}

function selectOption(opt) {
  const q = state.quiz;
  if (!q || q.answered) return;
  q.answered = true;
  q.selectedOpt = opt;
  const current = q.items[q.index];
  const correct = opt === current.correctAnswer;
  if (correct) q.score += 1;
  bumpStreak();
  recordAttempt(current.item.chapter, current.item.greek, correct);
  render();
  setTimeout(() => { if (state.quiz === q) goNextQuestion(q); }, correct ? 650 : 1500);
}

function submitTyped() {
  const q = state.quiz;
  if (!q || q.answered) return;
  const input = document.getElementById('typed-input');
  const val = input ? input.value : '';
  const current = q.items[q.index];
  const correct = checkTypedAnswer(val, current.correctAnswer);
  q.answered = true;
  q.typedValue = val;
  q.typedCorrect = correct;
  if (correct) q.score += 1;
  bumpStreak();
  recordAttempt(current.item.chapter, current.item.greek, correct);
  render();
  setTimeout(() => { if (state.quiz === q) goNextQuestion(q); }, correct ? 650 : 1800);
}

/* ---------- rendering ---------- */
function glassLayer() { return '<div class="glass-fill"></div><div class="glass-edge"></div>'; }

/* time-of-day greeting, unless a session has already been logged today */
function greeting() {
  if (state.streak.lastDate === todayStr()) return 'Welcome Back!';
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Good Morning!';
  if (h >= 12 && h < 18) return 'Good Afternoon!';
  return 'Good Evening!';
}

/* one compact line of stats, all derived from data the app already stores */
function homeStatsLine() {
  const st = overallStats();
  const learned = learnedWordsCount();
  const bits = [
    `<span class="stat-bit"><strong>${learned}</strong> ${learned === 1 ? 'word' : 'words'} learned</span>`,
    `<span class="stat-bit">${state.streak.count > 0 ? `<strong>${state.streak.count}</strong>-day streak` : 'No streak yet'}</span>`,
    `<span class="stat-bit"><strong>${st.chaptersMastered}</strong> of ${st.totalChapters} chapters</span>`
  ];
  return bits.join('<span class="sep">\u00b7</span>');
}

function renderHeader(isHome, pillLabel, showClose) {
  let right = '';
  if (showClose) {
    right = `<button class="icon-btn" id="btn-exit-quiz" title="Close" aria-label="Close">
         <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 2.5l11 11M13.5 2.5l-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
       </button>`;
  } else if (!isHome) {
    right = `<div class="pill glass">${glassLayer()}<div class="glass-content">${pillLabel}</div></div>`;
  }
  return `
    <div class="header-row">
      <div>
        <p class="app-title">Oikos</p>
        <div class="app-tagline">Learning to belong in God's Word</div>
      </div>
      ${right}
    </div>
  `;
}

/* a flip card: same component for a flashcard session and the review word */
function flipCard(id, frontKicker, frontText, backKicker, backText, backHint) {
  return `
    <div class="prompt-panel glass flip" id="${id}">
      ${glassLayer()}
      <div class="glass-content flip-inner">
        <div class="flip-face flip-front">
          <div class="kicker">${frontKicker}</div>
          <div class="prompt-word" style="margin-top:12px">${frontText}</div>
        </div>
        <div class="flip-face flip-back">
          <div class="kicker">${backKicker}</div>
          <div class="prompt-word is-english" style="margin-top:12px">${backText}</div>
          ${backHint ? `<div class="flip-hint text-muted">${backHint}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderHome() {
  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(true)}

      <div class="home-hero">
        <h1 class="greeting">${greeting()}</h1>
        <div class="stats-line">${homeStatsLine()}</div>
      </div>

      <div class="home-actions">
        <button class="start-btn" id="btn-start-learning">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>Start Learning</span>
        </button>
        <div class="home-secondary">
          <button class="link-btn" id="btn-continue">Continue chapter ${continueChapter()}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btn-start-learning').addEventListener('click', openSetup);
  document.getElementById('btn-continue').addEventListener('click', quickResume);
}

/* ---------- step-by-step quiz setup ---------- */
const FORMAT_LABELS = { mc: 'Multiple Choice', typed: 'Type Answer', cards: 'Flashcards' };
const DIRECTION_LABELS = { gtoe: 'Greek → English', etog: 'English → Greek', mixed: 'Mixed' };

function chaptersLabel(chapters) {
  if (!chapters.length) return 'No chapters';
  if (chapters.length === CHAPTERS.length) return `All ${CHAPTERS.length} chapters`;
  return `${chapters.length} chapter${chapters.length === 1 ? '' : 's'}`;
}

function tickIcon() {
  return '<span class="choice-tick"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
}

function choiceBtn(attr, value, active, label, sub) {
  return `
    <button class="choice-btn ${active ? 'active' : ''}" ${attr}="${value}">
      <span><span>${label}</span>${sub ? `<span class="choice-sub">${sub}</span>` : ''}</span>
      ${tickIcon()}
    </button>
  `;
}

function renderSetup() {
  const s = state.setup;
  const path = stepPath();
  const stepIndex = Math.max(0, path.indexOf(s.step));
  const chapters = [...s.selectedChapters].sort((a, b) => a - b);
  const poolSize = buildPool(chapters).length;

  let title = '', hint = '', body = '', footer = '';

  if (s.step === 1) {
    title = 'Choose your chapters';
    hint = 'Pick one, several, or all of them.';
    const chips = CHAPTERS.map(c =>
      `<button class="chapter-chip selectable ${s.selectedChapters.has(c) ? 'selected' : ''}" data-ch="${c}">${c}</button>`
    ).join('');
    body = `
      <div class="setup-label-row">
        <span class="kicker">CHAPTERS</span>
        <span>
          <button class="link-btn" id="btn-sel-all">Select all</button>
          &nbsp;&nbsp;
          <button class="link-btn" id="btn-sel-none">Clear</button>
        </span>
      </div>
      <div class="chapters-grid">${chips}</div>
    `;
    footer = `
      <button class="start-btn step-next" id="btn-step-next" ${chapters.length ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${chapters.length ? `Next — ${chaptersLabel(chapters)}, ${poolSize} words` : 'Select at least one chapter'}</span>
      </button>
    `;
  } else if (s.step === 2) {
    title = 'How do you want to learn?';
    hint = 'Flashcards start straight away — no further setup.';
    body = `<div class="stack">
      ${choiceBtn('data-mode', 'mc', s.mode === 'mc', 'Multiple Choice', 'Pick the right meaning from four options')}
      ${choiceBtn('data-mode', 'typed', s.mode === 'typed', 'Type Answer', 'Write the English meaning yourself')}
      ${choiceBtn('data-mode', 'cards', s.mode === 'cards', 'Flashcards', 'Tap to flip — browse at your own pace')}
    </div>`;
  } else if (s.step === 3) {
    title = 'Which direction?';
    hint = 'How each question is asked.';
    body = `<div class="stack">
      ${choiceBtn('data-dir', 'gtoe', s.direction === 'gtoe', DIRECTION_LABELS.gtoe, 'See the Greek, choose the meaning')}
      ${choiceBtn('data-dir', 'etog', s.direction === 'etog', DIRECTION_LABELS.etog, 'See the meaning, choose the Greek')}
      ${choiceBtn('data-dir', 'mixed', s.direction === 'mixed', DIRECTION_LABELS.mixed, 'A mix of both, question by question')}
    </div>`;
  } else if (s.step === 4) {
    title = 'How many words?';
    hint = poolSize < 30 ? `Your selection has ${poolSize} words — shorter quizzes stop early.` : 'Drawn at random from your chapters.';
    body = `<div class="stack">
      ${choiceBtn('data-count', '10', s.count === 10, '10 words', 'A quick session')}
      ${choiceBtn('data-count', '20', s.count === 20, '20 words', 'The usual drill')}
      ${choiceBtn('data-count', '30', s.count === 30, '30 words', 'A longer stretch')}
    </div>`;
  } else {
    const minNeeded = s.mode === 'typed' ? 1 : 4;
    const canStart = poolSize >= minNeeded;
    const parts = [chaptersLabel(chapters), FORMAT_LABELS[s.mode]];
    parts.push(s.mode === 'typed' ? DIRECTION_LABELS.gtoe : DIRECTION_LABELS[s.direction]);
    parts.push(`${Math.min(s.count, poolSize)} words`);
    title = 'Ready when you are';
    hint = '';
    body = `
      <div class="summary-card">
        <div class="summary-line">${parts.join(' · ')}</div>
        <div class="summary-sub text-muted">${chapters.length && chapters.length !== CHAPTERS.length ? 'Chapter ' + chapters.join(', ') : 'Every chapter in the course'}</div>
      </div>
    `;
    footer = `
      <button class="start-btn step-next" id="btn-launch" ${canStart ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${canStart ? 'Start Learning' : 'Select more chapters'}</span>
      </button>
    `;
  }

  const pct = Math.round(((stepIndex + 1) / path.length) * 100);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'New session')}

      <div class="setup-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="setup-topbar">
            <button class="back-btn" id="btn-step-back" title="Back" aria-label="Back">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 2.5 4.5 8l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="step-count">Step ${stepIndex + 1} of ${path.length}</span>
          </div>
          <div class="step-track"><div class="step-fill" style="width:${pct}%"></div></div>

          <div class="${s.anim === 'back' ? 'step-in-back' : 'step-in-fwd'}">
            <h2 class="step-title">${title}</h2>
            ${hint ? `<p class="step-hint text-muted">${hint}</p>` : ''}
            ${body}
            ${footer}
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btn-step-back').addEventListener('click', setupBack);

  if (s.step === 1) {
    document.querySelectorAll('.chapter-chip').forEach(el => {
      el.addEventListener('click', () => toggleSetupChapter(Number(el.dataset.ch)));
    });
    document.getElementById('btn-sel-all').addEventListener('click', setupSelectAll);
    document.getElementById('btn-sel-none').addEventListener('click', setupSelectNone);
    if (chapters.length) document.getElementById('btn-step-next').addEventListener('click', setupNext);
  } else if (s.step === 2) {
    document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => chooseFormat(el.dataset.mode)));
  } else if (s.step === 3) {
    document.querySelectorAll('[data-dir]').forEach(el => el.addEventListener('click', () => chooseDirection(el.dataset.dir)));
  } else if (s.step === 4) {
    document.querySelectorAll('[data-count]').forEach(el => el.addEventListener('click', () => chooseCount(Number(el.dataset.count))));
  } else {
    const launch = document.getElementById('btn-launch');
    if (!launch.disabled) launch.addEventListener('click', launchSetupQuiz);
  }
}

/* ---------- flashcard session ---------- */
function renderCards() {
  const c = state.cards;
  if (!c) { goHome(); return; }
  const total = c.items.length;
  const w = c.items[c.index];
  const pct = Math.round(((c.index + 1) / total) * 100);
  const isLast = c.index === total - 1;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Flashcards', true)}

      <div class="progress-row">
        <span>Card ${c.index + 1} of ${total}</span>
        <span>Chapter ${w.chapter}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      ${flipCard('flip-card', 'GREEK WORD — TAP TO FLIP', w.greek, 'ENGLISH MEANING', w.english, `Chapter ${w.chapter} · ${w.greek}`)}

      <div class="card-actions">
        <button class="ghost-btn" id="btn-prev-card" ${c.index === 0 ? 'disabled' : ''}>Previous</button>
        <button class="start-btn" id="btn-next-card" style="margin-top:0">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>${isLast ? 'Finish' : 'Next card'}</span>
        </button>
      </div>
    </div>
  `;

  wireFlipCard('flip-card', () => { c.revealed = true; });
  document.getElementById('btn-prev-card').addEventListener('click', prevCard);
  document.getElementById('btn-next-card').addEventListener('click', nextCard);
  document.getElementById('btn-exit-quiz').addEventListener('click', exitCards);
}

/* flips in the DOM rather than re-rendering, so the transition actually plays */
function wireFlipCard(id, onFlip) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', () => {
    const flipped = el.classList.toggle('is-flipped');
    if (flipped && onFlip) onFlip();
  });
}

function renderQuizTab() {
  if (quizInProgress()) { renderFlashcard(); return; }
  if (cardsInProgress()) { renderCards(); return; }
  renderQuizEmpty();
}

function renderQuizEmpty() {
  if (!state.randomWord) state.randomWord = pickRandomWord();
  const w = state.randomWord;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Review')}

      <div class="quiz-empty-note text-muted">No quiz in progress — tap Start Learning to set one up. In the meantime, here's a word to learn:</div>

      ${flipCard('flip-card', 'GREEK WORD — TAP TO REVEAL', w.greek, 'ENGLISH MEANING', w.english, `Chapter ${w.chapter} · ${w.greek}`)}

      <div class="quiz-empty-actions">
        <button class="ghost-btn" id="btn-shuffle-word">Shuffle word</button>
        <button class="start-btn" id="btn-goto-home" style="margin-top:0">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>Start Learning</span>
        </button>
      </div>
    </div>
  `;

  wireFlipCard('flip-card', revealRandomWord);
  document.getElementById('btn-shuffle-word').addEventListener('click', shuffleRandomWord);
  document.getElementById('btn-goto-home').addEventListener('click', openSetup);
}

function renderFlashcard() {
  const q = state.quiz;
  const total = q.items.length;
  const current = q.items[q.index];
  const pct = Math.round((q.index / total) * 100);
  const isEnglishPrompt = current.promptField === 'english';
  const tag = current.dir === 'gtoe' ? 'GIVE THE ENGLISH MEANING' : 'GIVE THE GREEK WORD';

  let bodyHtml;
  if (q.settings.mode === 'mc') {
    const optionsHtml = current.options.map(opt => {
      let cls = '', icon = '';
      if (q.answered) {
        if (opt === current.correctAnswer) {
          cls = 'is-correct';
          icon = '<span class="option-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
        } else if (opt === q.selectedOpt) {
          cls = 'is-wrong';
          icon = '<span class="option-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>';
        } else {
          cls = 'is-faded';
        }
      }
      return `
        <button class="option-btn ${cls}" data-opt="${opt.replace(/"/g, '&quot;')}" ${q.answered ? 'disabled' : ''}>
          <div class="option-fill"></div>
          <div class="option-edge"></div>
          <div class="option-content"><span>${opt}</span>${icon}</div>
        </button>
      `;
    }).join('');
    bodyHtml = `<div class="options">${optionsHtml}</div>`;
  } else {
    const wrapCls = q.answered ? (q.typedCorrect ? 'is-correct' : 'is-wrong') : '';
    const feedback = q.answered
      ? (q.typedCorrect ? 'Correct.' : `Accepted answer: ${current.correctAnswer}`)
      : '';
    bodyHtml = `
      <div class="typed-row">
        <div class="typed-input-wrap glass ${wrapCls}">
          ${glassLayer()}
          <input class="typed-input" id="typed-input" type="text" autocomplete="off" autocapitalize="off"
            autocorrect="off" spellcheck="false" placeholder="Type the English meaning…" ${q.answered ? 'disabled' : ''}>
        </div>
        <button class="typed-submit" id="typed-submit" ${q.answered ? 'disabled' : ''}>
          <div class="resume-fill"></div>
          <span>Check</span>
        </button>
      </div>
      <div class="typed-feedback text-muted">${feedback}</div>
    `;
  }

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Review', true)}

      <div class="progress-row">
        <span>Question ${q.index + 1} of ${total}</span>
        <span>Score ${q.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="prompt-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">${tag}</div>
          <div class="prompt-word ${isEnglishPrompt ? 'is-english' : ''}" style="margin-top:12px">${current.prompt}</div>
        </div>
      </div>

      ${bodyHtml}
    </div>
  `;

  if (q.settings.mode === 'mc') {
    if (!q.answered) {
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.opt));
      });
    }
  } else {
    const input = document.getElementById('typed-input');
    const submitBtn = document.getElementById('typed-submit');
    if (!q.answered) {
      input.focus();
      submitBtn.addEventListener('click', submitTyped);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitTyped(); }
      });
    }
  }

  document.getElementById('btn-exit-quiz').addEventListener('click', exitQuiz);
}

function ringSvg(pct) {
  const circ = 2 * Math.PI * 54;
  const offset = circ * (1 - pct / 100);
  return `
    <svg width="108" height="108" viewBox="0 0 128 128" style="margin:0 auto;display:block">
      <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(32,30,29,0.08)" stroke-width="10"/>
      <circle cx="64" cy="64" r="54" fill="none" stroke="#4f7a5c" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 64 64)"/>
      <text x="64" y="70" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="24" fill="#201e1d">${pct}%</text>
    </svg>
  `;
}

function renderProgress() {
  const stats = overallStats();
  const learned = learnedWordsCount();
  const progressPct = stats.totalWords > 0 ? Math.round((learned / stats.totalWords) * 100) : 0;

  const chapterRows = CHAPTERS.map(c => {
    const pct = chapterMastery(c);
    return `
      <div class="chapter-row">
        <div class="ch-num">${c}</div>
        <div class="ch-track"><div class="ch-fill" style="width:${pct}%"></div></div>
        <div class="ch-pct">${pct}%</div>
      </div>
    `;
  }).join('');

  const missed = wordsToReview(8);
  const missedHtml = missed.length
    ? missed.map(m => `
        <div class="missed-row">
          <span class="missed-greek">${m.greek}</span>
          <span class="missed-english text-muted">${m.english}</span>
        </div>
      `).join('')
    : '<div class="empty-note text-muted">No missed words yet — well done.</div>';

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Progress')}

      <div class="rings-row">
        <div class="ring-panel glass">
          ${glassLayer()}
          <div class="glass-content">
            <div class="kicker">ACCURACY</div>
            ${ringSvg(stats.accuracy)}
            <div class="ring-label text-muted">${stats.wordsSeen} words answered</div>
          </div>
        </div>
        <div class="ring-panel glass">
          ${glassLayer()}
          <div class="glass-content">
            <div class="kicker">PROGRESS</div>
            ${ringSvg(progressPct)}
            <div class="ring-label text-muted">${learned} of ${stats.totalWords} words learned</div>
          </div>
        </div>
      </div>

      <div class="kicker" style="margin:0 0 10px">WORDS TO REVIEW</div>
      <div class="list-panel glass">${glassLayer()}<div class="glass-content">${missedHtml}</div></div>

      <div class="kicker" style="margin:0 0 10px">BY CHAPTER</div>
      <div class="list-panel glass" style="margin-bottom:0">${glassLayer()}<div class="glass-content">${chapterRows}</div></div>
    </div>
  `;
}

function renderTabBar() {
  document.getElementById('tab-home').classList.toggle('active', state.screen === 'home' || state.screen === 'setup');
  document.getElementById('tab-review').classList.toggle('active', state.screen === 'flashcard' || state.screen === 'cards');
  document.getElementById('tab-progress').classList.toggle('active', state.screen === 'progress');
}

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'flashcard') renderQuizTab();
  else if (state.screen === 'cards') renderCards();
  else if (state.screen === 'progress') renderProgress();
  renderTabBar();
}

document.getElementById('tab-home').addEventListener('click', goHome);
document.getElementById('tab-review').addEventListener('click', goQuizTab);
document.getElementById('tab-progress').addEventListener('click', goProgress);

(async function init() {
  await loadData();
  render();
})();
</script>
</body>
</html>
