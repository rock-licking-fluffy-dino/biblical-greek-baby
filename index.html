/* ---------- grammar: Parse ----------
   The third drill. One real inflected word from the New Testament is shown
   and the student names it by tapping: case, number and gender, or tense,
   voice and mood and what follows from the mood. No typed Greek anywhere,
   for the same reason Sort the Table has none.

   Every form carries every parsing it can bear (PARSE_DATA, built by
   scripts/build_parse_data.py), and an answer that matches any one of them
   is right: λόγου could be either of two, and marking the one not thought of
   wrong would teach the wrong thing. Stats stay light, like the other two
   drills: { attempts, correct } per part of speech, and for verbs per mood
   and per indicative tense. No FSRS. */

const PARSE_STATS_KEY = 'oikos-parse-stats';

/* the buttons, in the order they are laid out. Codes are the ones the data
   uses (see the script header). */
const PARSE_FIELDS = {
  person: { label: 'Person', opts: [['1', '1st'], ['2', '2nd'], ['3', '3rd']] },
  case:   { label: 'Case', opts: [['N', 'Nom'], ['G', 'Gen'], ['D', 'Dat'], ['A', 'Acc'], ['V', 'Voc']] },
  number: { label: 'Number', opts: [['S', 'Sg'], ['P', 'Pl']] },
  gender: { label: 'Gender', opts: [['M', 'Masc'], ['F', 'Fem'], ['N', 'Neut']] },
  tense:  { label: 'Tense', opts: [['P', 'Present'], ['I', 'Imperfect'], ['F', 'Future'], ['A', 'Aorist'], ['R', 'Perfect'], ['L', 'Pluperfect']] },
  voice:  { label: 'Voice', opts: [['A', 'Active'], ['M', 'Middle'], ['P', 'Passive']] },
  mood:   { label: 'Mood', opts: [['I', 'Indicative'], ['S', 'Subjunctive'], ['M', 'Imperative'], ['N', 'Infinitive'], ['P', 'Participle'], ['O', 'Optative']] }
};
const PARSE_TENSE_NAMES = { P: 'Present', I: 'Imperfect', F: 'Future', A: 'Aorist', R: 'Perfect', L: 'Pluperfect' };
const PARSE_VOICE_NAMES = { A: 'Active', M: 'Middle', P: 'Passive', E: 'Middle/Passive' };
const PARSE_MOOD_NAMES = { I: 'Indicative', S: 'Subjunctive', M: 'Imperative', N: 'Infinitive', P: 'Participle', O: 'Optative' };
const PARSE_CASE_NAMES = { N: 'nominative', G: 'genitive', D: 'dative', A: 'accusative', V: 'vocative' };
const PARSE_NUMBER_NAMES = { S: 'singular', P: 'plural' };
const PARSE_GENDER_NAMES = { M: 'masculine', F: 'feminine', N: 'neuter' };
const PARSE_PERSON_NAMES = { 1: '1st person', 2: '2nd person', 3: '3rd person' };

/* the four word types on the setup screen; the article counts as a noun */
const PARSE_TYPES = [
  { key: 'noun', label: 'Nouns', sub: 'Including the article' },
  { key: 'pronoun', label: 'Pronouns', sub: 'Personal, relative, demonstrative and the rest' },
  { key: 'adjective', label: 'Adjectives', sub: 'Including numbers that decline' },
  { key: 'verb', label: 'Verbs', sub: 'Every mood, with participles and infinitives' }
];
const PARSE_POS_LABELS = { noun: 'Nouns', article: 'The article', pronoun: 'Pronouns', adjective: 'Adjectives', verb: 'Verbs' };

/* "AAI3S:12" -> { code, ch, f: { tense, voice, mood, person, number } } */
function parseCode(raw, pos) {
  const [code, ch] = raw.split(':');
  const f = {};
  let rest = code;
  if (pos === 'verb') {
    f.tense = code[0]; f.voice = code[1]; f.mood = code[2];
    rest = code.slice(3);
    if (f.mood === 'P') { f.case = rest[0]; f.number = rest[1]; f.gender = rest[2]; }
    else if (f.mood !== 'N') { f.person = rest[0]; f.number = rest[1]; }
  } else {
    if (/^[123]/.test(rest)) { f.person = rest[0]; rest = rest.slice(1); }
    f.case = rest[0]; f.number = rest[1];
    if (rest[2]) f.gender = rest[2];
  }
  return { code, ch: ch ? Number(ch) : 0, f };
}

/* the lexeme table, joined to the vocabulary so a category selection can
   find its forms: lexeme -> { gloss, greek, ch, cat } */
const PARSE_LEX = (() => {
  const out = {};
  Object.keys(PARSE_DATA.L).forEach(l => {
    const [gloss, greek, ch] = PARSE_DATA.L[l];
    const w = (VOCAB[ch] || []).find(v => v.greek.trim() === greek);
    out[l] = { gloss, greek, ch, cat: w ? w.cat : null };
  });
  return out;
})();

const PARSE_ENTRIES = PARSE_DATA.e.map(r => ({
  f: r[0], l: r[1], pos: r[2], ch: r[3], n: r[5],
  p: r[4].map(c => parseCode(c, r[2]))
}));

/* a handful of forms belong to two course words (αὑτῷ is filed under both
   αὐτός and ἑαυτοῦ). A parsing that is right for the other one is still a
   right answer, so marking looks across every entry with the same form and
   the same part of speech. */
const PARSE_BY_FORM = (() => {
  const m = new Map();
  PARSE_ENTRIES.forEach(e => {
    const k = e.f + '|' + e.pos;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(e);
  });
  return m;
})();

function parseType(e) { return e.pos === 'article' ? 'noun' : e.pos; }
function parseHasPerson(e) { return e.pos === 'pronoun' && e.p.some(p => p.f.person); }

function saveParseStats() { storageAdapter.set(PARSE_STATS_KEY, JSON.stringify(state.parseStats)); }

/* ---------- choosing the pool ---------- */
function parseSelection() {
  const s = state.parseSetup;
  if (s.selectBy === 'categories') {
    return { by: 'categories', chapters: [], categories: CATEGORY_NAMES.filter(c => s.selectedCategories.has(c)) };
  }
  return chapterSelection([...s.selectedChapters]);
}

function parseEntriesForSelection(sel) {
  if (sel.by === 'categories') {
    const cats = new Set(sel.categories);
    return PARSE_ENTRIES.filter(e => cats.has(PARSE_LEX[e.l].cat));
  }
  const chs = new Set(sel.chapters);
  return PARSE_ENTRIES.filter(e => chs.has(PARSE_LEX[e.l].ch));
}

/* the furthest chapter the selection reaches, which is what "taught so far"
   is measured against. A category selection reaches as far as its latest
   word. */
function parseSelectionMaxChapter(sel) {
  if (sel.by === 'categories') {
    const cats = new Set(sel.categories);
    let max = 0;
    CHAPTERS.forEach(ch => (VOCAB[ch] || []).forEach(w => { if (cats.has(w.cat) && ch > max) max = ch; }));
    return max;
  }
  return sel.chapters.length ? Math.max(...sel.chapters) : 0;
}

function parseTypesAvailable(entries) {
  const have = new Set(entries.map(parseType));
  return PARSE_TYPES.filter(t => have.has(t.key)).map(t => t.key);
}

/* the types that are both chosen and have something in the selection */
function parseActiveTypes(entries) {
  const s = state.parseSetup;
  return parseTypesAvailable(entries).filter(t => s.types.has(t));
}

function parseTaughtTenses(maxCh) { return Object.keys(PARSE_DATA.t).filter(t => PARSE_DATA.t[t] <= maxCh); }
function parseTaughtMoods(maxCh) { return Object.keys(PARSE_DATA.m).filter(m => PARSE_DATA.m[m] <= maxCh); }

function setParseChipsTaught() {
  const s = state.parseSetup;
  const sel = parseSelection();
  const maxCh = parseSelectionMaxChapter(sel);
  s.tenses = new Set(parseTaughtTenses(maxCh));
  s.moods = new Set(parseTaughtMoods(maxCh));
  s.chipsFor = JSON.stringify(sel);
}

/* a verb qualifies when at least one of its parsings sits under a chosen
   tense and a chosen mood */
function parseVerbQualifies(e) {
  const s = state.parseSetup;
  return e.p.some(p => s.tenses.has(p.f.tense) && s.moods.has(p.f.mood));
}

function parsePool() {
  const entries = parseEntriesForSelection(parseSelection());
  const types = new Set(parseActiveTypes(entries));
  return entries.filter(e => types.has(parseType(e)) && (parseType(e) !== 'verb' || parseVerbQualifies(e)));
}

/* "Ch 1–6, 9" for a chapter selection, the usual label for categories */
function parseSelectionLabel(sel) {
  if (sel.by === 'categories') return categoriesLabel(sel.categories);
  const chs = sel.chapters;
  if (!chs.length) return 'No chapters';
  if (chs.length === CHAPTERS.length) return 'All chapters';
  const runs = [];
  chs.forEach(c => {
    const last = runs[runs.length - 1];
    if (last && c === last[1] + 1) last[1] = c; else runs.push([c, c]);
  });
  return 'Ch ' + runs.map(([a, b]) => a === b ? String(a) : `${a}–${b}`).join(', ');
}

/* ---------- picking the questions ----------
   Weighted by the square root of how often the form occurs, so ἐστιν comes
   up more than a form found once without drowning everything else out. No
   form twice in a session, even where two course words share it. */
function pickParseItems(pool, count) {
  const keyed = pool.map(e => ({ e, k: Math.pow(Math.random(), 1 / Math.sqrt(Math.max(1, e.n))) }));
  keyed.sort((a, b) => b.k - a.k);
  const seen = new Set();
  const out = [];
  for (const { e } of keyed) {
    if (out.length >= count) break;
    if (seen.has(e.f)) continue;
    seen.add(e.f);
    out.push(e);
  }
  return out;
}

function startParse() {
  const pool = parsePool();
  if (!pool.length) return;
  const selection = parseSelection();
  state.parse = {
    selection,
    maxCh: parseSelectionMaxChapter(selection),
    items: pickParseItems(pool, state.parseSetup.count),
    index: 0, picks: {}, answered: false, correct: null, best: null,
    score: 0, results: [], done: false, startedAt: Date.now()
  };
  state.screen = 'parse';
  render();
}

function exitParse() { state.parse = null; goGrammar(); }

/* ---------- the question ---------- */

/* which rows are showing, given what has been picked so far. A verb shows
   tense, voice and mood first, and the mood decides the rest; a wrong mood
   shows the wrong rows, which is fine -- it is already wrong at the mood. */
function parseRowsFor(e, picks) {
  if (e.pos === 'verb') {
    const rows = ['tense', 'voice', 'mood'];
    const m = picks.mood;
    if (m === 'P') rows.push('case', 'number', 'gender');
    else if (m && m !== 'N') rows.push('person', 'number');
    return rows;
  }
  if (parseHasPerson(e)) {
    const rows = ['person', 'case', 'number'];
    if (picks.person !== '1' && picks.person !== '2') rows.push('gender');
    return rows;
  }
  return ['case', 'number', 'gender'];
}

/* one field of one parsing against the pick. Middle/Passive (the present,
   imperfect, perfect and pluperfect, where the two share their forms) takes
   either answer. */
function parseFieldOk(p, key, val) {
  if (key === 'voice' && p.f.voice === 'E') return val === 'M' || val === 'P';
  return p.f[key] === val;
}

function parseAllParsings(e) {
  const out = [];
  const seen = new Set();
  (PARSE_BY_FORM.get(e.f + '|' + e.pos) || [e]).forEach(x => x.p.forEach(p => {
    if (!seen.has(p.code)) { seen.add(p.code); out.push(p); }
  }));
  return out;
}

/* right if the rows showing name one valid parsing exactly, with nothing
   left over on either side */
function parseMatches(p, rows, picks) {
  const keys = Object.keys(p.f);
  if (keys.length !== rows.length) return false;
  return rows.every(r => p.f[r] !== undefined && parseFieldOk(p, r, picks[r]));
}

/* the parsing nearest the answer, for marking the rows and for the stats:
   the one it matches, or else the one sharing the most fields with it */
function parseBest(e, rows, picks) {
  const all = parseAllParsings(e);
  let best = all[0], bestScore = -1;
  all.forEach(p => {
    if (parseMatches(p, rows, picks)) { if (bestScore < 99) { best = p; bestScore = 99; } return; }
    const score = rows.filter(r => p.f[r] !== undefined && parseFieldOk(p, r, picks[r])).length;
    if (score > bestScore) { best = p; bestScore = score; }
  });
  return best;
}

function parseSelect(key, val) {
  const q = state.parse;
  if (!q || q.answered) return;
  q.picks[key] = val;
  render();
}

/* recorded as it is answered, like recordQuizAnswer, so a session left
   halfway still counts for what was done */
function recordParseAnswer(e, p, correct) {
  const st = state.parseStats;
  const bump = (group, key) => {
    if (!st[group]) st[group] = {};
    const cur = st[group][key] || { attempts: 0, correct: 0 };
    st[group][key] = { attempts: cur.attempts + 1, correct: cur.correct + (correct ? 1 : 0) };
  };
  bump('pos', e.pos);
  if (e.pos === 'verb' && p) {
    bump('mood', p.f.mood);
    if (p.f.mood === 'I') bump('tense', p.f.tense);
  }
  saveParseStats();
}

function parseDescribe(f) {
  if (f.tense) {
    const head = `${PARSE_TENSE_NAMES[f.tense]} ${PARSE_VOICE_NAMES[f.voice]} ${PARSE_MOOD_NAMES[f.mood]}`;
    if (f.mood === 'N') return head;
    if (f.mood === 'P') return `${head}, ${PARSE_CASE_NAMES[f.case]} ${PARSE_NUMBER_NAMES[f.number]} ${PARSE_GENDER_NAMES[f.gender]}`;
    return `${head}, ${PARSE_PERSON_NAMES[f.person]} ${PARSE_NUMBER_NAMES[f.number]}`;
  }
  const cng = [PARSE_CASE_NAMES[f.case], PARSE_NUMBER_NAMES[f.number], f.gender ? PARSE_GENDER_NAMES[f.gender] : '']
    .filter(Boolean).join(' ');
  if (f.person) return `${PARSE_PERSON_NAMES[f.person]}, ${cng}`;
  return cng.charAt(0).toUpperCase() + cng.slice(1);
}

/* the student's answer, only the rows that were showing */
function parsePicksDescribe(rows, picks) {
  const f = {};
  rows.forEach(r => { f[r] = picks[r]; });
  return parseDescribe(f);
}

function parseCheck() {
  const q = state.parse;
  if (!q || q.answered) return;
  const e = q.items[q.index];
  const rows = parseRowsFor(e, q.picks);
  if (!rows.every(r => q.picks[r])) return;
  const correct = parseAllParsings(e).some(p => parseMatches(p, rows, q.picks));
  const best = parseBest(e, rows, q.picks);
  q.answered = true;
  q.correct = correct;
  q.best = best;
  if (correct) q.score += 1;
  q.results.push({
    prompt: e.f,
    typed: parsePicksDescribe(rows, q.picks),
    correctAnswer: e.p.map(p => parseDescribe(p.f)).join('<br>'),
    correct
  });
  recordParseAnswer(e, best, correct);
  render();
  /* the Form Quiz's lock-in and pause */
  setTimeout(() => {
    if (state.parse !== q) return;
    if (q.index < q.items.length - 1) {
      q.index += 1;
      q.picks = {};
      q.answered = false;
      q.correct = null;
      q.best = null;
    } else {
      q.done = true;
      bumpStreak();
      recordSession({
        mode: 'parse',
        scope: scopeFromSelection(q.selection),
        asked: q.items.length,
        right: q.score,
        ms: Date.now() - q.startedAt
      });
    }
    render();
  }, correct ? 650 : 1500);
}

/* one row of buttons. Once checked: a right pick goes green, a wrong one
   goes grey, and the value that was wanted is marked. */
function parseRowHtml(key, q, e) {
  const def = PARSE_FIELDS[key];
  const picked = q.picks[key];
  let wanted = [];
  if (q.answered && q.best && q.best.f[key] !== undefined) {
    wanted = key === 'voice' && q.best.f.voice === 'E' ? ['M', 'P'] : [q.best.f[key]];
  }
  const pickOk = q.answered && picked !== undefined && q.best && q.best.f[key] !== undefined && parseFieldOk(q.best, key, picked);
  const btns = def.opts.map(([val, label]) => {
    let cls = '';
    if (!q.answered) cls = picked === val ? 'active' : '';
    else if (picked === val) cls = (q.correct || pickOk) ? 'is-right' : 'is-wrong';
    else if (!q.correct && !pickOk && wanted.indexOf(val) !== -1) cls = 'is-answer';
    else cls = 'is-faded';
    return `<button class="seg-btn ${cls}" data-pkey="${key}" data-pval="${val}" ${q.answered ? 'disabled' : ''}>${label}</button>`;
  }).join('');
  const cols = def.opts.length;
  return `
    <div class="parse-row">
      <span class="kicker">${def.label}</span>
      <div class="parse-btns ${cols === 6 ? 'is-six' : ''}" ${cols === 6 ? '' : `style="--cols:${cols}"`}>${btns}</div>
    </div>
  `;
}

/* the lexeme and gloss, then every way the form can be parsed, each noted
   when it belongs to grammar past the selection's last chapter */
function parseInfoHtml(q, e) {
  const lex = PARSE_LEX[e.l];
  const later = p => p.ch > q.maxCh ? ` <span class="parse-later">· Taught in chapter ${p.ch}</span>` : '';
  const many = e.p.length > 1;
  return `
    <div class="parse-info">
      <div><span class="parse-lex">${e.l}</span> <span class="parse-gloss">· ${escapeHtml(lex.gloss)}</span></div>
      ${many ? '<div class="parse-note">This form can be parsed more than one way.</div>' : ''}
      <ul class="parse-list">${e.p.map(p => `<li>${parseDescribe(p.f)}${later(p)}</li>`).join('')}</ul>
    </div>
  `;
}

function renderParse() {
  const q = state.parse;
  if (!q) { goGrammar(); return; }
  if (q.done) { renderParseDone(); return; }
  const total = q.items.length;
  const e = q.items[q.index];
  const rows = parseRowsFor(e, q.picks);
  const ready = rows.every(r => q.picks[r]);
  const pct = Math.round((q.index / total) * 100);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Parse', true)}

      <div class="progress-row">
        <span>Form ${q.index + 1} of ${total}</span>
        <span>Score ${q.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="parse-body">
      <div class="prompt-panel glass parse-prompt">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">${q.answered ? (q.correct ? 'CORRECT' : 'NOT QUITE') : 'PARSE THIS FORM'}</div>
          <div class="prompt-word" style="margin-top:12px">${e.f}</div>
          ${q.answered ? parseInfoHtml(q, e) : ''}
        </div>
      </div>

      <div class="parse-rows">${rows.map(r => parseRowHtml(r, q, e)).join('')}</div>

      <button class="start-btn parse-check" id="btn-parse-check" ${ready && !q.answered ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${q.answered ? (q.correct ? 'Correct' : 'Not quite') : 'Check'}</span>
        ${ready && !q.answered ? '<span class="key-hint on-accent kh-btn">↵</span>' : ''}
      </button>
      </div>
    </div>
  `;

  if (!q.answered) {
    document.querySelectorAll('[data-pkey]').forEach(el => {
      el.addEventListener('click', () => parseSelect(el.dataset.pkey, el.dataset.pval));
    });
    const check = document.getElementById('btn-parse-check');
    if (!check.disabled) check.addEventListener('click', parseCheck);
  }
  document.getElementById('btn-exit-quiz').addEventListener('click', exitParse);
}

/* the session report every scored mode ends on: the score, then the forms
   missed with every parsing they could have been given */
function renderParseDone() {
  const q = state.parse;
  const results = q.results || [];
  const total = results.length;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in parse-summary">
      ${renderHeader(false, 'Parse', true)}

      ${summaryHero(0, q.score, total)}

      ${summarySection('TO REVIEW', results.filter(r => !r.correct))}
      ${summarySection('CORRECT', results.filter(r => r.correct))}
      ${total === 0 ? '<div class="empty-note text-muted">No answers recorded.</div>' : ''}

      ${summaryActions('btn-parse-home', 'btn-parse-new', 'New session')}
    </div>
  `;

  document.getElementById('btn-parse-home').addEventListener('click', () => { state.parse = null; goHome(); });
  document.getElementById('btn-parse-new').addEventListener('click', () => { state.parse = null; openParseSetup(); });
  document.getElementById('btn-exit-quiz').addEventListener('click', exitParse);
}

/* ---------- the setup ----------
   The vocabulary setup's steps and components, with the Parse drill's own
   middle: which word types, and for verbs which tenses and moods. */
function openParseSetup() {
  state.parseSetup.step = 1;
  state.parseSetup.anim = 'fwd';
  state.screen = 'parseSetup';
  render();
}

function parseStepPath() {
  const entries = parseEntriesForSelection(parseSelection());
  return parseActiveTypes(entries).indexOf('verb') !== -1 ? [1, 2, 3, 4, 5] : [1, 2, 4, 5];
}

function parseGoToStep(n, anim) {
  const s = state.parseSetup;
  /* the chips follow the selection until the student sets them: a new
     selection brings them back to what it has taught */
  if (n === 3 && s.chipsFor !== JSON.stringify(parseSelection())) setParseChipsTaught();
  s.step = n;
  s.anim = anim || 'fwd';
  render();
}

function parseSetupNext() {
  const path = parseStepPath();
  const i = path.indexOf(state.parseSetup.step);
  if (i < path.length - 1) parseGoToStep(path[i + 1], 'fwd');
}

function parseSetupBack() {
  const path = parseStepPath();
  const i = path.indexOf(state.parseSetup.step);
  if (i <= 0) { goGrammar(); return; }
  parseGoToStep(path[i - 1], 'back');
}

function toggleParseSet(set, val) {
  if (set.has(val)) set.delete(val); else set.add(val);
}

/* touching a chip makes the chips the student's own for this selection */
function toggleParseChip(set, val) {
  toggleParseSet(set, val);
  state.parseSetup.chipsFor = JSON.stringify(parseSelection());
  render();
}

function renderParseSetup() {
  const s = state.parseSetup;
  const path = parseStepPath();
  const stepIndex = Math.max(0, path.indexOf(s.step));
  const selection = parseSelection();
  const byCategory = selection.by === 'categories';
  const chosenCount = selectionSize(selection);
  const entries = parseEntriesForSelection(selection);
  const available = parseTypesAvailable(entries);
  const pool = parsePool();
  const poolSize = pool.length;
  const nextBtn = (enabled, label, emptyLabel) => `
      <button class="start-btn step-next" id="btn-step-next" ${enabled ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${enabled ? label : emptyLabel}</span>
        ${enabled ? '<span class="key-hint on-accent kh-btn">↵</span>' : ''}
      </button>`;

  let title = '', hint = '', body = '', footer = '';

  if (s.step === 1) {
    title = byCategory ? 'Choose your categories' : 'Choose your chapters';
    hint = 'Only forms of the words you pick come up.';
    const grid = byCategory
      ? `<div class="categories-grid">${CATEGORIES.map(c =>
          `<button class="cat-chip ${s.selectedCategories.has(c.name) ? 'selected' : ''}" data-cat="${c.name}"><span class="cat-name">${c.name}</span><span class="cat-count">${c.count} word${c.count === 1 ? '' : 's'}</span></button>`
        ).join('')}</div>`
      : `<div class="chapters-grid">${CHAPTERS.map(c =>
          `<button class="chapter-chip selectable ${s.selectedChapters.has(c) ? 'selected' : ''}" data-ch="${c}">${c}</button>`
        ).join('')}</div>`;
    body = `
      <div class="segmented select-toggle">
        <button class="seg-btn ${byCategory ? '' : 'active'}" data-by="chapters">Chapters</button>
        <button class="seg-btn ${byCategory ? 'active' : ''}" data-by="categories">Categories</button>
      </div>
      <div class="setup-label-row">
        <span class="kicker">${byCategory ? 'CATEGORIES' : 'CHAPTERS'}</span>
        <span>
          <button class="link-btn" id="btn-sel-all">Select all</button>
          &nbsp;&nbsp;
          <button class="link-btn" id="btn-sel-none">Clear</button>
        </span>
      </div>
      ${grid}
    `;
    footer = nextBtn(chosenCount && entries.length,
      `Next: ${parseSelectionLabel(selection)}, ${entries.length} form${entries.length === 1 ? '' : 's'}`,
      !chosenCount ? (byCategory ? 'Select at least one category' : 'Select at least one chapter') : 'No forms to parse in this selection');
  } else if (s.step === 2) {
    title = 'Which kinds of word?';
    hint = 'Pick one or more. A type with nothing in your selection is greyed out.';
    body = `<div class="stack">${PARSE_TYPES.map(t => {
      const has = available.indexOf(t.key) !== -1;
      const n = entries.filter(e => parseType(e) === t.key).length;
      return `
        <button class="choice-btn ${has && s.types.has(t.key) ? 'active' : ''}" data-ptype="${t.key}" ${has ? '' : 'disabled'}>
          <span><span>${t.label}</span><span class="choice-sub">${has ? `${n} form${n === 1 ? '' : 's'} · ${t.sub}` : 'None in this selection'}</span></span>
          ${tickIcon()}
        </button>`;
    }).join('')}</div>`;
    const active = parseActiveTypes(entries);
    footer = nextBtn(active.length, 'Next', 'Choose at least one');
  } else if (s.step === 3) {
    const maxCh = parseSelectionMaxChapter(selection);
    title = 'Which verb forms?';
    hint = `Set to what you have been taught up to chapter ${maxCh}. Switch on anything else, or narrow it to drill one thing. A verb comes up if one of its parsings fits.`;
    const chipRow = (label, key, set, names) => `
      <div class="parse-chip-row">
        <span class="kicker">${label}</span>
        <div class="segmented">${Object.keys(names).map(k =>
          `<button class="seg-btn ${set.has(k) ? 'active' : ''}" data-chip="${key}" data-val="${k}">${names[k]}</button>`
        ).join('')}</div>
      </div>`;
    const moodOrder = {};
    PARSE_FIELDS.mood.opts.forEach(([k, name]) => { moodOrder[k] = name; });
    body = `
      <div class="setup-label-row">
        <span class="kicker">GRAMMAR</span>
        <button class="link-btn" id="btn-parse-taught">Taught so far</button>
      </div>
      ${chipRow('TENSE', 'tense', s.tenses, PARSE_TENSE_NAMES)}
      ${chipRow('MOOD', 'mood', s.moods, moodOrder)}
    `;
    footer = nextBtn(poolSize, `Next: ${poolSize} form${poolSize === 1 ? '' : 's'}`, 'Nothing matches these choices');
  } else if (s.step === 4) {
    title = 'How many forms?';
    hint = poolSize < 30 ? `Your selection has ${poolSize} form${poolSize === 1 ? '' : 's'}, so a longer session stops early.` : 'Drawn at random, the commoner forms more often.';
    body = `<div class="stack">
      ${choiceBtn('data-count', '10', s.count === 10, '10 forms', 'A quick session')}
      ${choiceBtn('data-count', '20', s.count === 20, '20 forms', 'The usual drill')}
      ${choiceBtn('data-count', '30', s.count === 30, '30 forms', 'A longer stretch')}
    </div>`;
  } else {
    const types = parseActiveTypes(entries).map(t => PARSE_TYPES.find(x => x.key === t).label);
    const parts = [parseSelectionLabel(selection), types.join(', '), `${Math.min(s.count, poolSize)} forms`];
    const verbs = parseActiveTypes(entries).indexOf('verb') !== -1;
    const detail = verbs
      ? `Verbs: ${[...s.tenses].map(t => PARSE_TENSE_NAMES[t]).join(', ') || 'no tenses'}; ${PARSE_FIELDS.mood.opts.filter(([k]) => s.moods.has(k)).map(([, n]) => n).join(', ') || 'no moods'}`
      : selectionDetail(selection);
    title = 'Ready when you are';
    body = `
      <div class="summary-card">
        <div class="summary-line">${parts.join(' · ')}</div>
        <div class="summary-sub text-muted">${detail}</div>
      </div>
    `;
    footer = `
      <button class="start-btn step-next" id="btn-launch" ${poolSize ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${poolSize ? 'Start Parsing' : 'Nothing to parse in this selection'}</span>
        ${poolSize ? '<span class="key-hint on-accent kh-btn">↵</span>' : ''}
      </button>
    `;
  }

  const pct = Math.round(((stepIndex + 1) / path.length) * 100);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Parse', false)}

      <div class="setup-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="setup-topbar">
            <button class="back-btn" id="btn-step-back" title="Back" aria-label="Back">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 2.5 4.5 8l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="step-count">Step ${stepIndex + 1}</span>
            <span class="setup-esc key-hint">Esc to leave setup</span>
          </div>
          <div class="step-track"><div class="step-fill" style="width:${pct}%"></div></div>

          <div class="${s.anim === 'back' ? 'step-in-back' : 'step-in-fwd'}">
            <h2 class="step-title">${title}</h2>
            ${hint ? `<p class="step-hint text-muted">${hint}</p>` : ''}
            ${body}
            ${footer}
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btn-step-back').addEventListener('click', parseSetupBack);
  const next = document.getElementById('btn-step-next');
  if (next && !next.disabled) next.addEventListener('click', parseSetupNext);

  if (s.step === 1) {
    document.querySelectorAll('[data-by]').forEach(el => el.addEventListener('click', () => {
      s.selectBy = el.dataset.by; render();
    }));
    document.querySelectorAll('.chapter-chip').forEach(el => el.addEventListener('click', () => {
      toggleParseSet(s.selectedChapters, Number(el.dataset.ch)); render();
    }));
    document.querySelectorAll('.cat-chip').forEach(el => el.addEventListener('click', () => {
      toggleParseSet(s.selectedCategories, el.dataset.cat); render();
    }));
    document.getElementById('btn-sel-all').addEventListener('click', () => {
      if (s.selectBy === 'categories') CATEGORY_NAMES.forEach(c => s.selectedCategories.add(c));
      else CHAPTERS.forEach(c => s.selectedChapters.add(c));
      render();
    });
    document.getElementById('btn-sel-none').addEventListener('click', () => {
      if (s.selectBy === 'categories') s.selectedCategories.clear(); else s.selectedChapters.clear();
      render();
    });
  } else if (s.step === 2) {
    document.querySelectorAll('[data-ptype]').forEach(el => el.addEventListener('click', () => {
      toggleParseSet(s.types, el.dataset.ptype); render();
    }));
  } else if (s.step === 3) {
    document.querySelectorAll('[data-chip]').forEach(el => el.addEventListener('click', () => {
      toggleParseChip(el.dataset.chip === 'tense' ? s.tenses : s.moods, el.dataset.val);
    }));
    document.getElementById('btn-parse-taught').addEventListener('click', () => { setParseChipsTaught(); render(); });
  } else if (s.step === 4) {
    document.querySelectorAll('[data-count]').forEach(el => el.addEventListener('click', () => {
      s.count = Number(el.dataset.count); parseSetupNext();
    }));
  } else {
    const launch = document.getElementById('btn-launch');
    if (!launch.disabled) launch.addEventListener('click', startParse);
  }
}

/* ---------- Parse on the Progress tab ----------
   Accuracy per part of speech, and for verbs by mood and by indicative
   tense -- only what has been tried. Its own card: it is never folded into
   the Sort the Table or Form Quiz figures. */
function parseStatTotals() {
  const pos = state.parseStats.pos || {};
  let attempts = 0, correct = 0;
  Object.keys(pos).forEach(k => { attempts += pos[k].attempts || 0; correct += pos[k].correct || 0; });
  return { attempts, correct, pct: attempts ? Math.round((correct / attempts) * 100) : 0 };
}

function parseStatRows(group, order, names) {
  const g = state.parseStats[group] || {};
  return order.filter(k => g[k] && g[k].attempts > 0).map(k => {
    const s = g[k];
    const pct = Math.round((s.correct / s.attempts) * 100);
    return `
      <div class="panel-row">
        <span>${names[k]}</span>
        <span class="panel-row-value">${pct}% · ${s.correct} of ${s.attempts}</span>
      </div>`;
  }).join('');
}

function parseProgressHtml() {
  const posRows = parseStatRows('pos', ['noun', 'article', 'pronoun', 'adjective', 'verb'], PARSE_POS_LABELS);
  const moodRows = parseStatRows('mood', PARSE_FIELDS.mood.opts.map(o => o[0]), PARSE_MOOD_NAMES);
  const tenseRows = parseStatRows('tense', PARSE_FIELDS.tense.opts.map(o => o[0]), PARSE_TENSE_NAMES);
  const sub = t => `<div class="pg-sub" style="margin:0;padding:14px 18px 0">${t}</div>`;
  return `
    <section class="prog-block prog-srs">
      <div class="kicker" style="margin:0 0 10px">PARSE</div>
      <div class="panel-card">
        ${posRows || '<div class="empty-note text-muted">Not tried yet.</div>'}
        ${moodRows ? sub('Verbs by mood') + moodRows : ''}
        ${tenseRows ? sub('Indicative by tense') + tenseRows : ''}
      </div>
    </section>
  `;
}

/* OpenGNT's licence asks for the credit wherever its data is used */
function parseCreditHtml() {
  return '<div class="prog-credit">Parsing data from OpenGNT (CC BY-SA 4.0).</div>';
}

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'flashcard') renderQuizTab();
  else if (state.screen === 'cards') { if (cardsSummaryUp()) renderCardsSummary(); else renderCards(); }
  else if (state.screen === 'memory') renderMemory();
  else if (state.screen === 'review') renderDailyReview();
  else if (state.screen === 'grammar') renderGrammarPicker();
  else if (state.screen === 'grammarList') renderGrammarList();
  else if (state.screen === 'grammarDrill') renderGrammarDrill();
  else if (state.screen === 'grammarRef') renderGrammarReference();
  else if (state.screen === 'grammarQuiz') renderGrammarQuiz();
  else if (state.screen === 'parseSetup') renderParseSetup();
  else if (state.screen === 'parse') renderParse();
  else if (state.screen === 'chapterDone') renderChapterDone();
  else if (state.screen === 'collection') renderCollection();
  else if (state.screen === 'progress') renderProgress();
  renderTabBar();
  if (state.onboarding.active) renderOnboarding();
}

/* ---------- keyboard: desktop only ----------
   Every handler is gated on the desktop breakpoint, so the touch tiers behave
   exactly as they did. Typing into a field swallows everything but Escape --
   Type Answer's own Enter is wired to the input itself and is left alone. */
const desktopQuery = window.matchMedia('(min-width: 1180px)');
function isDesktop() { return desktopQuery.matches; }

/* which board tile the focus ring is on. UI-only, so it stays out of `state`. */
let memoryFocus = 0;

function paintMemoryFocus() {
  const tiles = [...document.querySelectorAll('.mem-tile')];
  if (!tiles.length) return;
  memoryFocus = Math.max(0, Math.min(memoryFocus, tiles.length - 1));
  tiles.forEach((el, i) => el.classList.toggle('is-focused', isDesktop() && i === memoryFocus));
}

function moveMemoryFocus(delta) {
  const tiles = document.querySelectorAll('.mem-tile');
  if (!tiles.length) return;
  memoryFocus = Math.max(0, Math.min(memoryFocus + delta, tiles.length - 1));
  paintMemoryFocus();
}

/* what is actually in front of the student -- the Review tab resolves to
   whichever session is open, so the screen name alone is not enough */
function activeScreenKind() {
  if (state.screen === 'setup') return 'setup';
  if (state.screen === 'memory') return state.memory && state.memory.finishedMs !== null ? 'memory-done' : 'memory';
  if (state.screen === 'review') return state.review && !state.review.done ? 'review' : 'review-done';
  if (state.screen === 'grammarDrill') return state.grammar && state.grammar.done ? 'grammar-done' : 'grammar-drill';
  if (state.screen === 'chapterDone') return 'chapter-done';
  if (state.screen === 'collection') return 'collection';
  if (state.screen === 'grammarRef') return 'grammar-ref';
  if (state.screen === 'grammarList') return 'grammar-list';
  if (state.screen === 'grammarQuiz') return state.grammarQuiz && state.grammarQuiz.done ? 'grammar-quiz-done' : 'grammar-quiz';
  if (state.screen === 'parseSetup') return 'parse-setup';
  if (state.screen === 'parse') return state.parse && state.parse.done ? 'parse-done' : 'parse';
  if (state.screen === 'cards') return cardsSummaryUp() ? 'cards-done' : (cardsInProgress() ? 'cards' : null);
  if (state.screen === 'flashcard') {
    if (sessionSummaryUp()) return 'session-done';
    if (quizInProgress()) return state.quiz.settings.mode === 'mc' ? 'mc' : 'typed';
    if (cardsSummaryUp()) return 'cards-done';
    if (cardsInProgress()) return 'cards';
  }
  return null;
}

/* Escape raises exactly what the close button raises, confirm included */
function escapeAction(kind) {
  if (kind === 'setup') return goHome;
  if (kind === 'memory' || kind === 'memory-done') return exitMemory;
  if (kind === 'review' || kind === 'review-done') return exitReview;
  if (kind === 'chapter-done') return closeCelebration;
  if (kind === 'collection') return exitCollection;
  if (kind === 'grammar-list' || kind === 'grammar-ref') return goGrammar;
  if (kind === 'grammar-drill' || kind === 'grammar-done') return goGrammarList;
  if (kind === 'grammar-quiz' || kind === 'grammar-quiz-done') return exitGrammarQuiz;
  if (kind === 'parse-setup') return goGrammar;
  if (kind === 'parse' || kind === 'parse-done') return exitParse;
  if (kind === 'cards' || kind === 'cards-done') return exitCards;
  if (kind === 'mc' || kind === 'typed') return exitQuiz;
  if (kind === 'session-done') return closeSessionSummary;
  return null;
}

function clickNth(selector, n) {
  const els = document.querySelectorAll(selector);
  if (els[n]) els[n].click();
}

function handleShortcut(e) {
  if (state.onboarding.active) return;   /* the walkthrough binds its own arrow keys */
  if (!isDesktop()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const kind = activeScreenKind();
  if (!kind) return;

  if (e.key === 'Escape') {
    const exit = escapeAction(kind);
    if (exit) { e.preventDefault(); exit(); }
    return;
  }

  /* past here, a focused field owns the keyboard */
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;

  const digit = /^[1-9]$/.test(e.key) ? Number(e.key) : 0;

  if (kind === 'parse') {
    if (e.key === 'Enter') {
      const check = document.getElementById('btn-parse-check');
      if (check && !check.disabled) { e.preventDefault(); check.click(); }
    }
    return;
  }

  if (kind === 'parse-setup') {
    if (e.key === 'Enter') {
      const next = document.getElementById('btn-step-next') || document.getElementById('btn-launch');
      if (next && !next.disabled) { e.preventDefault(); next.click(); }
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      parseSetupBack();
    }
    return;
  }

  if (kind === 'mc' || kind === 'grammar-quiz') {
    if (digit >= 1 && digit <= 4) { e.preventDefault(); clickNth('.option-btn', digit - 1); }
    return;
  }

  if (kind === 'cards') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      const card = document.getElementById('flip-card');
      if (card) card.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (state.cards && state.cards.index > 0) prevCard();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      nextCard();
    }
    return;
  }

  if (kind === 'review') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (!state.review.revealed) {
        const card = document.getElementById('review-card');
        if (card) card.click();
      }
    } else if (digit >= 1 && digit <= 4 && state.review.revealed) {
      e.preventDefault();
      clickNth('#rate-row .rate-btn', digit - 1);
    }
    return;
  }

  if (kind === 'memory') {
    const tiles = document.querySelectorAll('.mem-tile');
    if (!tiles.length) return;
    const cols = 5;   /* the desktop board is 5 x 2, and this only runs there */
    if (e.key === 'ArrowLeft') { e.preventDefault(); moveMemoryFocus(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveMemoryFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveMemoryFocus(-cols); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveMemoryFocus(cols); }
    else if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      const tile = tiles[memoryFocus];
      if (tile) flipMemoryTile(tile.dataset.tile);
    }
    return;
  }

  if (kind === 'memory-done') {
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); memoryFocus = 0; replayMemory(); }
    return;
  }

  if (kind === 'setup') {
    if (e.key === 'Enter') {
      e.preventDefault();
      const next = document.getElementById('btn-step-next') || document.getElementById('btn-launch');
      if (next) { if (!next.disabled) next.click(); }
      else setupNext();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setupBack();
    } else if (digit >= 1 && digit <= 4) {
      /* the format, direction and word-count steps only -- step 1 is a grid */
      const step = state.setup.step;
      const sel = step === 2 ? '[data-mode]' : step === 3 ? '[data-dir]' : step === 4 ? '[data-count]' : null;
      if (sel) { e.preventDefault(); clickNth(sel, digit - 1); }
    }
  }
}

document.addEventListener('keydown', handleShortcut);
/* crossing the breakpoint with a board open clears or restores the ring */
desktopQuery.addEventListener('change', () => { if (state.screen === 'memory') paintMemoryFocus(); });

document.getElementById('tab-home').addEventListener('click', goHome);
document.getElementById('tab-review').addEventListener('click', goQuizTab);
document.getElementById('tab-progress').addEventListener('click', goProgress);

(async function init() {
  await loadData();
  render();
})();
</script>
</body>
</html>
