/* Builds the shell once. Moving between screens only translates the track and
   repaints the footer (paintOnboarding), so the slide actually animates -- a
   full innerHTML rewrite would land at the new offset with no transition. */
function renderOnboarding() {
  document.body.classList.add('onboarding-open');
  document.getElementById('onboarding').innerHTML = `
    <div class="onb-root" role="region" aria-label="Welcome to Oikos">
      <header class="onb-header">
        <div>
          <p class="app-title">Oikos</p>
          <div class="app-tagline">Learning to belong in God&rsquo;s Word</div>
        </div>
        <button class="onb-skip" id="onb-skip">Skip</button>
      </header>

      <div class="onb-viewport">
        <div class="onb-track" id="onb-track">${ONBOARDING_SCREENS.map(onbScreenHtml).join('')}</div>
      </div>

      <footer class="onb-footer">
        <div class="onb-progress">
          <div class="onb-dots" id="onb-dots" aria-hidden="true">
            ${ONBOARDING_SCREENS.map(() => '<i class="onb-dot"></i>').join('')}
          </div>
          <div class="onb-count" id="onb-count" aria-live="polite"></div>
        </div>
        <div class="onb-buttons">
          <button class="secondary-btn" id="onb-back">Back</button>
          <button class="start-btn" id="onb-next">
            <span class="resume-fill"></span><span class="resume-edge"></span>
            <span id="onb-next-label">Next</span>
          </button>
        </div>
      </footer>
    </div>
  `;

  document.getElementById('onb-skip').addEventListener('click', finishOnboarding);
  document.getElementById('onb-back').addEventListener('click', () => stepOnboarding(-1));
  document.getElementById('onb-next').addEventListener('click', () => {
    if (state.onboarding.i === ONBOARDING_LAST) finishOnboarding();
    else stepOnboarding(1);
  });

  bindOnboardingInput();
  paintOnboarding();
}

function paintOnboarding() {
  const i = state.onboarding.i;
  const last = i === ONBOARDING_LAST;
  document.getElementById('onb-track').style.transform = `translateX(-${i * 100}%)`;
  document.querySelectorAll('#onb-dots .onb-dot').forEach((el, n) => el.classList.toggle('active', n === i));
  document.getElementById('onb-count').textContent = `${i + 1} of ${ONBOARDING_SCREENS.length}`;
  document.getElementById('onb-back').disabled = i === 0;
  document.getElementById('onb-next-label').textContent = last ? 'Get started' : 'Next';
}

function stepOnboarding(delta) {
  const next = Math.max(0, Math.min(ONBOARDING_LAST, state.onboarding.i + delta));
  if (next === state.onboarding.i) return;
  state.onboarding.i = next;
  paintOnboarding();
}

/* Arrow keys and a horizontal swipe. Both are torn down on completion so the
   app's own keydown handler is the only one left afterwards. */
let onbInput = null;

function bindOnboardingInput() {
  if (onbInput) return;
  let touchX = null;
  onbInput = {
    key(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stepOnboarding(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stepOnboarding(-1); }
    },
    /* one finger only -- a two-finger pinch or zoom is not a swipe */
    start(e) { touchX = e.touches && e.touches.length === 1 ? e.touches[0].clientX : null; },
    end(e) {
      if (touchX === null || !e.changedTouches || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 48) stepOnboarding(dx < 0 ? 1 : -1);
    }
  };
  document.addEventListener('keydown', onbInput.key);
  document.addEventListener('touchstart', onbInput.start, { passive: true });
  document.addEventListener('touchend', onbInput.end, { passive: true });
}

function unbindOnboardingInput() {
  if (!onbInput) return;
  document.removeEventListener('keydown', onbInput.key);
  document.removeEventListener('touchstart', onbInput.start);
  document.removeEventListener('touchend', onbInput.end);
  onbInput = null;
}

/* Skip and Get started land in the same place: flag written, overlay gone,
   home screen underneath. */
function finishOnboarding() {
  state.onboarding.active = false;
  saveOnboardingSeen();
  unbindOnboardingInput();
  document.body.classList.remove('onboarding-open');
  document.getElementById('onboarding').innerHTML = '';
  goHome();
}

function replayOnboarding() {
  state.onboarding = { active: true, i: 0 };
  render();
}

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'flashcard') renderQuizTab();
  else if (state.screen === 'cards') renderCards();
  else if (state.screen === 'memory') renderMemory();
  else if (state.screen === 'review') renderDailyReview();
  else if (state.screen === 'progress') renderProgress();
  renderTabBar();
  if (state.onboarding.active) renderOnboarding();
}

/* ---------- keyboard: desktop only ----------
   Every handler is gated on the desktop breakpoint, so the touch tiers behave
   exactly as they did. Typing into a field swallows everything but Escape --
   Type Answer's own Enter is wired to the input itself and is left alone. */
const desktopQuery = window.matchMedia('(min-width: 1180px)');
function isDesktop() { return desktopQuery.matches; }

/* which board tile the focus ring is on. UI-only, so it stays out of `state`. */
let memoryFocus = 0;

function paintMemoryFocus() {
  const tiles = [...document.querySelectorAll('.mem-tile')];
  if (!tiles.length) return;
  memoryFocus = Math.max(0, Math.min(memoryFocus, tiles.length - 1));
  tiles.forEach((el, i) => el.classList.toggle('is-focused', isDesktop() && i === memoryFocus));
}

function moveMemoryFocus(delta) {
  const tiles = document.querySelectorAll('.mem-tile');
  if (!tiles.length) return;
  memoryFocus = Math.max(0, Math.min(memoryFocus + delta, tiles.length - 1));
  paintMemoryFocus();
}

/* what is actually in front of the student -- the Review tab resolves to
   whichever session is open, so the screen name alone is not enough */
function activeScreenKind() {
  if (state.screen === 'setup') return 'setup';
  if (state.screen === 'memory') return state.memory && state.memory.finishedMs !== null ? 'memory-done' : 'memory';
  if (state.screen === 'review') return state.review && !state.review.done ? 'review' : 'review-done';
  if (state.screen === 'cards') return cardsInProgress() ? 'cards' : null;
  if (state.screen === 'flashcard') {
    if (quizInProgress()) return state.quiz.settings.mode === 'mc' ? 'mc' : 'typed';
    if (cardsInProgress()) return 'cards';
  }
  return null;
}

/* Escape raises exactly what the close button raises, confirm included */
function escapeAction(kind) {
  if (kind === 'setup') return goHome;
  if (kind === 'memory' || kind === 'memory-done') return exitMemory;
  if (kind === 'review' || kind === 'review-done') return exitReview;
  if (kind === 'cards') return exitCards;
  if (kind === 'mc' || kind === 'typed') return exitQuiz;
  return null;
}

function clickNth(selector, n) {
  const els = document.querySelectorAll(selector);
  if (els[n]) els[n].click();
}

function handleShortcut(e) {
  if (state.onboarding.active) return;   /* the walkthrough binds its own arrow keys */
  if (!isDesktop()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const kind = activeScreenKind();
  if (!kind) return;

  if (e.key === 'Escape') {
    const exit = escapeAction(kind);
    if (exit) { e.preventDefault(); exit(); }
    return;
  }

  /* past here, a focused field owns the keyboard */
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;

  const digit = /^[1-9]$/.test(e.key) ? Number(e.key) : 0;

  if (kind === 'mc') {
    if (digit >= 1 && digit <= 4) { e.preventDefault(); clickNth('.option-btn', digit - 1); }
    return;
  }

  if (kind === 'cards') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      const card = document.getElementById('flip-card');
      if (card) card.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (state.cards && state.cards.index > 0) prevCard();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      nextCard();
    }
    return;
  }

  if (kind === 'review') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (!state.review.revealed) {
        const card = document.getElementById('review-card');
        if (card) card.click();
      }
    } else if (digit >= 1 && digit <= 4 && state.review.revealed) {
      e.preventDefault();
      clickNth('#rate-row .rate-btn', digit - 1);
    }
    return;
  }

  if (kind === 'memory') {
    const tiles = document.querySelectorAll('.mem-tile');
    if (!tiles.length) return;
    const cols = 5;   /* the desktop board is 5 x 2, and this only runs there */
    if (e.key === 'ArrowLeft') { e.preventDefault(); moveMemoryFocus(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveMemoryFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveMemoryFocus(-cols); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveMemoryFocus(cols); }
    else if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      const tile = tiles[memoryFocus];
      if (tile) flipMemoryTile(tile.dataset.tile);
    }
    return;
  }

  if (kind === 'memory-done') {
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); memoryFocus = 0; replayMemory(); }
    return;
  }

  if (kind === 'setup') {
    if (e.key === 'Enter') {
      e.preventDefault();
      const next = document.getElementById('btn-step-next') || document.getElementById('btn-launch');
      if (next) { if (!next.disabled) next.click(); }
      else setupNext();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setupBack();
    } else if (digit >= 1 && digit <= 4) {
      /* the format, direction and word-count steps only -- step 1 is a grid */
      const step = state.setup.step;
      const sel = step === 2 ? '[data-mode]' : step === 3 ? '[data-dir]' : step === 4 ? '[data-count]' : null;
      if (sel) { e.preventDefault(); clickNth(sel, digit - 1); }
    }
  }
}

document.addEventListener('keydown', handleShortcut);
/* crossing the breakpoint with a board open clears or restores the ring */
desktopQuery.addEventListener('change', () => { if (state.screen === 'memory') paintMemoryFocus(); });

document.getElementById('tab-home').addEventListener('click', goHome);
document.getElementById('tab-review').addEventListener('click', goQuizTab);
document.getElementById('tab-progress').addEventListener('click', goProgress);

(async function init() {
  await loadData();
  render();
})();
</script>
</body>
</html>
