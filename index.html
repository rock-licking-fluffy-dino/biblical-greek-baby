<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Oikos</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oikos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f0ea">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --ink: #201e1d;
    --green: #4f7a5c;
    --green-text: #2d4a36;
    --green-tint: rgba(79,122,92,0.16);
    --muted: rgba(32,30,29,0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: var(--font-sans);
    color: var(--ink);
    background: linear-gradient(180deg,#fbfaf7,#f2f0ea);
  }
  body {
    background:
      radial-gradient(circle at 88% -8%, rgba(79,122,92,0.22), transparent 55%),
      linear-gradient(180deg,#fbfaf7,#f2f0ea);
    min-height: 100vh;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    min-height: 100vh;
  }
  #screen {
    padding: calc(env(safe-area-inset-top) + 24px) 18px 116px;
  }
  .text-muted { color: var(--muted); }
  .kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--green-text);
    font-weight: 600;
  }

  /* generic layered glass panel */
  .glass { position: relative; }
  .glass-fill, .glass-edge { position: absolute; inset: 0; pointer-events: none; }
  .glass-fill {
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(255,255,255,0.55);
  }
  .glass-edge {
    box-shadow: inset 1px 1px 1px rgba(255,255,255,0.9), inset -1px -1px 1px rgba(255,255,255,0.3);
    border: 0.5px solid rgba(255,255,255,0.5);
  }
  .glass-content { position: relative; z-index: 1; }

  /* header */
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .app-title { font-weight: 800; font-size: 21px; letter-spacing: -0.01em; margin: 0; }
  .app-subtitle { font-size: 12px; margin-top: 1px; }
  .pill { position: relative; border-radius: 9999px; }
  .pill .glass-fill { border-radius: 9999px; backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%); background: rgba(255,255,255,0.55); }
  .pill .glass-edge { border-radius: 9999px; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.3); border: 0.5px solid rgba(0,0,0,0.06); }
  .pill .glass-content { padding: 7px 14px; font-size: 12px; color: var(--green-text); font-weight: 600; white-space: nowrap; }

  /* home: continue card */
  .continue-card { border-radius: 24px; padding: 20px; margin-bottom: 14px; box-shadow: 0 12px 32px rgba(32,30,29,0.1); }
  .continue-card .glass-fill { border-radius: 24px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); background: rgba(255,255,255,0.6); }
  .continue-card .glass-edge { border-radius: 24px; }
  .continue-card h2 { margin: 0 0 6px; font-weight: 800; font-size: 25px; }
  .continue-words { margin: 0 0 16px; font-size: 13px; }
  .resume-btn { position: relative; width: 100%; border: none; border-radius: 16px; padding: 13px 0; overflow: hidden; cursor: pointer; }
  .resume-btn .resume-fill { position: absolute; inset: 0; background: rgba(79,122,92,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .resume-btn .resume-edge { position: absolute; inset: 0; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.3); }
  .resume-btn span { position: relative; z-index: 1; color: #fff; font-weight: 800; font-size: 14px; }
  .resume-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* stats row */
  .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat-chip { flex: 1; border-radius: 18px; padding: 12px 6px; text-align: center; }
  .stat-chip .glass-fill { border-radius: 18px; background: rgba(255,255,255,0.5); }
  .stat-chip .glass-edge { border-radius: 18px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .stat-value { font-weight: 800; font-size: 19px; }
  .stat-label { font-size: 10px; margin-top: 2px; }

  /* chapters grid (shared: home display grid + setup multi-select grid) */
  .chapters-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chapter-chip {
    text-align: center; padding: 8px 0; border-radius: 10px; font-size: 11px;
    cursor: pointer; user-select: none; border: none; font-family: var(--font-sans);
  }
  .chapter-chip.done { background: var(--green); color: #fff; font-weight: 600; }
  .chapter-chip.not-done { background: rgba(255,255,255,0.5); color: var(--muted); border: 0.5px solid rgba(32,30,29,0.08); }
  .chapter-chip.selectable { background: rgba(255,255,255,0.5); color: var(--ink); border: 0.5px solid rgba(32,30,29,0.1); font-weight: 600; }
  .chapter-chip.selected { background: var(--green); color: #fff; }

  /* setup screen */
  .setup-panel { border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .setup-panel .glass-fill { border-radius: 20px; background: rgba(255,255,255,0.55); }
  .setup-panel .glass-edge { border-radius: 20px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .setup-section + .setup-section { margin-top: 16px; }
  .setup-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .link-btn {
    background: none; border: none; color: var(--green-text); font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 0; font-family: var(--font-sans); text-decoration: underline; text-underline-offset: 2px;
  }
  .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    flex: 1 1 auto; border: 0.5px solid rgba(32,30,29,0.1); background: rgba(255,255,255,0.5);
    color: var(--ink); border-radius: 12px; padding: 10px 8px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: var(--font-sans); text-align: center; white-space: nowrap;
  }
  .seg-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .seg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .setup-note { font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  .start-btn {
    position: relative; width: 100%; border: none; border-radius: 16px; padding: 14px 0;
    overflow: hidden; cursor: pointer; margin-top: 16px;
  }
  .start-btn .resume-fill { position: absolute; inset: 0; background: rgba(79,122,92,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .start-btn .resume-edge { position: absolute; inset: 0; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.3); }
  .start-btn span { position: relative; z-index: 1; color: #fff; font-weight: 800; font-size: 14px; }
  .start-btn:disabled .resume-fill { background: rgba(32,30,29,0.15); }
  .start-btn:disabled span { color: rgba(32,30,29,0.4); }
  .start-btn:disabled { cursor: not-allowed; }

  /* flashcard */
  .progress-row { display: flex; justify-content: space-between; font-size: 12px; color: rgba(32,30,29,0.55); margin-bottom: 10px; }
  .progress-track { height: 6px; background: rgba(32,30,29,0.08); border-radius: 9999px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 6px; background: var(--green); border-radius: 9999px; transition: width 0.25s ease; }
  .prompt-panel { border-radius: 28px; padding: 34px 20px; margin-bottom: 22px; box-shadow: 0 16px 40px rgba(32,30,29,0.12); text-align: center; }
  .prompt-panel .glass-fill { border-radius: 28px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); background: rgba(255,255,255,0.62); }
  .prompt-panel .glass-edge { border-radius: 28px; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.9); }
  .prompt-word { font-weight: 800; font-size: 44px; word-break: break-word; }
  .prompt-word.is-english { font-size: 26px; line-height: 1.3; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn { position: relative; border: none; border-radius: 16px; padding: 15px 16px; text-align: left; cursor: pointer; font-family: var(--font-sans); }
  .option-btn:disabled { cursor: default; }
  .option-fill { position: absolute; inset: 0; border-radius: 16px; background: rgba(255,255,255,0.4); }
  .option-edge { position: absolute; inset: 0; border-radius: 16px; border: 0.5px solid rgba(255,255,255,0.5); }
  .option-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--ink); gap: 10px; }
  .option-btn.is-correct .option-fill { background: var(--green-tint); }
  .option-btn.is-correct .option-content { color: var(--green-text); }
  .option-btn.is-wrong .option-fill { background: rgba(32,30,29,0.06); }
  .option-btn.is-wrong .option-content { color: var(--muted); }
  .option-btn.is-faded .option-content { color: var(--muted); }
  .option-icon { flex-shrink: 0; display: flex; }

  /* typed answer */
  .typed-row { display: flex; gap: 8px; }
  .typed-input-wrap { position: relative; flex: 1; border-radius: 16px; overflow: hidden; }
  .typed-input-wrap .glass-fill { border-radius: 16px; background: rgba(255,255,255,0.4); }
  .typed-input-wrap .glass-edge { border-radius: 16px; border: 0.5px solid rgba(255,255,255,0.5); }
  .typed-input {
    position: relative; z-index: 1; width: 100%; border: none; background: transparent;
    padding: 15px 16px; font-size: 15px; font-family: var(--font-sans); color: var(--ink); outline: none;
  }
  .typed-input-wrap.is-correct .glass-fill { background: var(--green-tint); }
  .typed-input-wrap.is-correct .typed-input { color: var(--green-text); }
  .typed-input-wrap.is-wrong .glass-fill { background: rgba(32,30,29,0.06); }
  .typed-input-wrap.is-wrong .typed-input { color: var(--muted); }
  .typed-submit {
    position: relative; border: none; border-radius: 16px; padding: 0 20px; overflow: hidden; cursor: pointer;
  }
  .typed-submit .resume-fill { position: absolute; inset: 0; background: rgba(79,122,92,0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .typed-submit span { position: relative; z-index: 1; color: #fff; font-weight: 800; font-size: 13px; }
  .typed-submit:disabled { cursor: not-allowed; opacity: 0.5; }
  .typed-feedback { text-align: center; font-size: 12.5px; margin-top: 14px; min-height: 16px; }

  /* progress screen */
  .ring-panel { border-radius: 24px; padding: 26px 20px; margin-bottom: 16px; box-shadow: 0 12px 32px rgba(32,30,29,0.1); text-align: center; }
  .ring-panel .glass-fill { border-radius: 24px; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); background: rgba(255,255,255,0.6); }
  .ring-panel .glass-edge { border-radius: 24px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .ring-label { font-size: 12px; margin-top: 6px; }
  .ring-caption { font-size: 11.5px; margin-top: 2px; line-height: 1.4; }
  .list-panel { border-radius: 20px; padding: 6px 16px; margin-bottom: 16px; }
  .list-panel .glass-fill { border-radius: 20px; background: rgba(255,255,255,0.5); }
  .list-panel .glass-edge { border-radius: 20px; box-shadow: none; border: 0.5px solid rgba(255,255,255,0.5); }
  .chapter-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .chapter-row .ch-num { width: 20px; font-size: 12px; color: rgba(32,30,29,0.55); }
  .chapter-row .ch-track { flex: 1; height: 6px; background: rgba(32,30,29,0.08); border-radius: 9999px; }
  .chapter-row .ch-fill { height: 6px; background: var(--green); border-radius: 9999px; }
  .chapter-row .ch-pct { width: 32px; text-align: right; font-size: 12px; color: rgba(32,30,29,0.55); }
  .missed-row { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; font-size: 14px; }
  .missed-greek { font-weight: 600; }
  .missed-english { text-align: right; }
  .empty-note { text-align: center; font-size: 13px; padding: 14px 0; }

  /* nav bar */
  .tab-bar-wrap { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); z-index: 30; }
  .tab-bar { position: relative; display: flex; align-items: center; gap: 6px; padding: 9px; border-radius: 9999px; box-shadow: 0 6px 20px rgba(0,0,0,0.16); }
  .tab-bar .glass-fill { border-radius: 9999px; backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); background: rgba(255,255,255,0.6); }
  .tab-bar .glass-edge { border-radius: 9999px; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.85), inset -1px -1px 1px rgba(255,255,255,0.3); border: 0.5px solid rgba(0,0,0,0.06); }
  .tab-btn { position: relative; z-index: 1; width: 52px; height: 52px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }
  .tab-btn.active { color: var(--green); }
  .tab-btn svg { width: 26px; height: 26px; }

  .fade-in { animation: oikos-fade 0.18s ease; }
  @keyframes oikos-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div class="tab-bar-wrap">
    <div class="tab-bar">
      <div class="glass-fill"></div>
      <div class="glass-edge"></div>
      <button class="tab-btn" id="tab-home" title="Home">
        <svg viewBox="0 0 20 20" fill="none"><path d="M2.5 8.5 10 2l7.5 6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 8v8.5h4.5V12h3v4.5H16V8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tab-btn" id="tab-review" title="Review">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5.5" width="12" height="9" rx="1.5" transform="rotate(-6 8.5 10)" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="4" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.9"/></svg>
      </button>
      <button class="tab-btn" id="tab-progress" title="Progress">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 17V10M9 17V4.5M15 17V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

const CHAPTERS = Object.keys(VOCAB).map(Number).sort((a,b)=>a-b);
const MASTERY_THRESHOLD = 80;

/* ---------- storage: works inside Claude artifacts (window.storage) and on any
   normal web host / home-screen app (falls back to localStorage) ---------- */
const storageAdapter = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
    } catch (e) { /* key may not exist yet */ }
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(key, value, false);
        return;
      }
    } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(key, value); } catch (e) { /* non-fatal */ }
  }
};

const STATS_KEY = 'koine-drill-word-stats';
const STREAK_KEY = 'oikos-streak';

let state = {
  screen: 'home',            // 'home' | 'reviewSetup' | 'flashcard' | 'progress'
  stats: {},                 // wordKey -> { seen, correct }
  streak: { count: 0, lastDate: null },
  setup: {
    selectedChapters: new Set(),
    count: 20,                // 10 | 20 | 30
    direction: 'gtoe',        // 'gtoe' | 'etog' | 'mixed'
    mode: 'mc'                // 'mc' | 'typed'
  },
  quiz: null,                 // { settings, pool, items, index, score, answered, selectedOpt, typedValue, typedCorrect }
};

function wordKey(chapter, greek) { return chapter + '::' + greek; }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function loadData() {
  const rawStats = await storageAdapter.get(STATS_KEY);
  try { state.stats = rawStats ? JSON.parse(rawStats) : {}; } catch (e) { state.stats = {}; }
  const rawStreak = await storageAdapter.get(STREAK_KEY);
  try { state.streak = rawStreak ? JSON.parse(rawStreak) : { count: 0, lastDate: null }; } catch (e) { state.streak = { count: 0, lastDate: null }; }
}

function saveStats() { storageAdapter.set(STATS_KEY, JSON.stringify(state.stats)); }
function saveStreak() { storageAdapter.set(STREAK_KEY, JSON.stringify(state.streak)); }

function bumpStreak() {
  const today = todayStr();
  if (state.streak.lastDate === today) return;
  const yest = new Date();
  yest.setDate(yest.getDate() - 1);
  const yestStr = yest.getFullYear() + '-' + String(yest.getMonth() + 1).padStart(2, '0') + '-' + String(yest.getDate()).padStart(2, '0');
  state.streak.count = (state.streak.lastDate === yestStr) ? state.streak.count + 1 : 1;
  state.streak.lastDate = today;
  saveStreak();
}

function recordAttempt(chapter, greek, correct) {
  const k = wordKey(chapter, greek);
  if (!state.stats[k]) state.stats[k] = { seen: 0, correct: 0 };
  state.stats[k].seen += 1;
  if (correct) state.stats[k].correct += 1;
  saveStats();
}

/* ---------- derived data ---------- */
function chapterMastery(ch) {
  const words = VOCAB[ch] || [];
  let seen = 0, correct = 0;
  words.forEach(w => {
    const s = state.stats[wordKey(ch, w.greek)];
    if (s) { seen += s.seen; correct += s.correct; }
  });
  if (seen === 0) return 0;
  return Math.round((correct / seen) * 100);
}

/*
 * "accuracy" measures how often you answer correctly among the questions
 * you've actually been asked so far -- it is NOT the same as how much of
 * the 23-chapter syllabus you have covered. Two words attempted with one
 * mistake is already 50% accuracy; twenty words attempted with two
 * mistakes is 90% accuracy -- both are possible after "finishing" only a
 * couple of chapters. Coverage of the syllabus is shown separately, as
 * "{wordsSeen} of {totalWords} words" and "chapters mastered".
 */
function overallStats() {
  let totalSeenWords = 0, totalWords = 0, sumSeen = 0, sumCorrect = 0;
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      totalWords += 1;
      const s = state.stats[wordKey(ch, w.greek)];
      if (s && s.seen > 0) {
        totalSeenWords += 1;
        sumSeen += s.seen;
        sumCorrect += s.correct;
      }
    });
  });
  const accuracy = sumSeen > 0 ? Math.round((sumCorrect / sumSeen) * 100) : 0;
  const chaptersMastered = CHAPTERS.filter(ch => chapterMastery(ch) >= MASTERY_THRESHOLD).length;
  return { wordsSeen: totalSeenWords, totalWords, accuracy, chaptersMastered, totalChapters: CHAPTERS.length };
}

function continueChapter() {
  const next = CHAPTERS.find(ch => chapterMastery(ch) < MASTERY_THRESHOLD);
  return next !== undefined ? next : CHAPTERS[CHAPTERS.length - 1];
}

function wordsToReview(limit) {
  const rows = [];
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      const s = state.stats[wordKey(ch, w.greek)];
      if (s && s.seen > 0 && s.correct < s.seen) {
        rows.push({ greek: w.greek, english: w.english, accuracy: s.correct / s.seen });
      }
    });
  });
  rows.sort((a, b) => a.accuracy - b.accuracy);
  return rows.slice(0, limit);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool(chapters) {
  const pool = [];
  chapters.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => pool.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim() }));
  });
  return pool;
}

function pickDistractors(correctItem, pool, field, n) {
  const others = shuffle(pool.filter(w => w[field] !== correctItem[field]));
  const seenVals = new Set([correctItem[field]]);
  const out = [];
  for (const w of others) {
    if (out.length >= n) break;
    if (seenVals.has(w[field])) continue;
    seenVals.add(w[field]);
    out.push(w[field]);
  }
  return out;
}

/* ---------- generous grading for typed answers ---------- */
function extractAlternatives(englishStr) {
  let alts = [];
  const parenRegex = /\(([^)]+)\)/g;
  let m;
  while ((m = parenRegex.exec(englishStr)) !== null) alts.push(m[1]);
  const cleaned = englishStr.replace(parenRegex, '');
  cleaned.split(/[,;]/).forEach(seg => {
    seg.split('/').forEach(sub => {
      const t = sub.trim();
      if (t) alts.push(t);
    });
  });
  return alts.filter(Boolean);
}

function normalizeAnswer(s) {
  return s.toLowerCase().trim()
    .replace(/^i\s+/, '')
    .replace(/^(a|an|the)\s+/, '')
    .replace(/[.!?]+$/, '')
    .replace(/\s+/g, ' ');
}

function wordBoundaryMatch(haystack, needle) {
  if (!needle) return false;
  const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('\\b' + escaped + '\\b').test(haystack);
}

function checkTypedAnswer(userInput, correctEnglish) {
  const user = normalizeAnswer(userInput);
  if (!user) return false;
  const alts = extractAlternatives(correctEnglish).map(normalizeAnswer);
  return alts.some(alt => {
    if (!alt) return false;
    if (user === alt) return true;
    if (alt.split(' ').length === 1) {
      return wordBoundaryMatch(user, alt) || wordBoundaryMatch(alt, user);
    }
    return user.includes(alt) || alt.includes(user);
  });
}

/* ---------- quiz construction ---------- */
function makeQuizItems(sourceItems, pool, settings) {
  return sourceItems.map(item => {
    let dir = settings.mode === 'typed' ? 'gtoe' : settings.direction;
    if (dir === 'mixed') dir = Math.random() < 0.5 ? 'gtoe' : 'etog';
    const answerField = dir === 'gtoe' ? 'english' : 'greek';
    const promptField = dir === 'gtoe' ? 'greek' : 'english';
    const q = {
      item, dir, promptField, answerField,
      prompt: item[promptField],
      correctAnswer: item[answerField]
    };
    if (settings.mode === 'mc') {
      const distractors = pickDistractors(item, pool, answerField, 3);
      q.options = shuffle([item[answerField], ...distractors]);
    }
    return q;
  });
}

function startQuiz(settings) {
  const chapters = [...settings.selectedChapters].sort((a, b) => a - b);
  const pool = buildPool(chapters);
  const n = Math.min(settings.count, pool.length);
  const chosen = shuffle(pool).slice(0, n);
  state.quiz = {
    settings: { ...settings, selectedChapters: chapters },
    pool,
    items: makeQuizItems(chosen, pool, settings),
    index: 0,
    score: 0,
    answered: false,
    selectedOpt: null,
    typedValue: '',
    typedCorrect: null
  };
  state.screen = 'flashcard';
  render();
}

function quickResume() {
  const ch = continueChapter();
  startQuiz({
    selectedChapters: new Set([ch]),
    count: (VOCAB[ch] || []).length,
    direction: 'gtoe',
    mode: 'mc'
  });
}

function startChapterReview(ch) {
  startQuiz({
    selectedChapters: new Set([ch]),
    count: (VOCAB[ch] || []).length,
    direction: 'gtoe',
    mode: 'mc'
  });
}

function quizInProgress() {
  return !!(state.quiz && state.quiz.index < state.quiz.items.length);
}

function goHome() { state.screen = 'home'; render(); }

function goReviewTab() {
  state.screen = quizInProgress() ? 'flashcard' : 'reviewSetup';
  render();
}

function goProgress() { state.screen = 'progress'; render(); }

/* ---------- quiz setup screen actions ---------- */
function toggleSetupChapter(ch) {
  if (state.setup.selectedChapters.has(ch)) state.setup.selectedChapters.delete(ch);
  else state.setup.selectedChapters.add(ch);
  render();
}
function setupSelectAll() { CHAPTERS.forEach(c => state.setup.selectedChapters.add(c)); render(); }
function setupSelectNone() { state.setup.selectedChapters.clear(); render(); }
function setSetupMode(m) {
  state.setup.mode = m;
  if (m === 'typed') state.setup.direction = 'gtoe';
  render();
}
function setSetupDirection(d) { state.setup.direction = d; render(); }
function setSetupCount(n) { state.setup.count = n; render(); }

function launchSetupQuiz() {
  const pool = buildPool([...state.setup.selectedChapters]);
  const minNeeded = state.setup.mode === 'typed' ? 1 : 4;
  if (pool.length < minNeeded) return;
  startQuiz({
    selectedChapters: new Set(state.setup.selectedChapters),
    count: state.setup.count,
    direction: state.setup.direction,
    mode: state.setup.mode
  });
}

/* ---------- answering ---------- */
function goNextQuestion(q) {
  if (q.index < q.items.length - 1) {
    q.index += 1;
    q.answered = false;
    q.selectedOpt = null;
    q.typedValue = '';
    q.typedCorrect = null;
    render();
  } else {
    state.screen = 'home';
    render();
  }
}

function selectOption(opt) {
  const q = state.quiz;
  if (!q || q.answered) return;
  q.answered = true;
  q.selectedOpt = opt;
  const current = q.items[q.index];
  const correct = opt === current.correctAnswer;
  if (correct) q.score += 1;
  bumpStreak();
  recordAttempt(current.item.chapter, current.item.greek, correct);
  render();
  setTimeout(() => { if (state.quiz === q) goNextQuestion(q); }, correct ? 650 : 1500);
}

function submitTyped() {
  const q = state.quiz;
  if (!q || q.answered) return;
  const input = document.getElementById('typed-input');
  const val = input ? input.value : '';
  const current = q.items[q.index];
  const correct = checkTypedAnswer(val, current.correctAnswer);
  q.answered = true;
  q.typedValue = val;
  q.typedCorrect = correct;
  if (correct) q.score += 1;
  bumpStreak();
  recordAttempt(current.item.chapter, current.item.greek, correct);
  render();
  setTimeout(() => { if (state.quiz === q) goNextQuestion(q); }, correct ? 650 : 1800);
}

/* ---------- rendering ---------- */
function glassLayer() { return '<div class="glass-fill"></div><div class="glass-edge"></div>'; }

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

function renderHeader(isHome, pillLabel) {
  return `
    <div class="header-row">
      <div>
        <p class="app-title">Oikos</p>
        ${isHome ? `<div class="app-subtitle text-muted">${greeting()}</div>` : ''}
      </div>
      <div class="pill glass">
        ${glassLayer()}
        <div class="glass-content">${pillLabel}</div>
      </div>
    </div>
  `;
}

function renderHome() {
  const stats = overallStats();
  const ch = continueChapter();
  const sample = (VOCAB[ch] || []).slice(0, 5).map(w => w.greek.split(',')[0].trim()).join(' · ');

  const chapterChips = CHAPTERS.map(c => {
    const mastery = chapterMastery(c);
    const done = mastery >= MASTERY_THRESHOLD;
    return `<button class="chapter-chip ${done ? 'done' : 'not-done'}" data-ch="${c}">${c}</button>`;
  }).join('');

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(true, `${state.streak.count}-day streak`)}

      <div class="continue-card glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">CONTINUE</div>
          <h2>Chapter ${ch}</h2>
          <p class="continue-words text-muted">${sample}</p>
          <button class="resume-btn" id="btn-resume">
            <div class="resume-fill"></div>
            <div class="resume-edge"></div>
            <span>Resume review</span>
          </button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-chip glass">${glassLayer()}<div class="glass-content"><div class="stat-value">${stats.wordsSeen}</div><div class="stat-label text-muted">words</div></div></div>
        <div class="stat-chip glass">${glassLayer()}<div class="glass-content"><div class="stat-value">${stats.accuracy}%</div><div class="stat-label text-muted">accuracy</div></div></div>
        <div class="stat-chip glass">${glassLayer()}<div class="glass-content"><div class="stat-value">${stats.chaptersMastered}/${stats.totalChapters}</div><div class="stat-label text-muted">chapters</div></div></div>
      </div>

      <div class="kicker" style="margin:8px 0 10px">CHAPTERS</div>
      <div class="chapters-grid">${chapterChips}</div>
    </div>
  `;

  document.getElementById('btn-resume').addEventListener('click', quickResume);
  document.querySelectorAll('.chapter-chip').forEach(el => {
    el.addEventListener('click', () => startChapterReview(Number(el.dataset.ch)));
  });
}

function renderReviewSetup() {
  const s = state.setup;
  const chapterChips = CHAPTERS.map(c => {
    const sel = s.selectedChapters.has(c) ? 'selected' : '';
    return `<button class="chapter-chip selectable ${sel}" data-ch="${c}">${c}</button>`;
  }).join('');

  const modeOptions = [{ id: 'mc', label: 'Multiple choice' }, { id: 'typed', label: 'Type answer' }];
  const modeHtml = modeOptions.map(o =>
    `<button class="seg-btn ${s.mode === o.id ? 'active' : ''}" data-mode="${o.id}">${o.label}</button>`
  ).join('');

  const dirOptions = [{ id: 'gtoe', label: 'Greek → English' }, { id: 'etog', label: 'English → Greek' }, { id: 'mixed', label: 'Mixed' }];
  const typedActive = s.mode === 'typed';
  const dirHtml = dirOptions.map(o =>
    `<button class="seg-btn ${(s.direction === o.id && !typedActive) ? 'active' : ''}" data-dir="${o.id}" ${typedActive ? 'disabled' : ''}>${o.label}</button>`
  ).join('');

  const counts = [10, 20, 30];
  const countHtml = counts.map(c =>
    `<button class="seg-btn ${s.count === c ? 'active' : ''}" data-count="${c}">${c}</button>`
  ).join('');

  const poolSize = buildPool([...s.selectedChapters]).length;
  const minNeeded = s.mode === 'typed' ? 1 : 4;
  const canStart = poolSize >= minNeeded;
  const startLabel = poolSize === 0
    ? 'Select at least one chapter'
    : (poolSize < minNeeded ? 'Select more chapters' : `Start quiz — ${Math.min(s.count, poolSize)} words`);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'New quiz')}

      <div class="setup-panel glass">
        ${glassLayer()}
        <div class="glass-content">

          <div class="setup-section">
            <div class="setup-label-row">
              <span class="kicker">CHAPTERS</span>
              <span>
                <button class="link-btn" id="btn-sel-all">Select all</button>
                &nbsp;&nbsp;
                <button class="link-btn" id="btn-sel-none">Clear</button>
              </span>
            </div>
            <div class="chapters-grid">${chapterChips}</div>
          </div>

          <div class="setup-section">
            <div class="kicker" style="margin-bottom:10px">ANSWER TYPE</div>
            <div class="segmented">${modeHtml}</div>
          </div>

          <div class="setup-section">
            <div class="kicker" style="margin-bottom:10px">DIRECTION</div>
            <div class="segmented">${dirHtml}</div>
            ${typedActive ? '<div class="setup-note text-muted">Type-answer mode always quizzes Greek → English, and accepts any one correct English meaning.</div>' : ''}
          </div>

          <div class="setup-section">
            <div class="kicker" style="margin-bottom:10px">NUMBER OF WORDS</div>
            <div class="segmented">${countHtml}</div>
          </div>

          <button class="start-btn" id="btn-start" ${canStart ? '' : 'disabled'}>
            <div class="resume-fill"></div>
            <div class="resume-edge"></div>
            <span>${startLabel}</span>
          </button>

        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.chapter-chip').forEach(el => {
    el.addEventListener('click', () => toggleSetupChapter(Number(el.dataset.ch)));
  });
  document.getElementById('btn-sel-all').addEventListener('click', setupSelectAll);
  document.getElementById('btn-sel-none').addEventListener('click', setupSelectNone);
  document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => setSetupMode(el.dataset.mode)));
  document.querySelectorAll('[data-dir]').forEach(el => {
    if (!typedActive) el.addEventListener('click', () => setSetupDirection(el.dataset.dir));
  });
  document.querySelectorAll('[data-count]').forEach(el => el.addEventListener('click', () => setSetupCount(Number(el.dataset.count))));
  if (canStart) document.getElementById('btn-start').addEventListener('click', launchSetupQuiz);
}

function renderFlashcard() {
  const q = state.quiz;
  const total = q.items.length;
  const current = q.items[q.index];
  const pct = Math.round((q.index / total) * 100);
  const isEnglishPrompt = current.promptField === 'english';
  const tag = current.dir === 'gtoe' ? 'GIVE THE ENGLISH MEANING' : 'GIVE THE GREEK WORD';

  let bodyHtml;
  if (q.settings.mode === 'mc') {
    const optionsHtml = current.options.map(opt => {
      let cls = '', icon = '';
      if (q.answered) {
        if (opt === current.correctAnswer) {
          cls = 'is-correct';
          icon = '<span class="option-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
        } else if (opt === q.selectedOpt) {
          cls = 'is-wrong';
          icon = '<span class="option-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>';
        } else {
          cls = 'is-faded';
        }
      }
      return `
        <button class="option-btn ${cls}" data-opt="${opt.replace(/"/g, '&quot;')}" ${q.answered ? 'disabled' : ''}>
          <div class="option-fill"></div>
          <div class="option-edge"></div>
          <div class="option-content"><span>${opt}</span>${icon}</div>
        </button>
      `;
    }).join('');
    bodyHtml = `<div class="options">${optionsHtml}</div>`;
  } else {
    const wrapCls = q.answered ? (q.typedCorrect ? 'is-correct' : 'is-wrong') : '';
    const feedback = q.answered
      ? (q.typedCorrect ? 'Correct.' : `Accepted answer: ${current.correctAnswer}`)
      : '';
    bodyHtml = `
      <div class="typed-row">
        <div class="typed-input-wrap glass ${wrapCls}">
          ${glassLayer()}
          <input class="typed-input" id="typed-input" type="text" autocomplete="off" autocapitalize="off"
            autocorrect="off" spellcheck="false" placeholder="Type the English meaning…" ${q.answered ? 'disabled' : ''}>
        </div>
        <button class="typed-submit" id="typed-submit" ${q.answered ? 'disabled' : ''}>
          <div class="resume-fill"></div>
          <span>Check</span>
        </button>
      </div>
      <div class="typed-feedback text-muted">${feedback}</div>
    `;
  }

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Review')}

      <div class="progress-row">
        <span>Question ${q.index + 1} of ${total}</span>
        <span>Score ${q.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="prompt-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">${tag}</div>
          <div class="prompt-word ${isEnglishPrompt ? 'is-english' : ''}" style="margin-top:12px">${current.prompt}</div>
        </div>
      </div>

      ${bodyHtml}
    </div>
  `;

  if (q.settings.mode === 'mc') {
    if (!q.answered) {
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.opt));
      });
    }
  } else {
    const input = document.getElementById('typed-input');
    const submitBtn = document.getElementById('typed-submit');
    if (!q.answered) {
      input.focus();
      submitBtn.addEventListener('click', submitTyped);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitTyped(); }
      });
    }
  }
}

function renderProgress() {
  const stats = overallStats();
  const circ = 2 * Math.PI * 54;
  const offset = circ * (1 - stats.accuracy / 100);

  const chapterRows = CHAPTERS.map(c => {
    const pct = chapterMastery(c);
    return `
      <div class="chapter-row">
        <div class="ch-num">${c}</div>
        <div class="ch-track"><div class="ch-fill" style="width:${pct}%"></div></div>
        <div class="ch-pct">${pct}%</div>
      </div>
    `;
  }).join('');

  const missed = wordsToReview(8);
  const missedHtml = missed.length
    ? missed.map(m => `
        <div class="missed-row">
          <span class="missed-greek">${m.greek}</span>
          <span class="missed-english text-muted">${m.english}</span>
        </div>
      `).join('')
    : '<div class="empty-note text-muted">No missed words yet — well done.</div>';

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Progress')}

      <div class="ring-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <svg width="128" height="128" viewBox="0 0 128 128" style="margin:0 auto;display:block">
            <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(32,30,29,0.08)" stroke-width="10"/>
            <circle cx="64" cy="64" r="54" fill="none" stroke="#4f7a5c" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 64 64)"/>
            <text x="64" y="70" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="26" fill="#201e1d">${stats.accuracy}%</text>
          </svg>
          <div class="ring-label text-muted">${stats.wordsSeen} of ${stats.totalWords} words</div>
          <div class="ring-caption text-muted">Accuracy is correct ÷ answered so far — not how much of the syllabus you've covered. See "words" and "chapters" on Home, and the chapter bars below, for coverage.</div>
        </div>
      </div>

      <div class="kicker" style="margin:0 0 10px">BY CHAPTER</div>
      <div class="list-panel glass">${glassLayer()}<div class="glass-content">${chapterRows}</div></div>

      <div class="kicker" style="margin:0 0 10px">WORDS TO REVIEW</div>
      <div class="list-panel glass" style="margin-bottom:0">${glassLayer()}<div class="glass-content">${missedHtml}</div></div>
    </div>
  `;
}

function renderTabBar() {
  document.getElementById('tab-home').classList.toggle('active', state.screen === 'home');
  document.getElementById('tab-review').classList.toggle('active', state.screen === 'flashcard' || state.screen === 'reviewSetup');
  document.getElementById('tab-progress').classList.toggle('active', state.screen === 'progress');
}

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'reviewSetup') renderReviewSetup();
  else if (state.screen === 'flashcard') {
    if (!quizInProgress()) { state.screen = 'reviewSetup'; renderReviewSetup(); renderTabBar(); return; }
    renderFlashcard();
  } else if (state.screen === 'progress') renderProgress();
  renderTabBar();
}

document.getElementById('tab-home').addEventListener('click', goHome);
document.getElementById('tab-review').addEventListener('click', goReviewTab);
document.getElementById('tab-progress').addEventListener('click', goProgress);

(async function init() {
  await loadData();
  render();
})();
</script>
