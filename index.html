<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Koine Drill</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koine Drill">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6f4e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --serif: Cambria, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --surface: #f2f8f4;
    --surface-2: #e6f1ea;
    --border: #cfe3d6;
    --text: #16261d;
    --text-dim: #4c6156;
    --accent: #2f6f4e;
    --accent-bright: #256143;
    --on-accent: #ffffff;
    --correct-bg: #dcefdf;
    --correct-text: #205a32;
    --wrong-bg: #f8dedb;
    --wrong-text: #8c2c22;
  }
  html[data-theme="dark"] {
    --bg: #0f1a14;
    --surface: #16241c;
    --surface-2: #1e3226;
    --border: #2b4536;
    --text: #eaf3ec;
    --text-dim: #9ab5a5;
    --accent: #4fae7c;
    --accent-bright: #63c491;
    --on-accent: #0f1a14;
    --correct-bg: #204a30;
    --correct-text: #a9e8bd;
    --wrong-bg: #4a2320;
    --wrong-text: #f3b3ac;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: var(--sans);
    color: var(--text);
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .topbar h1 {
    font-family: var(--serif);
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  .theme-toggle {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: var(--sans);
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 20px;
  }
  .subhead {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .rule {
    border: none;
    border-top: 1px solid var(--border);
    margin: 18px 0;
  }
  label.section-label {
    display: block;
    font-size: 0.78rem;
    color: var(--accent);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 8px 0;
    text-align: center;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.selected {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    font-weight: 700;
  }
  .row-buttons {
    display: flex;
    gap: 8px;
    margin: 10px 0 4px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-family: var(--sans);
  }
  .option-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .opt-btn {
    flex: 1 1 auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: var(--sans);
    transition: background 0.15s, border-color 0.15s;
  }
  .opt-btn.active {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    font-weight: 700;
  }
  .opt-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .note-line {
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .count-row {
    display: flex;
    gap: 8px;
  }
  .primary-btn {
    width: 100%;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 8px;
    padding: 14px 0;
    font-size: 1rem;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    margin-top: 18px;
    transition: background 0.15s, transform 0.1s;
  }
  .primary-btn:hover { background: var(--accent-bright); }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled {
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .ghost-btn {
    width: 100%;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 0;
    font-size: 0.9rem;
    font-family: var(--sans);
    cursor: pointer;
    margin-top: 10px;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* quiz screen */
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .progress-bar {
    height: 4px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .prompt-word {
    font-family: var(--serif);
    font-size: 2.1rem;
    text-align: center;
    color: var(--text);
    line-height: 1.25;
    margin: 6px 0 4px;
    word-break: break-word;
  }
  .prompt-lang-tag {
    text-align: center;
    font-size: 0.7rem;
    color: var(--accent);
    margin-bottom: 26px;
    letter-spacing: 0.04em;
    font-weight: 700;
  }
  .answer-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 0.95rem;
    font-family: var(--sans);
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .answer-btn:hover:not(:disabled) { border-color: var(--accent); }
  .answer-btn:disabled { cursor: default; }
  .answer-btn.correct { background: var(--correct-bg); color: var(--correct-text); border-color: var(--correct-text); font-weight: 700; }
  .answer-btn.wrong { background: var(--wrong-bg); color: var(--wrong-text); border-color: var(--wrong-text); font-weight: 700; }

  .typed-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .typed-input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: var(--sans);
  }
  .typed-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .typed-input.correct { border-color: var(--correct-text); background: var(--correct-bg); color: var(--correct-text); }
  .typed-input.wrong { border-color: var(--wrong-text); background: var(--wrong-bg); color: var(--wrong-text); }
  .typed-submit {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--sans);
  }
  .typed-submit:disabled { background: var(--surface-2); color: var(--text-dim); cursor: not-allowed; }

  .feedback-note {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    min-height: 20px;
    margin: 4px 0 14px;
  }

  /* results screen */
  .score-display {
    text-align: center;
    margin: 8px 0 20px;
  }
  .score-num {
    font-family: var(--serif);
    font-size: 3rem;
    color: var(--accent);
    line-height: 1;
  }
  .score-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .missed-list {
    margin-top: 6px;
  }
  .missed-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .missed-item:last-child { border-bottom: none; }
  .missed-greek { font-family: var(--serif); color: var(--text); }
  .missed-eng { color: var(--text-dim); text-align: right; }
  .empty-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.88rem;
    padding: 10px 0;
  }
  .stat-pill {
    display: inline-block;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 0.72rem;
    padding: 3px 9px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .hidden { display: none !important; }
</style>
</head>

const CHAPTERS = Object.keys(VOCAB).map(Number).sort((a,b)=>a-b);

/* ---------- storage: works inside Claude artifacts (window.storage) and on any
   normal web host / home-screen app (falls back to localStorage) ---------- */
const storageAdapter = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
    } catch (e) { /* key may not exist yet */ }
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(key, value, false);
        return;
      }
    } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(key, value); } catch (e) { /* non-fatal */ }
  }
};

const STATS_KEY = 'koine-drill-word-stats';
const THEME_KEY = 'koine-drill-theme';

let state = {
  screen: 'setup',
  selectedChapters: new Set(),
  direction: 'mixed',        // 'gtoe' | 'etog' | 'mixed'  (mc mode only)
  answerMode: 'mc',          // 'mc' | 'typed'
  count: 15,
  pool: [],
  quizItems: [],
  qIndex: 0,
  score: 0,
  missed: [],
  answered: false,
  stats: {},
  theme: 'light'
};

async function loadTheme() {
  const t = await storageAdapter.get(THEME_KEY);
  state.theme = (t === 'dark' || t === 'light') ? t : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
}

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  storageAdapter.set(THEME_KEY, state.theme);
  render();
}

async function loadStats() {
  const raw = await storageAdapter.get(STATS_KEY);
  try { state.stats = raw ? JSON.parse(raw) : {}; } catch (e) { state.stats = {}; }
}

function saveStats() {
  storageAdapter.set(STATS_KEY, JSON.stringify(state.stats));
}

function wordKey(item) {
  return item.chapter + '::' + item.greek;
}

function recordAttempt(item, correct) {
  const k = wordKey(item);
  if (!state.stats[k]) state.stats[k] = { seen: 0, correct: 0 };
  state.stats[k].seen += 1;
  if (correct) state.stats[k].correct += 1;
  saveStats();
}

function buildPool(chapters) {
  const pool = [];
  chapters.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      pool.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim() });
    });
  });
  return pool;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correctItem, pool, field, n) {
  const others = pool.filter(w => w[field] !== correctItem[field]);
  const shuffled = shuffle(others);
  const seen = new Set([correctItem[field]]);
  const out = [];
  for (const w of shuffled) {
    if (out.length >= n) break;
    if (seen.has(w[field])) continue;
    seen.add(w[field]);
    out.push(w[field]);
  }
  return out;
}

/* ---------- generous grading for typed answers ---------- */
function extractAlternatives(englishStr) {
  let alts = [];
  const parenRegex = /\(([^)]+)\)/g;
  let m;
  while ((m = parenRegex.exec(englishStr)) !== null) alts.push(m[1]);
  const cleaned = englishStr.replace(parenRegex, '');
  cleaned.split(/[,;]/).forEach(seg => {
    seg.split('/').forEach(sub => {
      const t = sub.trim();
      if (t) alts.push(t);
    });
  });
  return alts.filter(Boolean);
}

function normalizeAnswer(s) {
  return s.toLowerCase().trim()
    .replace(/^i\s+/, '')
    .replace(/^(a|an|the)\s+/, '')
    .replace(/[.!?]+$/, '')
    .replace(/\s+/g, ' ');
}

function wordBoundaryMatch(haystack, needle) {
  if (!needle) return false;
  const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('\\b' + escaped + '\\b').test(haystack);
}

function checkTypedAnswer(userInput, correctEnglish) {
  const user = normalizeAnswer(userInput);
  if (!user) return false;
  const alts = extractAlternatives(correctEnglish).map(normalizeAnswer);
  return alts.some(alt => {
    if (!alt) return false;
    if (user === alt) return true;
    if (alt.split(' ').length === 1) {
      return wordBoundaryMatch(user, alt) || wordBoundaryMatch(alt, user);
    }
    return user.includes(alt) || alt.includes(user);
  });
}

function makeQuizItems(sourceItems, pool) {
  return sourceItems.map(item => {
    let dir = state.answerMode === 'typed' ? 'gtoe' : state.direction;
    if (dir === 'mixed') dir = Math.random() < 0.5 ? 'gtoe' : 'etog';
    const field = dir === 'gtoe' ? 'english' : 'greek';
    const promptField = dir === 'gtoe' ? 'greek' : 'english';
    const q = {
      item, dir, promptField, field,
      prompt: item[promptField],
      correctAnswer: item[field]
    };
    if (state.answerMode === 'mc') {
      const distractors = pickDistractors(item, pool, field, 3);
      q.options = shuffle([item[field], ...distractors]);
    }
    return q;
  });
}

function buildQuiz() {
  const pool = buildPool([...state.selectedChapters]);
  state.pool = pool;
  const n = Math.min(state.count, pool.length);
  const chosen = shuffle(pool).slice(0, n);
  state.quizItems = makeQuizItems(chosen, pool);
  state.qIndex = 0;
  state.score = 0;
  state.missed = [];
  state.answered = false;
  state.screen = 'quiz';
  render();
}

function selectChip(ch) {
  if (state.selectedChapters.has(ch)) state.selectedChapters.delete(ch);
  else state.selectedChapters.add(ch);
  render();
}

function selectAll() { CHAPTERS.forEach(c => state.selectedChapters.add(c)); render(); }
function selectNone() { state.selectedChapters.clear(); render(); }
function setDirection(d) { state.direction = d; render(); }
function setAnswerMode(m) { state.answerMode = m; render(); }
function setCount(n) { state.count = n; render(); }

function goNext(delay) {
  setTimeout(() => {
    if (state.qIndex < state.quizItems.length - 1) {
      state.qIndex += 1;
      state.answered = false;
      render();
    } else {
      state.screen = 'results';
      render();
    }
  }, delay);
}

function answerMC(opt, btnEl) {
  if (state.answered) return;
  state.answered = true;
  const q = state.quizItems[state.qIndex];
  const correct = opt === q.correctAnswer;
  if (correct) state.score += 1;
  else state.missed.push(q);
  recordAttempt(q.item, correct);

  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.opt === q.correctAnswer) b.classList.add('correct');
    else if (b === btnEl && !correct) b.classList.add('wrong');
  });
  const note = document.getElementById('feedback-note');
  if (note) note.textContent = correct ? 'Correct.' : ('Correct answer: ' + q.correctAnswer);
  goNext(correct ? 650 : 1500);
}

function answerTyped() {
  if (state.answered) return;
  const input = document.getElementById('typed-input');
  const val = input.value;
  state.answered = true;
  const q = state.quizItems[state.qIndex];
  const correct = checkTypedAnswer(val, q.correctAnswer);
  if (correct) state.score += 1;
  else state.missed.push(q);
  recordAttempt(q.item, correct);

  input.disabled = true;
  input.classList.add(correct ? 'correct' : 'wrong');
  document.getElementById('typed-submit').disabled = true;
  const note = document.getElementById('feedback-note');
  if (note) note.textContent = correct ? 'Correct.' : ('Accepted answer: ' + q.correctAnswer);
  goNext(correct ? 650 : 1800);
}

function retryMissed() {
  const missedItems = state.missed.map(q => q.item);
  const uniqueByKey = {};
  missedItems.forEach(it => { uniqueByKey[wordKey(it)] = it; });
  const items = Object.values(uniqueByKey);
  state.pool = buildPool([...state.selectedChapters]);
  state.quizItems = makeQuizItems(items, state.pool);
  state.qIndex = 0;
  state.score = 0;
  state.missed = [];
  state.answered = false;
  state.screen = 'quiz';
  render();
}

function backToSetup() { state.screen = 'setup'; render(); }

function themeToggleHtml() {
  const label = state.theme === 'light' ? 'Dark mode' : 'Light mode';
  return `<button class="theme-toggle" id="theme-toggle">${label}</button>`;
}

function renderSetup() {
  const chipsHtml = CHAPTERS.map(ch => {
    const sel = state.selectedChapters.has(ch) ? 'selected' : '';
    return `<div class="chip ${sel}" data-ch="${ch}">${ch}</div>`;
  }).join('');

  const dirOptions = [
    { id: 'gtoe', label: 'Greek → English' },
    { id: 'etog', label: 'English → Greek' },
    { id: 'mixed', label: 'Mixed' }
  ];
  const typedActive = state.answerMode === 'typed';
  const dirHtml = dirOptions.map(o => {
    const active = (state.direction === o.id && !typedActive) ? 'active' : '';
    return `<button class="opt-btn" data-dir="${o.id}" ${typedActive ? 'disabled' : ''}>${o.label}</button>`;
  }).join('');

  const modeOptions = [
    { id: 'mc', label: 'Multiple choice' },
    { id: 'typed', label: 'Type the answer' }
  ];
  const modeHtml = modeOptions.map(o => {
    const active = state.answerMode === o.id ? 'active' : '';
    return `<button class="opt-btn ${active}" data-mode="${o.id}">${o.label}</button>`;
  }).join('');

  const counts = [10, 15, 20, 30];
  const countHtml = counts.map(c => {
    const active = state.count === c ? 'active' : '';
    return `<button class="opt-btn ${active}" data-count="${c}">${c}</button>`;
  }).join('');

  const poolSize = buildPool([...state.selectedChapters]).length;
  const minNeeded = state.answerMode === 'typed' ? 1 : 4;
  const canStart = poolSize >= minNeeded;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <h1>Koine Drill</h1>
      ${themeToggleHtml()}
    </div>
    <div class="card">
      <p class="subhead">Beginning with New Testament Greek — Merkle &amp; Plummer vocabulary, chapters 1&ndash;23.</p>

      <label class="section-label">Chapters</label>
      <div class="chapter-grid">${chipsHtml}</div>
      <div class="row-buttons">
        <button class="link-btn" id="btn-all">Select all</button>
        <button class="link-btn" id="btn-none">Clear</button>
      </div>

      <hr class="rule">

      <label class="section-label">Answer type</label>
      <div class="option-group">${modeHtml}</div>
      ${typedActive ? '<div class="note-line">Typed mode always quizzes Greek → English, and accepts any one correct English meaning.</div>' : ''}

      <hr class="rule">

      <label class="section-label">Direction</label>
      <div class="option-group">${dirHtml}</div>

      <hr class="rule">

      <label class="section-label">Number of questions</label>
      <div class="option-group count-row">${countHtml}</div>

      <button class="primary-btn" id="btn-start" ${canStart ? '' : 'disabled'}>
        ${poolSize === 0 ? 'Select at least one chapter' : (poolSize < minNeeded ? 'Select more chapters' : 'Start quiz — ' + Math.min(state.count, poolSize) + ' words')}
      </button>
    </div>
  `;

  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  document.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => selectChip(Number(el.dataset.ch))));
  document.getElementById('btn-all').addEventListener('click', selectAll);
  document.getElementById('btn-none').addEventListener('click', selectNone);
  document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => setAnswerMode(el.dataset.mode)));
  document.querySelectorAll('[data-dir]').forEach(el => {
    if (!typedActive) el.addEventListener('click', () => setDirection(el.dataset.dir));
  });
  document.querySelectorAll('[data-count]').forEach(el => el.addEventListener('click', () => setCount(Number(el.dataset.count))));
  const startBtn = document.getElementById('btn-start');
  if (canStart) startBtn.addEventListener('click', buildQuiz);
}

function renderQuiz() {
  const q = state.quizItems[state.qIndex];
  const total = state.quizItems.length;
  const pct = Math.round((state.qIndex / total) * 100);
  const langTag = q.dir === 'gtoe' ? 'Give the English meaning' : 'Give the Greek word';

  let bodyHtml;
  if (state.answerMode === 'mc') {
    const optionsHtml = q.options.map(opt =>
      `<button class="answer-btn" data-opt="${opt.replace(/"/g, '&quot;')}">${opt}</button>`
    ).join('');
    bodyHtml = `<div id="options-wrap">${optionsHtml}</div>`;
  } else {
    bodyHtml = `
      <div class="typed-row">
        <input class="typed-input" id="typed-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the English meaning…">
        <button class="typed-submit" id="typed-submit">Check</button>
      </div>
    `;
  }

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <h1>Koine Drill</h1>
      ${themeToggleHtml()}
    </div>
    <div class="card">
      <div class="progress-row">
        <span>Question ${state.qIndex + 1} of ${total}</span>
        <span>Score: ${state.score}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="prompt-lang-tag">${langTag}</div>
      <div class="prompt-word">${q.prompt}</div>
      <div class="feedback-note" id="feedback-note"></div>

      ${bodyHtml}
    </div>
  `;

  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

  if (state.answerMode === 'mc') {
    document.querySelectorAll('.answer-btn').forEach(btn => {
      btn.addEventListener('click', () => answerMC(btn.dataset.opt, btn));
    });
  } else {
    const input = document.getElementById('typed-input');
    const submitBtn = document.getElementById('typed-submit');
    input.focus();
    submitBtn.addEventListener('click', answerTyped);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); answerTyped(); }
    });
  }
}

function renderResults() {
  const total = state.score + state.missed.length;
  const missedUnique = [];
  const seenKeys = new Set();
  state.missed.forEach(q => {
    const k = wordKey(q.item);
    if (!seenKeys.has(k)) { seenKeys.add(k); missedUnique.push(q); }
  });

  const missedHtml = missedUnique.length
    ? missedUnique.map(q => `
        <div class="missed-item">
          <span class="missed-greek">${q.item.greek}</span>
          <span class="missed-eng">${q.item.english}</span>
        </div>
      `).join('')
    : '<div class="empty-note">No misses — well done.</div>';

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <h1>Koine Drill</h1>
      ${themeToggleHtml()}
    </div>
    <div class="card">
      <div class="score-display">
        <div class="score-num">${state.score}/${total}</div>
        <div class="score-label">correct</div>
        <div class="stat-pill">${[...state.selectedChapters].sort((a,b)=>a-b).join(', ')}</div>
      </div>

      <hr class="rule">
      <label class="section-label">Words to review</label>
      <div class="missed-list">${missedHtml}</div>

      ${missedUnique.length ? '<button class="primary-btn" id="btn-retry">Drill missed words again</button>' : ''}
      <button class="ghost-btn" id="btn-new">New quiz setup</button>
    </div>
  `;

  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  if (missedUnique.length) document.getElementById('btn-retry').addEventListener('click', retryMissed);
  document.getElementById('btn-new').addEventListener('click', backToSetup);
}

function render() {
  if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'quiz') renderQuiz();
  else if (state.screen === 'results') renderResults();
}

(async function init() {
  await loadTheme();
  await loadStats();
  render();
})();
</script>
</body>
</html>
