/* the multiple-choice answer list, for any question that can name its options
   and which of them is right -- vocabulary words and grammar forms both. The
   markup is the original vocab one unchanged: a miss stays colourless, which
   is the only register this palette has for one. */
function mcOptionsHtml(options, answered, correctAnswer, selectedOpt) {
  const optionsHtml = options.map((opt, optIndex) => {
    let cls = '', icon = '';
    if (answered) {
      if (opt === correctAnswer) {
        cls = 'is-correct';
        icon = '<span class="option-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
      } else if (opt === selectedOpt) {
        cls = 'is-wrong';
        icon = '<span class="option-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>';
      } else {
        cls = 'is-faded';
      }
    }
    return `
      <button class="option-btn ${cls}" data-opt="${opt.replace(/"/g, '&quot;')}" ${answered ? 'disabled' : ''}>
        <div class="option-fill"></div>
        <div class="option-edge"></div>
        <div class="option-content"><span class="opt-key">${optIndex + 1}</span><span>${opt}</span>${icon}</div>
      </button>
    `;
  }).join('');
  return `<div class="options">${optionsHtml}</div>`;
}

function renderFlashcard() {
  const q = state.quiz;
  const total = q.items.length;
  const current = q.items[q.index];
  const pct = Math.round((q.index / total) * 100);
  const isEnglishPrompt = current.promptField === 'english';
  const tag = current.dir === 'gtoe' ? 'GIVE THE ENGLISH MEANING' : 'GIVE THE GREEK WORD';

  let bodyHtml;
  if (q.settings.mode === 'mc') {
    bodyHtml = mcOptionsHtml(current.options, q.answered, current.correctAnswer, q.selectedOpt);
  } else {
    bodyHtml = `
      <div class="typed-row">
        <div class="typed-input-wrap glass">
          ${glassLayer()}
          <input class="typed-input" id="typed-input" type="text" autocomplete="off" autocapitalize="off"
            autocorrect="off" spellcheck="false" placeholder="Type the English meaning…" ${q.answered ? 'disabled' : ''}>
        </div>
        <button class="typed-submit" id="typed-submit" ${q.answered ? 'disabled' : ''}>
          <div class="resume-fill"></div>
          <span>Check</span>
          <span class="key-hint on-accent">↵</span>
        </button>
      </div>
      <div class="typed-note">Enter checks your answer — the card turns over, then the next word comes up</div>
    `;
  }

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Review', true)}

      <div class="progress-row">
        <span>Question ${q.index + 1} of ${total}</span>
        <span id="quiz-score">Score ${q.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="quiz-body ${q.settings.mode === 'mc' ? 'is-mc' : 'is-typed'}">
        ${q.settings.mode === 'mc' ? `
        <div class="prompt-panel glass">
          ${glassLayer()}
          <div class="glass-content">
            <div class="kicker">${tag}</div>
            <div class="prompt-word ${isEnglishPrompt ? 'is-english' : ''}" style="margin-top:12px">${current.prompt}</div>
            <div class="prompt-meta">Chapter ${current.item.chapter} · ${current.item.cat}</div>
          </div>
        </div>` : `
        <div class="prompt-panel glass flip is-result ${q.answered ? 'is-flipped' : ''}" id="typed-card">
          ${glassLayer()}
          <div class="glass-content flip-inner">
            <div class="flip-face flip-front">
              <div class="kicker">${tag}</div>
              <div class="prompt-word" style="margin-top:12px">${current.prompt}</div>
            </div>
            <div class="flip-face flip-back">
              <div class="result-face ${q.answered && !q.typedCorrect ? 'is-wrong' : ''}" id="typed-result">${
                q.answered ? `
                <div class="result-mark ${q.typedCorrect ? 'is-correct' : 'is-wrong'}">${resultMarkSvg(q.typedCorrect)}</div>
                <div class="kicker">${q.typedCorrect ? 'CORRECT' : 'NOT QUITE'}</div>` : ''
              }</div>
            </div>
          </div>
        </div>`}

        <div>${bodyHtml}</div>
      </div>
    </div>
  `;

  if (q.settings.mode === 'mc') {
    if (!q.answered) {
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.opt));
      });
    }
  } else {
    const input = document.getElementById('typed-input');
    const submitBtn = document.getElementById('typed-submit');
    if (!q.answered) {
      input.focus();
      submitBtn.addEventListener('click', submitTyped);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitTyped(); }
      });
    }
  }

  document.getElementById('btn-exit-quiz').addEventListener('click', exitQuiz);
}

/* ---------- memory game ---------- */
function memoryCardBack() {
  return '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5.5" width="12" height="9" rx="1.5" transform="rotate(-6 8.5 10)" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="4" width="12" height="9" rx="1.9" stroke="currentColor" stroke-width="1.9"/></svg>';
}

function renderMemory() {
  const m = state.memory;
  if (!m) { goHome(); return; }
  if (m.finishedMs !== null) { renderMemoryDone(); return; }

  const tiles = m.tiles.map(t => {
    const flipped = t.matched || m.flipped.indexOf(t.id) !== -1;
    return `
      <button class="mem-tile ${flipped ? 'is-flipped' : ''} ${t.matched ? 'is-matched' : ''}" id="mem-${t.id}" data-tile="${t.id}">
        <div class="mem-tile-inner">
          <div class="mem-face mem-front">${memoryCardBack()}</div>
          <div class="mem-face mem-back ${t.kind === 'greek' ? 'is-greek' : ''}">${t.text}</div>
        </div>
      </button>
    `;
  }).join('');

  /* a thin selection plays a smaller board rather than failing -- say so */
  const shortNote = m.pairs < MEMORY_PAIRS
    ? `<p class="mem-note text-muted">Only ${m.poolSize} word${m.poolSize === 1 ? '' : 's'} available — playing with ${m.pairs} pair${m.pairs === 1 ? '' : 's'}.</p>`
    : '';
  const best = state.memoryBest !== null ? `Best ${formatTime(state.memoryBest)}` : 'No best yet';

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Memory Game', true, null, 'Arrow keys move · Space flips · R replays')}

      <div class="progress-row">
        <span id="mem-count">Pairs ${m.matched} of ${m.pairs}</span>
        <span><span id="mem-timer">${formatTime(memoryElapsed())}</span><span class="sep">\u00b7</span>${best}</span>
      </div>

      ${shortNote}
      <div class="mem-grid">${tiles}</div>
    </div>
  `;

  document.querySelectorAll('.mem-tile').forEach(el => {
    el.addEventListener('click', () => flipMemoryTile(el.dataset.tile));
  });
  paintMemoryFocus();
  document.getElementById('btn-exit-quiz').addEventListener('click', exitMemory);
}

function renderMemoryDone() {
  const m = state.memory;
  const isFirst = m.previousBest === null;
  const badge = m.beatBest
    ? `New personal best — ${formatTime(m.previousBest)} beaten`
    : (isFirst ? 'Your first best time' : `Best ${formatTime(state.memoryBest)}`);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Memory Game', true, null, 'R deals a new board')}

      <div class="ring-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">ALL PAIRS MATCHED</div>
          <div class="mem-done-time">${formatTime(m.finishedMs)}</div>
          <div class="ring-label text-muted">${m.pairs} pair${m.pairs === 1 ? '' : 's'} · ${selectionLabel(m.selection)}</div>
          <div class="mem-done-badge">${badge}</div>
        </div>
      </div>

      <div class="card-actions">
        <button class="ghost-btn" id="btn-mem-home">Done</button>
        <button class="start-btn" id="btn-mem-again">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>Play again</span>
        </button>
      </div>
    </div>
  `;

  document.getElementById('btn-mem-home').addEventListener('click', exitMemory);
  document.getElementById('btn-mem-again').addEventListener('click', replayMemory);
  document.getElementById('btn-exit-quiz').addEventListener('click', exitMemory);
}

function ringSvg(pct) {
  const circ = 2 * Math.PI * 54;
  const offset = circ * (1 - pct / 100);
  return `
    <svg width="108" height="108" viewBox="0 0 128 128" style="margin:0 auto;display:block">
      <circle cx="64" cy="64" r="54" fill="none" stroke="var(--track)" stroke-width="10"/>
      <circle cx="64" cy="64" r="54" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 64 64)"/>
      <text x="64" y="70" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="24" fill="var(--ink)" style="font-feature-settings:'tnum'">${pct}%</text>
    </svg>
  `;
}

/* Progress carries two modules now, so it splits rather than growing a third
   column of unrelated numbers. The vocab half is exactly what it always was. */
function setProgressTab(tab) { state.progressTab = tab; render(); }

function progressTabs() {
  return `
    <div class="prog-tabs segmented">
      <button class="seg-btn ${state.progressTab === 'vocab' ? 'active' : ''}" data-ptab="vocab">Vocab</button>
      <button class="seg-btn ${state.progressTab === 'grammar' ? 'active' : ''}" data-ptab="grammar">Grammar</button>
    </div>
  `;
}

function wireProgressTabs() {
  document.querySelectorAll('[data-ptab]').forEach(el => {
    el.addEventListener('click', () => setProgressTab(el.dataset.ptab));
  });
}

/* the grammar half: clean runs per paradigm, nothing scheduled and nothing
   inferred -- the only two numbers the drill records */
function renderGrammarProgress() {
  const mastered = paradigmsMastered();
  const rows = PARADIGMS.map(p => {
    const s = grammarStat(p.id);
    const acc = grammarQuizAccuracy(p.id);
    const sortFigure = s.attempts === 0
      ? 'Not sorted'
      : `${s.cleanRuns} clean · ${s.attempts} run${s.attempts === 1 ? '' : 's'}`;
    const quizFigure = acc === null
      ? 'No quiz yet'
      : `${acc}% of ${s.quizAttempts} question${s.quizAttempts === 1 ? '' : 's'}`;
    return `
      <div class="pg-stat-row">
        <span class="pg-stat-name">
          ${escapeHtml(p.label)}${paradigmInScope(p) ? '' : ' <span class="pg-tag">Not yet in class</span>'}
          <span class="pg-stat-example">${escapeHtml(p.example)}</span>
        </span>
        <span class="pg-stat-figures">
          <span class="pg-stat-sort ${s.cleanRuns > 0 ? 'is-on' : 'text-muted'}">${sortFigure}</span>
          <span class="pg-stat-quiz ${acc === null ? 'text-muted' : 'is-on'}">${quizFigure}</span>
        </span>
      </div>
    `;
  }).join('');

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Progress')}
      ${progressTabs()}

      <div class="ring-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">PARADIGMS MASTERED</div>
          ${ringSvg(PARADIGMS.length ? Math.round((mastered / PARADIGMS.length) * 100) : 0)}
          <div class="ring-label text-muted">${mastered} of ${PARADIGMS.length} sorted with no wrong drops</div>
          <div class="ring-caption text-muted">${(() => {
            const asked = PARADIGMS.reduce((n, p) => n + grammarStat(p.id).quizAttempts, 0);
            const right = PARADIGMS.reduce((n, p) => n + grammarStat(p.id).quizCorrect, 0);
            return asked ? `Form Quiz: ${Math.round((right / asked) * 100)}% of ${asked} question${asked === 1 ? '' : 's'}` : 'Form Quiz: not tried yet';
          })()}</div>
        </div>
      </div>

      <div class="kicker" style="margin:0 0 10px">BY PARADIGM — SORT · QUIZ</div>
      <div class="list-panel glass">${glassLayer()}<div class="glass-content">${rows}</div></div>
    </div>
  `;

  wireProgressTabs();
}

function renderProgress() {
  if (state.progressTab === 'grammar') { renderGrammarProgress(); return; }
  const stats = overallStats();
  const learned = learnedWordsCount();
  const progressPct = stats.totalWords > 0 ? Math.round((learned / stats.totalWords) * 100) : 0;

  const srs = fsrsBreakdown();
  const srsRows = FSRS_STATE_LABELS.map((label, i) => `
      <div class="fsrs-row">
        <span>${label}</span>
        <span class="fsrs-count">${srs.counts[i]}</span>
      </div>
    `).join('') + `
      <div class="fsrs-row is-due">
        <span>Due today</span>
        <span class="fsrs-count">${srs.due}</span>
      </div>`;

  const chapterRows = CHAPTERS.map(c => {
    const pct = chapterMastery(c);
    return `
      <div class="chapter-row">
        <div class="ch-num">${c}</div>
        <div class="ch-track"><div class="ch-fill" style="width:${pct}%"></div></div>
        <div class="ch-pct">${pct}%</div>
      </div>
    `;
  }).join('');

  const missed = wordsToReview(8);
  /* a dot per correct answer still needed, so a word visibly works its way off
     the list rather than just disappearing one day */
  const streakDots = n => `
    <span class="streak-dots" title="${n} of ${REVIEW_CLEAR_STREAK} correct in a row">
      ${Array.from({ length: REVIEW_CLEAR_STREAK }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}
    </span>`;
  const missedHtml = missed.length
    ? missed.map(m => `
        <div class="missed-row">
          <span class="missed-greek">${m.greek}</span>
          <span class="missed-right">
            <span class="missed-english text-muted">${m.english}</span>
            ${streakDots(m.streak)}
          </span>
        </div>
      `).join('')
    : '<div class="empty-note text-muted">No missed words yet — well done.</div>';

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Progress')}
      ${progressTabs()}

      <div class="prog-grid">
        <div class="rings-row prog-rings">
          <div class="ring-panel glass">
            ${glassLayer()}
            <div class="glass-content">
              <div class="kicker">ACCURACY</div>
              ${ringSvg(stats.accuracy)}
              <div class="ring-label text-muted">${stats.wordsSeen} words answered</div>
            </div>
          </div>
          <div class="ring-panel glass">
            ${glassLayer()}
            <div class="glass-content">
              <div class="kicker">PROGRESS</div>
              ${ringSvg(progressPct)}
              <div class="ring-label text-muted">${learned} of ${stats.totalWords} words learned</div>
            </div>
          </div>
        </div>

        <section class="prog-block prog-review">
          <div class="kicker" style="margin:0 0 10px">WORDS TO REVIEW</div>
          <div class="list-panel glass">${glassLayer()}<div class="glass-content">${missedHtml}</div></div>
        </section>

        <section class="prog-block prog-srs">
          <div class="kicker" style="margin:0 0 10px">SPACED REPETITION</div>
          <div class="list-panel glass">${glassLayer()}<div class="glass-content">${srsRows}</div></div>
        </section>

        <section class="prog-block prog-memory">
          <div class="kicker" style="margin:0 0 10px">MEMORY GAME</div>
          <div class="list-panel glass">${glassLayer()}<div class="glass-content">
            <div class="missed-row">
              <span>Best time</span>
              <span class="missed-english ${state.memoryBest === null ? 'text-muted' : ''}">${state.memoryBest === null ? 'Not played yet' : formatTime(state.memoryBest)}</span>
            </div>
          </div></div>
        </section>

        <section class="prog-block prog-chapters">
          <div class="kicker" style="margin:0 0 10px">BY CHAPTER</div>
          <div class="list-panel glass" style="margin-bottom:0">${glassLayer()}<div class="glass-content">${chapterRows}</div></div>
        </section>
      </div>

      <div class="prog-replay">
        <button class="link-btn" id="btn-replay-onboarding">Replay walkthrough</button>
      </div>
    </div>
  `;

  document.getElementById('btn-replay-onboarding').addEventListener('click', replayOnboarding);
  wireProgressTabs();
}

        </div>
        <div class="onb-buttons">
          <button class="secondary-btn" id="onb-back">Back</button>
          <button class="start-btn" id="onb-next">
            <span class="resume-fill"></span><span class="resume-edge"></span>
            <span id="onb-next-label">Next</span>
          </button>
        </div>
      </footer>
    </div>
  `;

  document.getElementById('onb-skip').addEventListener('click', finishOnboarding);
  document.getElementById('onb-back').addEventListener('click', () => stepOnboarding(-1));
  document.getElementById('onb-next').addEventListener('click', () => {
    if (state.onboarding.i === ONBOARDING_LAST) finishOnboarding();
    else stepOnboarding(1);
  });

  bindOnboardingInput();
  paintOnboarding();
}

function paintOnboarding() {
  const i = state.onboarding.i;
  const last = i === ONBOARDING_LAST;
  document.getElementById('onb-track').style.transform = `translateX(-${i * 100}%)`;
  document.querySelectorAll('#onb-dots .onb-dot').forEach((el, n) => el.classList.toggle('active', n === i));
  document.getElementById('onb-count').textContent = `${i + 1} of ${ONBOARDING_SCREENS.length}`;
  document.getElementById('onb-back').disabled = i === 0;
  document.getElementById('onb-next-label').textContent = last ? 'Get started' : 'Next';
}

function stepOnboarding(delta) {
  const next = Math.max(0, Math.min(ONBOARDING_LAST, state.onboarding.i + delta));
  if (next === state.onboarding.i) return;
  state.onboarding.i = next;
  paintOnboarding();
}

/* Arrow keys and a horizontal swipe. Both are torn down on completion so the
   app's own keydown handler is the only one left afterwards. */
let onbInput = null;

function bindOnboardingInput() {
  if (onbInput) return;
  let touchX = null;
  onbInput = {
    key(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stepOnboarding(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stepOnboarding(-1); }
    },
    /* one finger only -- a two-finger pinch or zoom is not a swipe */
    start(e) { touchX = e.touches && e.touches.length === 1 ? e.touches[0].clientX : null; },
    end(e) {
      if (touchX === null || !e.changedTouches || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 48) stepOnboarding(dx < 0 ? 1 : -1);
    }
  };
  document.addEventListener('keydown', onbInput.key);
  document.addEventListener('touchstart', onbInput.start, { passive: true });
  document.addEventListener('touchend', onbInput.end, { passive: true });
}

function unbindOnboardingInput() {
  if (!onbInput) return;
  document.removeEventListener('keydown', onbInput.key);
  document.removeEventListener('touchstart', onbInput.start);
  document.removeEventListener('touchend', onbInput.end);
  onbInput = null;
}

/* Skip and Get started land in the same place: flag written, overlay gone,
   home screen underneath. */
function finishOnboarding() {
  state.onboarding.active = false;
  saveOnboardingSeen();
  unbindOnboardingInput();
  document.body.classList.remove('onboarding-open');
  document.getElementById('onboarding').innerHTML = '';
  goHome();
}

function replayOnboarding() {
  state.onboarding = { active: true, i: 0 };
  render();
}

/* ---------- grammar: Sort the Table ----------
   The drill for every paradigm: the grid comes up with its headers and no
   contents, and the student drags the shuffled forms into place. Nothing here
   asks for typed Greek -- there is no Greek keyboard on the phone this is
   used from, so dragging (or tapping a card and then a cell) is the whole
   input vocabulary.

   Feedback is per drop rather than at the end: a right card locks in and
   uncovers its gloss, a wrong one goes back to the stack and the cell flinches
   in --surface-2 / --muted. No FSRS and no per-cell record -- only
   { attempts, cleanRuns } per paradigm, a clean run being a completion with no
   wrong drops at all. */

const GRAMMAR_STATS_KEY = 'oikos-grammar-stats';

const GRAMMAR_GROUPS = [
  { category: 'noun', label: 'Nouns' },
  { category: 'pronoun', label: 'Pronouns' },
  { category: 'verb', label: 'Verbs', subs: [
      { key: 'indicative', label: 'Indicative' },
      { key: 'subjunctive', label: 'Subjunctive' },
      { key: 'imperative', label: 'Imperative' },
      { key: 'didomi-nonindicative', label: 'δίδωμι — non-indicative' }
    ] },
  { category: 'participle', label: 'Participles' },
  { category: 'infinitive', label: 'Infinitives' }
];

function saveGrammarStats() { storageAdapter.set(GRAMMAR_STATS_KEY, JSON.stringify(state.grammarStats)); }

/* two drills, two records: Sort the Table's { attempts, cleanRuns } and the
   Form Quiz's { quizAttempts, quizCorrect }. They measure different things --
   placing a form you are looking at, and producing one you are not -- so they
   are never rolled into a single number. */
function grammarStat(id) {
  const s = state.grammarStats[id] || {};
  return {
    attempts: s.attempts || 0, cleanRuns: s.cleanRuns || 0,
    quizAttempts: s.quizAttempts || 0, quizCorrect: s.quizCorrect || 0
  };
}

function grammarQuizAccuracy(id) {
  const s = grammarStat(id);
  return s.quizAttempts ? Math.round((s.quizCorrect / s.quizAttempts) * 100) : null;
}

/* "mastered" is deliberately a low bar for v1: one run through with nothing
   dropped in the wrong cell */
function paradigmsMastered() { return PARADIGMS.filter(p => grammarStat(p.id).cleanRuns > 0).length; }

function paradigmById(id) { return PARADIGMS.find(p => p.id === id) || null; }

function paradigmInScope(p) { return PARADIGMS_IN_SCOPE.has(p.id); }

function paradigmCellKeys(p) {
  const keys = [];
  p.colLabels.forEach(col => p.rowLabels.forEach(row => {
    const k = row + '|' + col;
    if (p.cells[k]) keys.push(k);
  }));
  return keys;
}

function cellFace(cell) { return (cell.article ? cell.article + ' ' : '') + cell.form; }

/* Several paradigms repeat a form across cells -- τέκνον is both nominative
   and accusative, λύοντα covers neuter plural and masculine accusative, and
   δίδωμι's imperative grid is half em-dashes. A card is therefore checked
   against what the target cell says rather than against the one cell it was
   dealt from, so any cell with that exact face accepts it. */
function cellMatches(p, key, card) { return cellFace(p.cells[key]) === card.face; }

function startParadigm(id) {
  const p = paradigmById(id);
  if (!p) { goGrammar(); return; }
  const keys = paradigmCellKeys(p);
  state.grammar = {
    id: p.id,
    paradigm: p,
    keys,
    cards: shuffle(keys.map((k, i) => ({ cid: 'c' + i, key: k, face: cellFace(p.cells[k]) }))),
    placed: {},          /* cellKey -> the card that landed there */
    misses: 0,
    done: false,
    startedAt: Date.now()
  };
  state.screen = 'grammarDrill';
  render();
}

function replayParadigm() { if (state.grammar) startParadigm(state.grammar.id); }

function finishParadigm() {
  const g = state.grammar;
  const s = grammarStat(g.id);
  state.grammarStats[g.id] = {
    attempts: s.attempts + 1,
    cleanRuns: s.cleanRuns + (g.misses === 0 ? 1 : 0),
    quizAttempts: s.quizAttempts,
    quizCorrect: s.quizCorrect
  };
  saveGrammarStats();
  bumpStreak();
  /* a cell placed first time is the grammar equivalent of a right answer;
     every misplacement costs one, and a bad run floors at nothing right */
  recordSession({
    mode: 'sort',
    scope: { by: 'paradigm', id: g.id },
    asked: g.keys.length,
    right: Math.max(0, g.keys.length - g.misses),
    ms: Date.now() - g.startedAt
  });
  g.done = true;
  render();
}

function goGrammar() { state.screen = 'grammar'; state.grammar = null; render(); }
/* a drill exits to the list it was started from, not to the hub */
function goGrammarList() { state.screen = 'grammarList'; state.grammar = null; render(); }
function goGrammarReference() { state.screen = 'grammarRef'; render(); }

/* ---------- the sort grid ----------
   Generic: it knows nothing about cases, tenses or genders, only about the
   three fields every paradigm carries. */
function grammarGridHtml(g) {
  const p = g.paradigm;
  const cols = p.colLabels.length;
  const cells = p.rowLabels.map(row => `
      <div class="pg-rowhead">${escapeHtml(row)}</div>
      ${p.colLabels.map(col => {
        const key = row + '|' + col;
        if (!p.cells[key]) return `<div class="pg-cell" aria-hidden="true"></div>`;
        const placed = g.placed[key];
        return `<div class="pg-cell ${placed ? 'is-filled' : ''}" data-cell="${escapeHtml(key)}"
              role="button" tabindex="0" aria-label="${escapeHtml(row)} ${escapeHtml(col)}">
            ${placed ? grammarCellFilledHtml(p.cells[key]) : ''}
          </div>`;
      }).join('')}
    `).join('');
  return `
    <div class="pg-scroll">
      <div class="pg-grid" style="grid-template-columns: auto repeat(${cols}, minmax(92px, 1fr))">
        <div class="pg-corner"></div>
        ${p.colLabels.map(c => `<div class="pg-colhead">${escapeHtml(c)}</div>`).join('')}
        ${cells}
      </div>
    </div>
  `;
}

/* the gloss only appears once the cell is right, and only where the data has
   one -- the didomi grids, the subjunctives and the pronoun tables have none */
function grammarCellFilledHtml(cell) {
  return `<span class="pg-form">${escapeHtml(cellFace(cell))}</span>` +
    (cell.gloss ? `<span class="pg-gloss">${escapeHtml(cell.gloss)}</span>` : '');
}

function renderGrammarDrill() {
  const g = state.grammar;
  if (!g) { goGrammar(); return; }
  if (g.done) { renderGrammarDone(); return; }
  const p = g.paradigm;
  const total = g.keys.length;
  const placed = Object.keys(g.placed).length;
  const pct = total ? Math.round((placed / total) * 100) : 0;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Grammar', true)}

      <div class="pg-drill-head">
        <div class="pg-drill-title">${escapeHtml(p.label)}</div>
        <div class="pg-drill-example">${escapeHtml(p.example)}</div>
      </div>

      <div class="progress-row">
        <span>${placed} of ${total} placed</span>
        <span>${g.misses} wrong drop${g.misses === 1 ? '' : 's'}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="pg-fill" style="width:${pct}%"></div></div>

      ${grammarGridHtml(g)}

      <div class="pg-stack-label">
        <span class="kicker">FORMS</span>
        <span class="pg-stack-count" id="pg-remaining">${g.cards.length} left</span>
      </div>
      <div class="pg-stack" id="pg-stack">
        ${g.cards.map(c => `<button class="pg-card" data-cid="${c.cid}">${escapeHtml(c.face)}</button>`).join('')}
      </div>

      <p class="pg-hint text-muted">Drag a form into its cell — or tap the form, then tap the cell.${p.colLabels.length > 3 ? ' This table is wider than the screen: it scrolls sideways with the row labels pinned, and tapping is easier than dragging across it.' : ''}</p>
    </div>
  `;

  wireSortGrid();
  document.getElementById('btn-exit-quiz').addEventListener('click', goGrammarList);
}

/* ---------- input ----------
   Pointer events rather than HTML5 drag-and-drop, which does not exist on
   touch. A press that travels becomes a drag with a ghost following the
   finger; a press that stays put selects the card, and the next tap on a cell
   plays it -- the same two-tap route a keyboard or a shaky hand can use. */
function wireSortGrid() {
  const stack = document.getElementById('pg-stack');
  if (!stack) return;
  let drag = null;
  let selected = null;

  const cellAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const cell = el && el.closest ? el.closest('.pg-cell[data-cell]') : null;
    return cell && !cell.classList.contains('is-filled') ? cell : null;
  };
  const clearOver = () => document.querySelectorAll('.pg-cell.is-over').forEach(c => c.classList.remove('is-over'));
  const clearSelection = () => {
    selected = null;
    document.querySelectorAll('.pg-card.is-selected').forEach(c => c.classList.remove('is-selected'));
  };

  stack.addEventListener('pointerdown', e => {
    const card = e.target.closest('.pg-card');
    if (!card) return;
    e.preventDefault();
    drag = { card, cid: card.dataset.cid, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
  });

  stack.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 6) return;
    if (!drag.moved) {
      drag.moved = true;
      clearSelection();
      const r = drag.card.getBoundingClientRect();
      const ghost = drag.card.cloneNode(true);
      ghost.classList.add('pg-ghost');
      ghost.style.width = r.width + 'px';
      ghost.style.height = r.height + 'px';
      drag.ox = e.clientX - r.left;
      drag.oy = e.clientY - r.top;
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.card.classList.add('is-lifted');
    }
    drag.ghost.style.left = (e.clientX - drag.ox) + 'px';
    drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
    edgeScroll(e.clientX, e.clientY);
    clearOver();
    const cell = cellAt(e.clientX, e.clientY);
    if (cell) cell.classList.add('is-over');
  });

  const endDrag = e => {
    if (!drag) return;
    const d = drag;
    drag = null;
    clearOver();
    if (d.ghost) d.ghost.remove();
    d.card.classList.remove('is-lifted');
    if (!d.moved) {
      /* a tap: arm this card for the next cell tap */
      const wasSelected = d.card.classList.contains('is-selected');
      clearSelection();
      if (!wasSelected) { d.card.classList.add('is-selected'); selected = d.cid; }
      return;
    }
    const cell = cellAt(e.clientX, e.clientY);
    if (cell) dropCard(d.cid, cell.dataset.cell);
    else bounceCard(d.cid);
  };
  stack.addEventListener('pointerup', endDrag);
  stack.addEventListener('pointercancel', () => {
    if (!drag) return;
    if (drag.ghost) drag.ghost.remove();
    drag.card.classList.remove('is-lifted');
    drag = null;
    clearOver();
  });

  /* a keyboard press on a card never raises pointerdown, so arm it here
     instead -- detail 0 is the tell for a click that came from a key */
  stack.addEventListener('click', e => {
    const card = e.target.closest('.pg-card');
    if (!card || e.detail !== 0) return;
    const wasSelected = card.classList.contains('is-selected');
    clearSelection();
    if (!wasSelected) { card.classList.add('is-selected'); selected = card.dataset.cid; }
  });

  document.querySelectorAll('.pg-cell[data-cell]').forEach(cell => {
    cell.addEventListener('click', () => {
      if (!selected) return;
      const cid = selected;
      clearSelection();
      dropCard(cid, cell.dataset.cell);
    });
    cell.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cell.click(); }
    });
  });
}

/* a card held against an edge pulls the page, or a wide grid, towards the
   cell it is heading for -- without it a 6-column participle table cannot be
   crossed in one drag on a phone */
function edgeScroll(x, y) {
  const STEP = 14;
  if (y < 90) window.scrollBy(0, -STEP);
  else if (y > window.innerHeight - 110) window.scrollBy(0, STEP);
  const scroller = document.querySelector('.pg-scroll');
  if (!scroller) return;
  const r = scroller.getBoundingClientRect();
  if (y < r.top - 40 || y > r.bottom + 40) return;
  if (x < r.left + 44) scroller.scrollLeft -= STEP;
  else if (x > r.right - 44) scroller.scrollLeft += STEP;
}

function cardEl(cid) { return document.querySelector(`.pg-card[data-cid="${cid}"]`); }

function bounceCard(cid) {
  const el = cardEl(cid);
  if (!el) return;
  el.classList.remove('is-bounced');
  void el.offsetWidth;          /* restart the animation on a repeat miss */
  el.classList.add('is-bounced');
}

/* the whole of the marking: right cards lock in, wrong ones go home again.
   Nothing here re-renders the screen -- that would cut the animations off --
   so the grid, the counters and the stack are patched in place. */
function dropCard(cid, cellKey) {
  const g = state.grammar;
  if (!g || g.done) return;
  const card = g.cards.find(c => c.cid === cid);
  const cellEl = document.querySelector(`.pg-cell[data-cell="${cellKey}"]`);
  if (!card || !cellEl || g.placed[cellKey]) { bounceCard(cid); return; }

  if (!cellMatches(g.paradigm, cellKey, card)) {
    g.misses++;
    cellEl.classList.remove('is-miss');
    void cellEl.offsetWidth;
    cellEl.classList.add('is-miss');
    setTimeout(() => cellEl.classList.remove('is-miss'), 420);
    bounceCard(cid);
    paintGrammarCounts();
    return;
  }

  g.placed[cellKey] = card;
  g.cards = g.cards.filter(c => c.cid !== cid);
  const el = cardEl(cid);
  if (el) el.remove();
  cellEl.classList.add('is-filled');
  cellEl.innerHTML = grammarCellFilledHtml(g.paradigm.cells[cellKey]);
  paintGrammarCounts();
  if (g.cards.length === 0) setTimeout(finishParadigm, 380);
}

function paintGrammarCounts() {
  const g = state.grammar;
  const placed = Object.keys(g.placed).length;
  const rows = document.querySelectorAll('.progress-row span');
  if (rows[0]) rows[0].textContent = `${placed} of ${g.keys.length} placed`;
  if (rows[1]) rows[1].textContent = `${g.misses} wrong drop${g.misses === 1 ? '' : 's'}`;
  const fill = document.getElementById('pg-fill');
  if (fill) fill.style.width = (g.keys.length ? Math.round((placed / g.keys.length) * 100) : 0) + '%';
  const left = document.getElementById('pg-remaining');
  if (left) left.textContent = `${g.cards.length} left`;
}

function renderGrammarDone() {
  const g = state.grammar;
  const s = grammarStat(g.id);
  const clean = g.misses === 0;
  const badge = clean
    ? (s.cleanRuns === 1 ? 'Your first clean run' : `${s.cleanRuns} clean runs`)
    : `${g.misses} wrong drop${g.misses === 1 ? '' : 's'} — ${s.cleanRuns} clean run${s.cleanRuns === 1 ? '' : 's'} so far`;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Grammar', true)}

      <div class="ring-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">${clean ? 'CLEAN RUN' : 'TABLE COMPLETE'}</div>
          <div class="mem-done-time">${g.keys.length}<span style="font-size:20px"> cells</span></div>
          <div class="ring-label text-muted">${escapeHtml(g.paradigm.label)} · ${escapeHtml(g.paradigm.example)}</div>
          <div class="mem-done-badge">${escapeHtml(badge)}</div>
        </div>
      </div>

      <div class="card-actions">
        <button class="ghost-btn" id="btn-pg-home">Back to the list</button>
        <button class="start-btn" id="btn-pg-again">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>Practise again</span>
        </button>
      </div>
    </div>
  `;

  document.getElementById('btn-pg-home').addEventListener('click', goGrammarList);
  document.getElementById('btn-pg-again').addEventListener('click', replayParadigm);
  document.getElementById('btn-exit-quiz').addEventListener('click', goGrammarList);
}

/* ---------- the picker ----------
   Grouped the way the appendix is, with everything past this term's cutoff
   kept in the list but pushed below the in-scope tables and tagged, so it can
   be read without reading as homework. */
/* one row, two jobs: in Sort the Table it launches that paradigm, in Form
   Quiz it ticks it for the selection. Same line, so the list reads the same
   either way. */
function paradigmRowHtml(p) {
  const s = grammarStat(p.id);
  const future = !paradigmInScope(p);
  const quizMode = state.grammarMode === 'quiz';
  const picked = state.grammarPick.has(p.id);
  const tag = s.cleanRuns > 0
    ? `<span class="pg-tag is-clean">${s.cleanRuns} clean</span>`
    : (s.attempts > 0 ? `<span class="pg-tag">${s.attempts} tried</span>` : '');
  const right = quizMode
    ? `<span class="pg-box ${picked ? 'is-on' : ''}">${picked ? tickIcon() : ''}</span>`
    : `${tag}<span class="pg-chevron"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1.5 1.5 6.5 6.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  return `
    <button class="pg-row ${future ? 'is-future' : ''} ${quizMode && picked ? 'is-picked' : ''}"
      data-paradigm="${p.id}" ${quizMode ? `aria-pressed="${picked}"` : ''}>
      <span class="pg-row-main">
        <span class="pg-row-label">${escapeHtml(p.label)}</span>
        <span class="pg-row-example">${escapeHtml(p.example)} · ${p.rowLabels.length * p.colLabels.length} ${quizMode ? 'questions' : 'cells'}</span>
      </span>
      <span class="pg-row-right">
        ${future ? '<span class="pg-tag">Not yet in class</span>' : ''}
        ${right}
      </span>
    </button>
  `;
}

/* in-scope first, and otherwise the order the appendix prints them in */
function sortedParadigms(list) {
  return list.slice().sort((a, b) => (paradigmInScope(b) ? 1 : 0) - (paradigmInScope(a) ? 1 : 0));
}

function grammarGroupsHtml() {
  return GRAMMAR_GROUPS.map(group => {
    const inGroup = PARADIGMS.filter(p => p.category === group.category);
    if (!inGroup.length) return '';
    let body;
    if (group.subs) {
      body = group.subs.map(sub => {
        const rows = sortedParadigms(inGroup.filter(p => p.subcategory === sub.key));
        if (!rows.length) return '';
        return `<div class="pg-sub">${escapeHtml(sub.label)}</div>
          <div class="pg-list">${rows.map(paradigmRowHtml).join('')}</div>`;
      }).join('');
    } else {
      body = `<div class="pg-list">${sortedParadigms(inGroup).map(paradigmRowHtml).join('')}</div>`;
    }
    return `<section class="pg-group"><span class="kicker">${escapeHtml(group.label.toUpperCase())}</span>${body}</section>`;
  }).join('');
}

/* one square per paradigm in course order, so the shape of the term is
   visible: what is done, what is started, and what the class has not reached */
function paradigmMapHtml() {
  const inScope = PARADIGMS.filter(paradigmInScope);
  const mastered = inScope.filter(p => grammarStat(p.id).cleanRuns > 0).length;
  const squares = PARADIGMS.map(p => {
    const st = grammarStat(p.id);
    let cls = 'is-future';
    if (paradigmInScope(p)) {
      cls = st.cleanRuns > 0 ? 'is-mastered'
        : (st.attempts > 0 || st.quizAttempts > 0 ? 'is-started' : '');
    }
    return `<span class="pg-square ${cls}" title="${escapeHtml(p.label)}"></span>`;
  }).join('');
  return `
    <div class="pg-map">
      <div class="pg-map-head">
        <span class="pg-map-title">In class so far</span>
        <span class="pg-map-count">${mastered} of ${inScope.length}</span>
      </div>
      <div class="pg-map-grid">${squares}</div>
      <div class="pg-legend">

}

function grammarQuizTotals() {
  const asked = PARADIGMS.reduce((n, p) => n + grammarStat(p.id).quizAttempts, 0);
  const right = PARADIGMS.reduce((n, p) => n + grammarStat(p.id).quizCorrect, 0);
  return { asked, right, pct: asked ? Math.round((right / asked) * 100) : 0 };
}

/* the second level: the forty paradigms, for whichever drill was chosen */
function renderGrammarList() {

  const body = ref.rowsAreVoice.map(v => `

/* ---------- grammar: Form Quiz ----------
   The other half of the module. Sort the Table asks you to recognise a form
   and place it; this asks you to produce one from its address -- "What is the
   GEN Plural of φωνή?" -- which is the direction an exam asks in.

   It is the vocabulary Multiple Choice interaction, not a second one: the same
   option markup (mcOptionsHtml), the same lock-in on tap, the same pause
   before the next question. Distractors are drawn only from the paradigm the
   question came from, so every wrong answer is a form the student has to tell
   apart from the right one -- a second-declension ending offered against a
   first-declension question would be free marks. */

/* the lemma to ask about: the example line without its English gloss and
   without the article or the "(subj.)"-style descriptor that follows it --
   "φωνή, ἡ (voice)" asks about φωνή, "δίδωμι non-indicative" about δίδωμι.
   Greek text is left alone, so "τίς / τις" survives whole. */
function paradigmLemma(p) {
  let s = p.example.replace(/\s*\([^)]*\)\s*/g, ' ').trim();
  s = s.split(',')[0].trim();
  while (/\s+[A-Za-z][A-Za-z-]*$/.test(s)) s = s.replace(/\s+[A-Za-z][A-Za-z-]*$/, '');
  return s.trim();
}

/* every cell of a paradigm is one question. Options are deduplicated by their
   final text before sampling: several tables repeat a form across cells (the
   neuter nominative and accusative, τούτου in two genders), and two options
   reading the same would make the question unanswerable. */
function questionsForParadigm(p) {
  const lemma = paradigmLemma(p);
  return paradigmCellKeys(p).map(key => {
    const [row, col] = key.split('|');
    const correct = cellFace(p.cells[key]);
    const pool = [];
    paradigmCellKeys(p).forEach(k => {
      const face = cellFace(p.cells[k]);
      if (face !== correct && pool.indexOf(face) === -1) pool.push(face);
    });
    /* fewer than three left is normal on the four-cell imperative tables --
       the question simply has fewer options rather than borrowing from
       another paradigm */
    const options = shuffle(pool).slice(0, 3).concat([correct]);
    return {
      pid: p.id,
      label: p.label,
      prompt: `What is the ${row} ${col} of ${lemma}?`,
      correct,
      options: shuffle(options)
    };
  });
}

function buildGrammarQuiz(ids) {
  const questions = [];
  ids.forEach(id => {
    const p = paradigmById(id);
    if (p) questions.push(...questionsForParadigm(p));
  });
  return shuffle(questions);
}

function startGrammarQuiz() {
  const ids = PARADIGMS.filter(p => state.grammarPick.has(p.id)).map(p => p.id);
  if (!ids.length) return;
  const questions = buildGrammarQuiz(ids);
  if (!questions.length) return;
  state.grammarQuiz = { ids, questions, index: 0, score: 0, answered: false, selectedOpt: null, done: false, startedAt: Date.now() };
  state.screen = 'grammarQuiz';
  render();
}

function retryGrammarQuiz() {
  const ids = state.grammarQuiz ? state.grammarQuiz.ids : [];
  state.grammarQuiz = { ids, questions: buildGrammarQuiz(ids), index: 0, score: 0, answered: false, selectedOpt: null, done: false, startedAt: Date.now() };
  render();
}

function exitGrammarQuiz() { state.grammarQuiz = null; goGrammarList(); }

/* recorded as the question is answered rather than at the end, so a session
   stopped halfway still counts for what was actually done */
function recordQuizAnswer(pid, correct) {
  const s = grammarStat(pid);
  state.grammarStats[pid] = {
    attempts: s.attempts,
    cleanRuns: s.cleanRuns,
    quizAttempts: s.quizAttempts + 1,
    quizCorrect: s.quizCorrect + (correct ? 1 : 0)
  };
  saveGrammarStats();
}

function selectGrammarOption(opt) {
  const q = state.grammarQuiz;
  if (!q || q.answered) return;
  const current = q.questions[q.index];
  const correct = opt === current.correct;
  q.answered = true;
  q.selectedOpt = opt;
  if (correct) q.score += 1;
  recordQuizAnswer(current.pid, correct);
  render();
  setTimeout(() => {
    if (state.grammarQuiz !== q) return;
    if (q.index < q.questions.length - 1) {
      q.index += 1;
      q.answered = false;
      q.selectedOpt = null;
    } else {
      q.done = true;
      bumpStreak();
      recordSession({
        mode: 'gquiz',
        scope: { by: 'paradigm', ids: [...q.ids] },
        asked: q.questions.length,
        right: q.score,
        ms: Date.now() - q.startedAt
      });
    }
    render();
  }, correct ? 650 : 1500);
}

function renderGrammarQuiz() {
  const q = state.grammarQuiz;
  if (!q) { goGrammar(); return; }
  if (q.done) { renderGrammarQuizDone(); return; }
  const total = q.questions.length;
  const current = q.questions[q.index];
  const pct = Math.round((q.index / total) * 100);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Form Quiz', true)}

      <div class="progress-row">
        <span>Question ${q.index + 1} of ${total}</span>
        <span>Score ${q.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="quiz-body is-mc">
        <div class="prompt-panel glass">
          ${glassLayer()}
          <div class="glass-content">
            <div class="kicker">GIVE THE FORM</div>
            <div class="prompt-word is-english pg-quiz-prompt" style="margin-top:12px">${escapeHtml(current.prompt)}</div>
            <div class="prompt-meta">${escapeHtml(current.label)}</div>
          </div>
        </div>

        <div>${mcOptionsHtml(current.options, q.answered, current.correct, q.selectedOpt)}</div>
      </div>
    </div>
  `;

  if (!q.answered) {
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => selectGrammarOption(btn.dataset.opt));
    });
  }
  document.getElementById('btn-exit-quiz').addEventListener('click', exitGrammarQuiz);
}

/* the same shape Sort the Table finishes on, so the two modes end alike */
function renderGrammarQuizDone() {
  const q = state.grammarQuiz;
  const total = q.questions.length;
  const pct = total ? Math.round((q.score / total) * 100) : 0;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Form Quiz', true)}

      <div class="ring-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="kicker">FORM QUIZ COMPLETE</div>
          ${ringSvg(pct)}
          <div class="ring-label text-muted">${q.score} of ${total} correct · ${q.ids.length} paradigm${q.ids.length === 1 ? '' : 's'}</div>
          <div class="ring-caption text-muted">${scoreMessage(pct, total)}</div>
        </div>
      </div>

      <div class="card-actions">
        <button class="ghost-btn" id="btn-gq-home">Back to the list</button>
        <button class="start-btn" id="btn-gq-again">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>Retry same selection</span>
        </button>
      </div>
    </div>
  `;

  document.getElementById('btn-gq-home').addEventListener('click', exitGrammarQuiz);
  document.getElementById('btn-gq-again').addEventListener('click', retryGrammarQuiz);
  document.getElementById('btn-exit-quiz').addEventListener('click', exitGrammarQuiz);
}

/* ---------- picker: choosing what the quiz covers ---------- */
function goGrammarMode(mode) {
  state.grammarMode = mode;
  state.screen = 'grammarList';
  render();
}

function toggleGrammarPick(id) {
  if (state.grammarPick.has(id)) state.grammarPick.delete(id);
  else state.grammarPick.add(id);
  render();
}

/* the default offer: this term's material, and only this term's -- the
   future-term tables stay unchecked unless they are asked for by hand */
function pickTermParadigms() {
  state.grammarPick = new Set(PARADIGMS.filter(paradigmInScope).map(p => p.id));
  render();
}

function clearGrammarPick() { state.grammarPick = new Set(); render(); }

function grammarPickQuestionCount() {
  return PARADIGMS.reduce((n, p) => n + (state.grammarPick.has(p.id) ? paradigmCellKeys(p).length : 0), 0);
}

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'flashcard') renderQuizTab();
  else if (state.screen === 'cards') renderCards();
  else if (state.screen === 'memory') renderMemory();
  else if (state.screen === 'review') renderDailyReview();
  else if (state.screen === 'grammar') renderGrammarPicker();
  else if (state.screen === 'grammarList') renderGrammarList();
  else if (state.screen === 'grammarDrill') renderGrammarDrill();
  else if (state.screen === 'grammarRef') renderGrammarReference();
  else if (state.screen === 'grammarQuiz') renderGrammarQuiz();
  else if (state.screen === 'progress') renderProgress();
  renderTabBar();
  if (state.onboarding.active) renderOnboarding();
}

/* ---------- keyboard: desktop only ----------
   Every handler is gated on the desktop breakpoint, so the touch tiers behave
   exactly as they did. Typing into a field swallows everything but Escape --
   Type Answer's own Enter is wired to the input itself and is left alone. */
const desktopQuery = window.matchMedia('(min-width: 1180px)');
function isDesktop() { return desktopQuery.matches; }

/* which board tile the focus ring is on. UI-only, so it stays out of `state`. */
let memoryFocus = 0;

function paintMemoryFocus() {
  const tiles = [...document.querySelectorAll('.mem-tile')];
  if (!tiles.length) return;
  memoryFocus = Math.max(0, Math.min(memoryFocus, tiles.length - 1));
  tiles.forEach((el, i) => el.classList.toggle('is-focused', isDesktop() && i === memoryFocus));
}

function moveMemoryFocus(delta) {
  const tiles = document.querySelectorAll('.mem-tile');
  if (!tiles.length) return;
  memoryFocus = Math.max(0, Math.min(memoryFocus + delta, tiles.length - 1));
  paintMemoryFocus();
}

/* what is actually in front of the student -- the Review tab resolves to
   whichever session is open, so the screen name alone is not enough */
function activeScreenKind() {
  if (state.screen === 'setup') return 'setup';
  if (state.screen === 'memory') return state.memory && state.memory.finishedMs !== null ? 'memory-done' : 'memory';
  if (state.screen === 'review') return state.review && !state.review.done ? 'review' : 'review-done';
  if (state.screen === 'grammarDrill') return state.grammar && state.grammar.done ? 'grammar-done' : 'grammar-drill';
  if (state.screen === 'grammarRef') return 'grammar-ref';
  if (state.screen === 'grammarList') return 'grammar-list';
  if (state.screen === 'grammarQuiz') return state.grammarQuiz && state.grammarQuiz.done ? 'grammar-quiz-done' : 'grammar-quiz';
  if (state.screen === 'cards') return cardsInProgress() ? 'cards' : null;
  if (state.screen === 'flashcard') {
    if (typedSummaryUp()) return 'typed-done';
    if (quizInProgress()) return state.quiz.settings.mode === 'mc' ? 'mc' : 'typed';
    if (cardsInProgress()) return 'cards';
  }
  return null;
}

/* Escape raises exactly what the close button raises, confirm included */
function escapeAction(kind) {
  if (kind === 'setup') return goHome;
  if (kind === 'memory' || kind === 'memory-done') return exitMemory;
  if (kind === 'review' || kind === 'review-done') return exitReview;
  if (kind === 'grammar-list' || kind === 'grammar-ref') return goGrammar;
  if (kind === 'grammar-drill' || kind === 'grammar-done') return goGrammarList;
  if (kind === 'grammar-quiz' || kind === 'grammar-quiz-done') return exitGrammarQuiz;
  if (kind === 'cards') return exitCards;
  if (kind === 'mc' || kind === 'typed') return exitQuiz;
  if (kind === 'typed-done') return closeTypedSummary;
  return null;
}

function clickNth(selector, n) {
  const els = document.querySelectorAll(selector);
  if (els[n]) els[n].click();
}

function handleShortcut(e) {
  if (state.onboarding.active) return;   /* the walkthrough binds its own arrow keys */
  if (!isDesktop()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const kind = activeScreenKind();
  if (!kind) return;

  if (e.key === 'Escape') {
    const exit = escapeAction(kind);
    if (exit) { e.preventDefault(); exit(); }
    return;
  }

  /* past here, a focused field owns the keyboard */
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;

  const digit = /^[1-9]$/.test(e.key) ? Number(e.key) : 0;

  if (kind === 'mc' || kind === 'grammar-quiz') {
    if (digit >= 1 && digit <= 4) { e.preventDefault(); clickNth('.option-btn', digit - 1); }
    return;
  }

  if (kind === 'cards') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      const card = document.getElementById('flip-card');
      if (card) card.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (state.cards && state.cards.index > 0) prevCard();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      nextCard();
    }
    return;
  }

  if (kind === 'review') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (!state.review.revealed) {
        const card = document.getElementById('review-card');
        if (card) card.click();
      }
    } else if (digit >= 1 && digit <= 4 && state.review.revealed) {
      e.preventDefault();
      clickNth('#rate-row .rate-btn', digit - 1);
    }
    return;
  }

  if (kind === 'memory') {
    const tiles = document.querySelectorAll('.mem-tile');
    if (!tiles.length) return;
    const cols = 5;   /* the desktop board is 5 x 2, and this only runs there */
    if (e.key === 'ArrowLeft') { e.preventDefault(); moveMemoryFocus(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveMemoryFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveMemoryFocus(-cols); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveMemoryFocus(cols); }
    else if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      const tile = tiles[memoryFocus];
      if (tile) flipMemoryTile(tile.dataset.tile);
    }
    return;
  }

  if (kind === 'memory-done') {
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); memoryFocus = 0; replayMemory(); }
    return;
  }

  if (kind === 'setup') {
    if (e.key === 'Enter') {
      e.preventDefault();
      const next = document.getElementById('btn-step-next') || document.getElementById('btn-launch');
      if (next) { if (!next.disabled) next.click(); }
      else setupNext();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setupBack();
    } else if (digit >= 1 && digit <= 4) {
      /* the format, direction and word-count steps only -- step 1 is a grid */
      const step = state.setup.step;
      const sel = step === 2 ? '[data-mode]' : step === 3 ? '[data-dir]' : step === 4 ? '[data-count]' : null;
      if (sel) { e.preventDefault(); clickNth(sel, digit - 1); }
    }
  }
}

document.addEventListener('keydown', handleShortcut);
/* crossing the breakpoint with a board open clears or restores the ring */
desktopQuery.addEventListener('change', () => { if (state.screen === 'memory') paintMemoryFocus(); });

document.getElementById('tab-home').addEventListener('click', goHome);
document.getElementById('tab-review').addEventListener('click', goQuizTab);
document.getElementById('tab-progress').addEventListener('click', goProgress);

(async function init() {
  await loadData();
  render();
})();
</script>
