    .hub-title { font-size: 20px; }
    .hub-sub { font-size: 13px; }
    .pg-cell { min-height: 76px; min-width: 124px; }
    .pg-quiz-bar { bottom: 18px; }
    .pg-quiz-prompt { font-size: 36px; }
    /* one column, as Type Answer has: the eye runs form -> rows -> Check */
    .parse-body { max-width: 820px; margin: 0 auto; }
  }

  /* Every square grid in the app is a map, so the squares keep their size as
     the column widens rather than growing into tiles. These sit at the end
     because the layout breakpoints near the top of this sheet are declared
     before the components they would otherwise override. */
  @media (min-width: 768px) {
    /* the squares grow to a comfortable tap size and then stop: past about
       32px the collection stops reading as one thing */
    .coll-wrap, .coll-detail, .coll-legend { max-width: 560px; }
    .coll-squares { gap: 5px; }
    .coll-row { gap: 10px; }
    .coll-ch { flex-basis: 22px; font-size: 11px; }
    .coll-greek { font-size: 24px; }
    .pg-map-grid, .group-grid { grid-template-columns: repeat(10, 34px); justify-content: start; gap: 7px; }
    .prog-chapter-grid { grid-template-columns: repeat(8, 52px); justify-content: start; gap: 8px; }
    .day-squares { grid-template-columns: repeat(7, 18px); }
  }

  @media (min-width: 1180px) {
    .pg-map-grid, .group-grid { grid-template-columns: repeat(10, 40px); gap: 8px; }
    .prog-chapter-grid { grid-template-columns: repeat(8, 48px); }
    .day-squares { grid-template-columns: repeat(7, 20px); }
  }
</style>

</div>

/* ---------- storage: works inside Claude artifacts (window.storage) and on any
   normal web host / home-screen app (falls back to localStorage) ---------- */
const storageAdapter = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
    } catch (e) { /* key may not exist yet */ }
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(key, value, false);
        return;
      }
    } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(key, value); } catch (e) { /* non-fatal */ }
  }
};

/* Everything else interpolated into a renderer is vocabulary data we ship.
   What the student types is not, and the summary prints it back. */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function loadData() {
  const rawStats = await storageAdapter.get(STATS_KEY);
  try { state.stats = rawStats ? JSON.parse(rawStats) : {}; } catch (e) { state.stats = {}; }
  const rawGrammar = await storageAdapter.get(GRAMMAR_STATS_KEY);
  try { state.grammarStats = rawGrammar ? JSON.parse(rawGrammar) : {}; } catch (e) { state.grammarStats = {}; }
  const rawParse = await storageAdapter.get(PARSE_STATS_KEY);
  try { state.parseStats = rawParse ? JSON.parse(rawParse) : {}; } catch (e) { state.parseStats = {}; }
  if (!state.parseStats || typeof state.parseStats !== 'object') state.parseStats = {};
  const rawStreak = await storageAdapter.get(STREAK_KEY);
  try { state.streak = rawStreak ? JSON.parse(rawStreak) : { count: 0, lastDate: null }; } catch (e) { state.streak = { count: 0, lastDate: null }; }
  const rawDays = await storageAdapter.get(DAYS_KEY);
  try { state.days = rawDays ? JSON.parse(rawDays) : []; } catch (e) { state.days = []; }
  if (!Array.isArray(state.days)) state.days = [];
  const rawSessions = await storageAdapter.get(SESSIONS_KEY);
  try { state.sessions = rawSessions ? JSON.parse(rawSessions) : []; } catch (e) { state.sessions = []; }
  if (!Array.isArray(state.sessions)) state.sessions = [];
  if (rawDays === null || rawDays === undefined) seedDaysFromStreak();

  const rawDone = await storageAdapter.get(CHAPTERS_DONE_KEY);
  try { state.chaptersDone = rawDone ? JSON.parse(rawDone) : []; } catch (e) { state.chaptersDone = []; }
  if (!Array.isArray(state.chaptersDone)) state.chaptersDone = [];
  /* A student who already had chapters finished before this shipped should not
     be shown a queue of celebrations for work done weeks ago: on the first load
     they are marked as already celebrated, and only what is finished from here
     is announced. */
  if (rawDone === null || rawDone === undefined) {
    state.chaptersDone = CHAPTERS.filter(chapterComplete);
    saveChaptersDone();
  }

  const rawBest = await storageAdapter.get(MEMORY_BEST_KEY);
  const best = rawBest === null || rawBest === undefined ? NaN : Number(rawBest);
  state.memoryBest = Number.isFinite(best) && best > 0 ? best : null;

  const rawCards = await storageAdapter.get(FSRS_CARDS_KEY);
  try { state.fsrs.cards = rawCards ? JSON.parse(rawCards) : {}; } catch (e) { state.fsrs.cards = {}; }
  const rawLog = await storageAdapter.get(FSRS_LOG_KEY);
  try { state.fsrs.log = rawLog ? JSON.parse(rawLog) : []; } catch (e) { state.fsrs.log = []; }
  if (!Array.isArray(state.fsrs.log)) state.fsrs.log = [];
  const rawIntro = await storageAdapter.get(FSRS_INTRO_KEY);
  try { state.fsrs.intro = rawIntro ? JSON.parse(rawIntro) : { date: null, count: 0 }; } catch (e) { state.fsrs.intro = { date: null, count: 0 }; }

  /* the walkthrough runs on the first launch only -- any stored flag, however
     it was written, counts as seen */
  const rawOnboarding = await storageAdapter.get(ONBOARDING_KEY);
  state.onboarding.active = !rawOnboarding;
}

function saveStats() { storageAdapter.set(STATS_KEY, JSON.stringify(state.stats)); }
function saveStreak() { storageAdapter.set(STREAK_KEY, JSON.stringify(state.streak)); }
function saveMemoryBest() { storageAdapter.set(MEMORY_BEST_KEY, String(state.memoryBest)); }
function saveDays() { storageAdapter.set(DAYS_KEY, JSON.stringify(state.days)); }
function saveChaptersDone() { storageAdapter.set(CHAPTERS_DONE_KEY, JSON.stringify(state.chaptersDone)); }
function saveSessions() { storageAdapter.set(SESSIONS_KEY, JSON.stringify(state.sessions)); }

/* how far back the two logs are kept. Both are read whole on every load, so
   they are bounded rather than left to grow for the life of the install. */
const DAYS_LIMIT = 400;
const SESSIONS_LIMIT = 500;

function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* n days before today, as a date string. Built by shifting a real Date rather
   than by arithmetic on the string, so it crosses months and the clock change
   correctly. */
function daysAgoStr(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return dateStr(d);
}

function yesterdayStr() { return daysAgoStr(1); }

/* the Monday-starting week a date falls in, named by that Monday. The rest day
   below is one per week, and this is what "per week" means. */
function weekKey(str) {
  const [y, m, d] = str.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const shift = (dt.getDay() + 6) % 7;   /* Sunday is 0 in JS, and is the last day here */
  dt.setDate(dt.getDate() - shift);
  return dateStr(dt);
}

function studiedOn(str) { return state.days.indexOf(str) !== -1; }

/* Every completion point already calls bumpStreak, so the day log is written
   here rather than at each of them. */
function bumpStreak() {
  const today = todayStr();
  if (!studiedOn(today)) {
    state.days.push(today);
    state.days.sort();
    if (state.days.length > DAYS_LIMIT) state.days = state.days.slice(state.days.length - DAYS_LIMIT);
    saveDays();
  }
  if (state.streak.lastDate === today) return;
  state.streak.count = (state.streak.lastDate === yesterdayStr()) ? state.streak.count + 1 : 1;
  state.streak.lastDate = today;
  saveStreak();
}

/* A student who arrives with a streak but no day log had it counted the old
   way, one entry forward per day, which is exactly a run of consecutive days
   ending on lastDate -- so that is what is written back. Nothing else is
   reconstructed: fsrs.log covers Daily Review alone and would draw a calendar
   that says the other four modes never happened. */
function seedDaysFromStreak() {
  const { count, lastDate } = state.streak;
  if (!lastDate) return;
  const [y, m, d] = lastDate.split('-').map(Number);
  const out = [];
  for (let i = Math.max(1, Math.min(count || 1, DAYS_LIMIT)) - 1; i >= 0; i--) {
    const dt = new Date(y, m - 1, d - i);
    out.push(dateStr(dt));
  }
  state.days = out;
  saveDays();
}

/* ---------- the streak, with one rest day a week ----------
   A missed day does not end the run if that week has not already spent its
   rest day; the second miss in the same week does end it. The run is walked
   forward across the whole log, because the allowance is held per week and a
   long run passes through several. Today is never counted as a miss -- it is
   not over yet -- so it is handled after the walk. */
function walkStreak() {
  const today = todayStr();
  if (!state.days.length) return { days: 0, best: 0, rested: [] };
  let run = 0, best = 0, spent = {}, rested = [], runRested = [];
  /* a sparse log can reach back further than it has entries, so the walk
     starts at whichever is later: its first day, or the cap */
  const first = state.days[0] < daysAgoStr(DAYS_LIMIT) ? daysAgoStr(DAYS_LIMIT) : state.days[0];
  const [y, m, d] = first.split('-').map(Number);
  const cursor = new Date(y, m - 1, d);
  for (let i = 0; i <= DAYS_LIMIT; i++) {
    const str = dateStr(cursor);
    if (str >= today) break;
    if (studiedOn(str)) {
      run += 1;
      if (run > best) best = run;
    } else {
      const wk = weekKey(str);
      if (spent[wk]) { run = 0; spent = {}; runRested = []; }
      else { spent[wk] = true; runRested.push(str); }
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  /* the run is only alive if it reaches yesterday or today; a run that died
     weeks ago still has a length here, and should read as nothing */
  const aliveThrough = studiedOn(today) || studiedOn(yesterdayStr()) || runRested.indexOf(yesterdayStr()) !== -1;
  if (studiedOn(today)) {
    run += 1;
    if (run > best) best = run;
  }
  rested = aliveThrough ? runRested : [];
  return { days: aliveThrough ? run : 0, best, rested };
}

/* doneToday -- today is already counted, the run is safe
   !doneToday -- today is still owed */
function currentStreak() {
  const w = walkStreak();
  return { days: w.days, doneToday: studiedOn(todayStr()), rested: w.rested };
}

/* the longest run the log holds, computed on read rather than stored -- there
   is nowhere for a stored best to come from for a student who already has one */
function bestStreak() { return walkStreak().best; }

/* oldest first, for the calendar strips. `rested` marks a day the rest-day
   allowance absorbed, which is neither a study day nor a break in the run. */
function lastNDays(n) {
  const { rested } = walkStreak();
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const date = daysAgoStr(i);
    out.push({ date, studied: studiedOn(date), rested: rested.indexOf(date) !== -1 });
  }
  return out;
}

/* ---------- the session log ----------
   One record per finished session. `right` is null where the mode has no
   right or wrong to report, and `ms` is null where the mode is not timed. */
function scopeFromSelection(sel) {
  if (!sel) return null;
  if (sel.by === 'categories') return { by: 'categories', categories: [...sel.categories] };
  return { by: 'chapters', chapters: [...sel.chapters] };
}

function recordSession(rec) {
  state.sessions.push({
    at: new Date().toISOString(),
    mode: rec.mode,
    scope: rec.scope || null,
    asked: rec.asked,
    right: rec.right === undefined ? null : rec.right,
    learned: rec.learned || 0,
    ms: rec.ms === undefined ? null : rec.ms
  });
  if (state.sessions.length > SESSIONS_LIMIT) state.sessions = state.sessions.slice(state.sessions.length - SESSIONS_LIMIT);
  saveSessions();
}

/* both are read against the Monday-starting week the rest day uses, so the
   week means the same thing everywhere in the app */
function sessionsThisWeek() {
  const wk = weekKey(todayStr());
  return state.sessions.filter(r => weekKey(dateStr(new Date(r.at))) === wk).length;
}

function wordsLearnedThisWeek() {
  const wk = weekKey(todayStr());
  return state.sessions.reduce((n, r) => n + (weekKey(dateStr(new Date(r.at))) === wk ? (r.learned || 0) : 0), 0);
}

/* `streak` is the run of correct answers since the word was last missed. It is
   what clears a word from the review list, so a single lucky answer among many
   misses is not enough -- and one slip puts the word straight back. Stats saved
   before this existed simply have no streak yet, which reads as zero. */
function recordAttempt(chapter, greek, correct) {
  const k = wordKey(chapter, greek);
  if (!state.stats[k]) state.stats[k] = { seen: 0, correct: 0, streak: 0 };
  const s = state.stats[k];
  const was = s.streak || 0;
  s.seen += 1;
  if (correct) {
    s.correct += 1;
    s.streak = was + 1;
  } else {
    s.streak = 0;
  }
  saveStats();
  /* true only on the answer that retires the word, so a session can count
     what it taught rather than what it merely asked again */
  return was < REVIEW_CLEAR_STREAK && s.streak >= REVIEW_CLEAR_STREAK;
}

/* how many correct answers in a row retire a word from "words to review" */
const REVIEW_CLEAR_STREAK = 3;

function reviewStreak(chapter, greek) {
  const s = state.stats[wordKey(chapter, greek)];
  return s && s.streak ? s.streak : 0;
}

/* ---------- spaced repetition (FSRS-6, via the vendored ts-fsrs) ----------
   The four existing study modes are self-contained sessions and deliberately
   stay that way: they do not feed the scheduler. Daily Review is the only
   place an FSRS card is created or graded.

   Scheduling is entirely the library's -- we persist the card it hands back
   and hand it straight back on the next review. Nothing here reimplements
   FSRS, and the parameters are the library's own FSRS-6 defaults (all 21 of
   them), untrained. Personalised parameters only start to pay off after a few
   hundred logged reviews, which is why the review log below is kept. */

const FSRS_CARDS_KEY = 'oikos-fsrs-cards';
const FSRS_LOG_KEY = 'oikos-fsrs-log';
const FSRS_INTRO_KEY = 'oikos-fsrs-intro';

/* how many never-before-seen words may enter the queue in a single day.
   Standard SRS practice: without a cap the whole deck front-loads on day one
   and the reviews all come due together a few days later. */
const NEW_CARDS_PER_DAY = 10;

/* the target probability of recall the scheduler aims for -- the library
   default, and the value Anki ships with */
const FSRS_DESIRED_RETENTION = 0.9;

const scheduler = FSRS.fsrs({ request_retention: FSRS_DESIRED_RETENTION });
/* The four FSRS grades, named as what they actually report -- how well the
   word came back -- rather than by the library's internal names. "Know it" in
   particular is not a longer version of "Good": rating a new word Easy skips
   the learning phase outright and schedules it more than a week away, so the
   button says so. The intervals underneath are the scheduler's own. */
const RATINGS = [
  { value: FSRS.Rating.Again, label: 'Forgot',  cls: 'rate-again' },
  { value: FSRS.Rating.Hard,  label: 'Hard',    cls: 'rate-hard' },
  { value: FSRS.Rating.Good,  label: 'Good',    cls: 'rate-good' },
  { value: FSRS.Rating.Easy,  label: 'Know it', cls: 'rate-easy' }
];
const FSRS_STATE_LABELS = ['New', 'Learning', 'Review', 'Relearning'];

/* cards are stored as plain JSON (dates as ISO strings) and revived through the
   library's own converter, so the shape always matches what ts-fsrs expects */
function reviveCard(raw) {
  try { return FSRS.TypeConvert.card(raw); } catch (e) { return null; }
}

function saveFsrsCards() { storageAdapter.set(FSRS_CARDS_KEY, JSON.stringify(state.fsrs.cards)); }
function saveFsrsLog() { storageAdapter.set(FSRS_LOG_KEY, JSON.stringify(state.fsrs.log)); }
function saveFsrsIntro() { storageAdapter.set(FSRS_INTRO_KEY, JSON.stringify(state.fsrs.intro)); }

/* a word has an FSRS card only once it has been rated in Daily Review at least
   once; everything else is State.New and lives only in the vocabulary */
function fsrsCard(key) {
  const raw = state.fsrs.cards[key];
  return raw ? reviveCard(raw) : null;
}

/* how many new words have already been introduced today (resets at midnight,
   local time -- the same day boundary the streak uses) */
function newIntroducedToday() {
  return state.fsrs.intro.date === todayStr() ? state.fsrs.intro.count : 0;
}

function noteNewCardIntroduced() {
  const today = todayStr();
  if (state.fsrs.intro.date !== today) state.fsrs.intro = { date: today, count: 0 };
  state.fsrs.intro.count += 1;
  saveFsrsIntro();
}

/* Eligibility: only chapters the student has already worked through at least
   once in an existing mode. This keeps Daily Review in step with where they
   actually are in the course rather than surfacing chapter 23 on day one. */
function engagedChapters() {
  return CHAPTERS.filter(ch => (VOCAB[ch] || []).some(w => {
    const s = state.stats[wordKey(ch, w.greek.trim())];
    return s && s.seen > 0;
  }));
}

function eligibleWords() {
  const out = [];
  engagedChapters().forEach(ch => (VOCAB[ch] || []).forEach(w => {
    out.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim(), cat: w.cat });
  }));
  return out;
}

/* Everything due right now, oldest-due first. Cards are only ever created by a
   review, so anything in the store has been seen at least once. */
function dueCards(now) {
  const rows = [];
  eligibleWords().forEach(w => {
    const key = wordKey(w.chapter, w.greek);
    const card = fsrsCard(key);
    if (card && card.due <= now) rows.push({ word: w, key, card });
  });
  rows.sort((a, b) => a.card.due - b.card.due);
  return rows;
}

/* The order never-seen words are introduced in.

   The Progress tab already surfaces "words to review" -- the ones an existing
   mode has caught the student out on -- and those are exactly the words worth
   handing to the scheduler first. So anything already answered wrong leads the
   queue, worst-remembered first, and everything else follows in course order.

   This only decides which words *enter* the scheduler and in what order. Once a
   word has a card, FSRS owns when it comes back; past accuracy from the other
   modes does not get to override the memory model. */
function missRank(w) {
  const s = state.stats[wordKey(w.chapter, w.greek)];
  if (!s || s.seen === 0) return { missed: false, accuracy: 1 };
  return { missed: s.correct < s.seen, accuracy: s.correct / s.seen };
}

function newCardOrder(words) {
  return words
    .map((w, i) => ({ w, i, ...missRank(w) }))
    .sort((a, b) =>
      (Number(b.missed) - Number(a.missed)) ||   // words already got wrong lead
      (a.accuracy - b.accuracy) ||               // worst-remembered of those first
      (a.i - b.i))                               // then course order
    .map(r => r.w);
}

/* Never-seen words waiting to be introduced, capped by what today has left. */
function availableNewWords(limit) {
  const out = [];
  const words = newCardOrder(eligibleWords().filter(w => !state.fsrs.cards[wordKey(w.chapter, w.greek)]));
  for (const w of words) {
    if (out.length >= limit) break;
    out.push({ word: w, key: wordKey(w.chapter, w.greek), card: FSRS.createEmptyCard() });
  }
  return out;
}

function newQuotaLeft() {
  return Math.max(0, NEW_CARDS_PER_DAY - newIntroducedToday());
}

/* A Daily Review session is (a) everything due today, then (b) up to the day's
   remaining new-card allowance. */
function buildReviewQueue() {
  const now = new Date();
  return dueCards(now).concat(availableNewWords(newQuotaLeft()));
}

/* what the home screen counts -- cheap enough to recompute on every render */
function reviewDueCount() {
  return dueCards(new Date()).length + availableNewWords(newQuotaLeft()).length;
}

/* the Progress-tab breakdown: every word in the vocabulary sits in exactly one
   FSRS state, and words without a card are State.New by definition */
function fsrsBreakdown() {
  const counts = [0, 0, 0, 0];
  const now = new Date();
  let due = 0;
  CHAPTERS.forEach(ch => (VOCAB[ch] || []).forEach(w => {
    const card = fsrsCard(wordKey(ch, w.greek.trim()));
    if (!card) { counts[FSRS.State.New] += 1; return; }
    counts[card.state] += 1;
    if (card.due <= now) due += 1;
  }));
  return { counts, due };
}

/* how many of the cards now scheduled come back within `days` days */
function dueWithin(days) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() + days);
  let n = 0;
  Object.values(state.fsrs.cards).forEach(raw => {
    const card = reviveCard(raw);
    if (card && card.due <= cutoff) n += 1;
  });
  return n;
}

/* Grade a card. ts-fsrs returns every possible outcome for the current card;
   we persist the one the student chose and append the review to the log. */
function rateCard(entry, rating) {
  const now = new Date();
  const isNew = !state.fsrs.cards[entry.key];
  const result = scheduler.repeat(entry.card, now)[rating];
  state.fsrs.cards[entry.key] = result.card;
  saveFsrsCards();
  /* FSRS does not use time-spent-per-card, so the log is just the grade and
     when it was given -- stored in UTC so it survives a change of timezone */
  state.fsrs.log.push({ key: entry.key, rating, review: now.toISOString() });
  saveFsrsLog();
  if (isNew) noteNewCardIntroduced();
  return result.card;
}

/* the interval each button would produce, shown under it the way every other
   SRS does -- it comes from the same scheduler call the rating will use */
function ratingPreviews(entry) {
  const now = new Date();
  const scheduled = scheduler.repeat(entry.card, now);
  const out = {};
  RATINGS.forEach(r => { out[r.value] = formatInterval(scheduled[r.value].card.due, now); });
  return out;
}

function formatInterval(due, from) {
  const mins = Math.round((due - from) / 60000);
  if (mins < 60) return Math.max(1, mins) + 'm';
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + 'h';
  const days = Math.round(hours / 24);
  if (days < 30) return days + 'd';
  const months = Math.round(days / 30);
  if (months < 12) return months + 'mo';
  return (days / 365).toFixed(days >= 365 * 10 ? 0 : 1) + 'y';
}


/* ---------- derived data ---------- */
/* ---------- learned ----------
   A word is learned once it has come back correctly REVIEW_CLEAR_STREAK times
   running, and one slip puts it back. That is the same bar that retires a word
   from the review list, so the app has one meaning of the word rather than a
   lifetime-accuracy figure on Home and a streak on the session report. A count
   can therefore go down, which is the honest behaviour: a word you have just
   missed again is not one you know. */
function wordLearned(chapter, greek) {
  const s = state.stats[wordKey(chapter, greek)];
  return !!(s && (s.streak || 0) >= REVIEW_CLEAR_STREAK);
}

/* how much of a chapter is learned, as a percentage of its words */
function chapterMastery(ch) {
  const words = VOCAB[ch] || [];
  if (!words.length) return 0;
  const learned = words.filter(w => wordLearned(ch, w.greek)).length;
  return Math.round((learned / words.length) * 100);
}

/* every word in the chapter, with nothing owing */
function chapterComplete(ch) {
  const words = VOCAB[ch] || [];
  return words.length > 0 && words.every(w => wordLearned(ch, w.greek));
}

/* Chapters finished since the last time this was asked. Reading it marks them,
   so the celebration fires once and only once however many sessions follow.
   Usually one; a session drawn from several chapters can finish two, and they
   are shown one after the other rather than one of them being dropped. */
function chaptersJustCompleted() {
  const fresh = CHAPTERS.filter(ch => chapterComplete(ch) && state.chaptersDone.indexOf(ch) === -1);
  if (fresh.length) {
    state.chaptersDone = state.chaptersDone.concat(fresh);
    saveChaptersDone();
  }
  return fresh;
}

/* "λόγος · καρδία and ἀλήθεια" -- the last one joined with "and", because the
   summary reads it as a sentence, and the rest with a middot rather than a
   comma: half the vocabulary entries carry their article after a comma, and
   comma-separating those would run them together. */
function listWords(words) {
  if (words.length <= 1) return words.join('');
  return words.slice(0, -1).join(' · ') + ' and ' + words[words.length - 1];
}

/*
 * "accuracy" measures how often you answer correctly among the questions
 * you've actually been asked so far -- it is NOT the same as how much of
 * the 23-chapter syllabus you have covered. Two words attempted with one
 * mistake is already 50% accuracy; twenty words attempted with two
 * mistakes is 90% accuracy -- both are possible after "finishing" only a
 * couple of chapters. Coverage of the syllabus is shown separately, as
 * "{wordsSeen} of {totalWords} words" and "chapters mastered".
 */
function overallStats() {
  let totalSeenWords = 0, totalWords = 0, sumSeen = 0, sumCorrect = 0;
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      totalWords += 1;
      const s = state.stats[wordKey(ch, w.greek)];
      if (s && s.seen > 0) {
        totalSeenWords += 1;
        sumSeen += s.seen;
        sumCorrect += s.correct;
      }
    });
  });
  const accuracy = sumSeen > 0 ? Math.round((sumCorrect / sumSeen) * 100) : 0;
  const chaptersMastered = CHAPTERS.filter(ch => chapterMastery(ch) >= MASTERY_THRESHOLD).length;
  return { wordsSeen: totalSeenWords, totalWords, accuracy, chaptersMastered, totalChapters: CHAPTERS.length };
}

function continueChapter() {
  const next = CHAPTERS.find(ch => chapterMastery(ch) < MASTERY_THRESHOLD);
  return next !== undefined ? next : CHAPTERS[CHAPTERS.length - 1];
}

function learnedWordsCount() {
  let count = 0;
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => { if (wordLearned(ch, w.greek)) count += 1; });
  });
  return count;
}

function allWords() {
  const out = [];
  CHAPTERS.forEach(ch => (VOCAB[ch] || []).forEach(w => out.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim(), cat: w.cat })));
  return out;
}

function pickRandomWord() {
  const words = allWords();
  return words[Math.floor(Math.random() * words.length)];
}

function wordsToReview(limit) {
  const rows = [];
  CHAPTERS.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => {
      const s = state.stats[wordKey(ch, w.greek)];
      /* a word leaves the list once it has come back correctly
         REVIEW_CLEAR_STREAK times in a row; missing it again resets the run
         and the word returns */
      if (s && s.seen > 0 && s.correct < s.seen && (s.streak || 0) < REVIEW_CLEAR_STREAK) {
        /* chapter and cat come along so this list can be handed straight to a
           quiz, not just rendered on the Progress tab */
        rows.push({
          chapter: ch, greek: w.greek.trim(), english: w.english.trim(), cat: w.cat,
          accuracy: s.correct / s.seen, streak: s.streak || 0
        });
      }
    });
  });
  rows.sort((a, b) => a.accuracy - b.accuracy);
  return limit ? rows.slice(0, limit) : rows;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPool(chapters) {
  const pool = [];
  chapters.forEach(ch => {
    (VOCAB[ch] || []).forEach(w => pool.push({ chapter: ch, greek: w.greek.trim(), english: w.english.trim(), cat: w.cat }));
  });
  return pool;
}

/* ---------- selections: chapters or categories ----------
   every mode draws its words from a "selection", which is either a set of
   chapters or a set of categories. Chapters behave exactly as before; the
   category route is the same idea through a different front door. */
function chapterSelection(chapters) {
  return { by: 'chapters', chapters: [...chapters].sort((a, b) => a - b), categories: [] };
}

function selectionFromSetup() {
  const s = state.setup;
  if (s.selectBy === 'categories') {
    return { by: 'categories', chapters: [], categories: CATEGORY_NAMES.filter(c => s.selectedCategories.has(c)) };
  }
  return chapterSelection([...s.selectedChapters]);
}

function poolForSelection(sel) {
  if (!sel) return [];
  if (sel.by === 'categories') {
    const wanted = new Set(sel.categories);
    return allWords().filter(w => wanted.has(w.cat));
  }
  return buildPool(sel.chapters);
}

function selectionSize(sel) {
  return sel.by === 'categories' ? sel.categories.length : sel.chapters.length;
}

function pickDistractors(correctItem, pool, field, n) {
  const others = shuffle(pool.filter(w => w[field] !== correctItem[field]));
  const seenVals = new Set([correctItem[field]]);
  const out = [];
  for (const w of others) {
    if (out.length >= n) break;
    if (seenVals.has(w[field])) continue;
    seenVals.add(w[field]);
    out.push(w[field]);
  }
  return out;
}

/* ---------- generous grading for typed answers ---------- */
function extractAlternatives(englishStr) {
  let alts = [];
  const parenRegex = /\(([^)]+)\)/g;
  let m;
  while ((m = parenRegex.exec(englishStr)) !== null) alts.push(m[1]);
  const cleaned = englishStr.replace(parenRegex, '');
  cleaned.split(/[,;]/).forEach(seg => {
    seg.split('/').forEach(sub => {
      const t = sub.trim();
      if (t) alts.push(t);
    });
  });
  return alts.filter(Boolean);
}

function normalizeAnswer(s) {
  return s.toLowerCase().trim()
    .replace(/^i\s+/, '')
    .replace(/^(a|an|the)\s+/, '')
    .replace(/[.!?]+$/, '')
    .replace(/\s+/g, ' ');
}

function wordBoundaryMatch(haystack, needle) {
  if (!needle) return false;
  const escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('\\b' + escaped + '\\b').test(haystack);
}

function checkTypedAnswer(userInput, correctEnglish) {
  const user = normalizeAnswer(userInput);
  if (!user) return false;
  const alts = extractAlternatives(correctEnglish).map(normalizeAnswer);
  return alts.some(alt => {
    if (!alt) return false;
    if (user === alt) return true;
    if (alt.split(' ').length === 1) {
      return wordBoundaryMatch(user, alt) || wordBoundaryMatch(alt, user);
    }
    return user.includes(alt) || alt.includes(user);
  });
}

/* ---------- quiz construction ---------- */
function makeQuizItems(sourceItems, pool, settings) {
  return sourceItems.map(item => {
    let dir = settings.mode === 'typed' ? 'gtoe' : settings.direction;
    if (dir === 'mixed') dir = Math.random() < 0.5 ? 'gtoe' : 'etog';
    const answerField = dir === 'gtoe' ? 'english' : 'greek';
    const promptField = dir === 'gtoe' ? 'greek' : 'english';
    const q = {
      item, dir, promptField, answerField,
      prompt: item[promptField],
      correctAnswer: item[answerField]
    };
    if (settings.mode === 'mc') {
      const distractors = pickDistractors(item, pool, answerField, 3);
      q.options = shuffle([item[answerField], ...distractors]);
    }
    return q;
  });
}

/* `settings.items`, when given, names the exact words to ask; the selection
   then only supplies the pool the multiple-choice distractors are drawn from.
   Without it the words are drawn from the selection as before. */
function startQuiz(settings) {
  const pool = poolForSelection(settings.selection);
  const source = settings.items && settings.items.length ? settings.items : shuffle(pool);
  const n = Math.min(settings.count, source.length);
  const chosen = source.slice(0, n);
  stopMemoryTimer();
  state.cards = null;
  state.memory = null;
  state.lastSession = 'quiz';
  state.quiz = {
    settings: { ...settings },
    pool,
    items: makeQuizItems(chosen, pool, settings),
    index: 0,
    score: 0,
    answered: false,
    selectedOpt: null,
    typedValue: '',
    typedCorrect: null,
    results: [],              // one entry per question, for the summary
    done: false,              // the last word is answered, the summary is up
    startedAt: Date.now(),
    learnedWords: []          // words that crossed REVIEW_CLEAR_STREAK in this session
  };
  state.screen = 'flashcard';
  render();
}

/* ---------- review-your-weak-words quiz ----------
   Deliberately not an FSRS session: this drills the words the four quiz modes
   have caught the student out on -- the same list the Progress tab shows --
   through the ordinary Multiple Choice machinery, and feeds the ordinary
   accuracy stats. The scheduler is not involved and no card is touched, so
   answering here can never disturb a word's spacing. */
const REVIEW_QUIZ_SIZE = 10;

function startReviewQuiz() {
  const words = wordsToReview(REVIEW_QUIZ_SIZE);
  if (!words.length) return;
  startQuiz({
    selection: chapterSelection(CHAPTERS),  // distractors may come from anywhere
    items: shuffle(words),                  // worst-ranked words, asked in random order
    count: REVIEW_QUIZ_SIZE,
    direction: 'mixed',
    mode: 'mc'
  });
}

function quizInProgress() {
  return !!(state.quiz && !state.quiz.done && state.quiz.index < state.quiz.items.length);
}

/* the end-of-session report, which is a finished session rather than a live one */
function sessionSummaryUp() {
  return !!(state.quiz && state.quiz.done);
}

/* leaving the report: the session is over, so there is nothing to confirm away */
function closeSessionSummary() {
  state.quiz = null;
  state.screen = 'home';
  render();
}

/* "New session" goes back to setup rather than re-dealing the same words:
   the scope and format are already remembered there, so it is one tap to the
   same session again and still allows a different one */
function repeatSession() {
  state.quiz = null;
  openSetup();
}

function goHome() { state.screen = 'home'; render(); }

function goQuizTab() {
  const cards = cardsInProgress(), quiz = quizInProgress(), memory = !!state.memory;
  if (state.review && (state.lastSession === 'review' || (!cards && !quiz && !memory))) { state.screen = 'review'; render(); return; }
  if (memory && (state.lastSession === 'memory' || (!cards && !quiz))) { state.screen = 'memory'; render(); return; }
  state.screen = (cards && (state.lastSession === 'cards' || !quiz)) ? 'cards' : 'flashcard';
  render();
}

function openSetup() {
  state.setup.step = 1;
  state.setup.anim = 'fwd';
  state.screen = 'setup';
  render();
}

function goProgress() { state.screen = 'progress'; render(); }

function exitQuiz() {
  if (window.confirm("Exit this quiz? Your progress on this quiz will be lost.")) {
    state.quiz = null;
    state.screen = 'home';
    render();
  }
}

function shuffleRandomWord() {
  state.randomWord = pickRandomWord();
  state.randomWordRevealed = false;
  render();
}

function revealRandomWord() {
  state.randomWordRevealed = true;
}

/* ---------- daily review session ----------
   One word at a time, Greek -> English only in this first version. The card is
   flipped to reveal the meaning, then graded on the four-point FSRS scale --
   that grade, not a right/wrong mark, is what drives the schedule. */
function startDailyReview() {
  const queue = buildReviewQueue();
  if (!queue.length) return;
  stopMemoryTimer();
  state.quiz = null;
  state.cards = null;
  state.memory = null;
  state.review = { queue, index: 0, revealed: false, reviewed: 0, right: 0, results: [], done: false, startedAt: Date.now() };
  state.lastSession = 'review';
  state.screen = 'review';
  render();
}

function reviewInProgress() {
  return !!(state.review && !state.review.done);
}

function exitReview() {
  state.review = null;
  state.screen = 'home';
  render();
}

/* grade the card in front of the student and move on. The queue was built once
   at the start of the session, so a card rated Again comes back in the next
   session rather than looping here -- keeps a session finite and predictable. */
function submitRating(rating) {
  const r = state.review;
  if (!r || r.done || !r.revealed) return;
  const entry = r.queue[r.index];
  rateCard(entry, rating);
  r.reviewed += 1;
  r.results.push({ greek: entry.word.greek, english: entry.word.english, rating });
  /* Good and Easy are the two grades that mean the meaning came back, so they
     are what the log counts as right -- there is no mark here otherwise */
  if (rating >= 3) r.right += 1;
  bumpStreak();
  if (r.index >= r.queue.length - 1) {
    r.done = true;
    recordSession({
      mode: 'review',
      scope: null,            /* the queue is drawn by the scheduler, not from a selection */
      asked: r.reviewed,
      right: r.right,
      ms: Date.now() - r.startedAt
    });
  } else {
    r.index += 1;
    r.revealed = false;
  }
  render();
}


/* ---------- quiz setup screen actions ---------- */
function toggleSetupChapter(ch) {
  if (state.setup.selectedChapters.has(ch)) state.setup.selectedChapters.delete(ch);
  else state.setup.selectedChapters.add(ch);
  render();
}
function toggleSetupCategory(cat) {
  if (state.setup.selectedCategories.has(cat)) state.setup.selectedCategories.delete(cat);
  else state.setup.selectedCategories.add(cat);
  render();
}
function setSelectBy(by) {
  if (state.setup.selectBy === by) return;
  state.setup.selectBy = by;
  render();
}
function setupSelectAll() {
  if (state.setup.selectBy === 'categories') CATEGORY_NAMES.forEach(c => state.setup.selectedCategories.add(c));
  else CHAPTERS.forEach(c => state.setup.selectedChapters.add(c));
  render();
}
function setupSelectNone() {
  if (state.setup.selectBy === 'categories') state.setup.selectedCategories.clear();
  else state.setup.selectedChapters.clear();
  render();
}
function setSetupMode(m) {
  state.setup.mode = m;
  if (m === 'typed') state.setup.direction = 'gtoe';
  render();
}
function setSetupDirection(d) { state.setup.direction = d; render(); }
function setSetupCount(n) { state.setup.count = n; render(); }

/* the steps that actually apply for the chosen format:
   flashcards stop after the format step, type-answer skips direction */
function stepPath() {
  if (state.setup.mode === 'cards' || state.setup.mode === 'memory') return [1, 2];
  if (state.setup.mode === 'typed') return [1, 2, 4, 5];
  return [1, 2, 3, 4, 5];
}

function goToStep(n, anim) {
  state.setup.step = n;
  state.setup.anim = anim || 'fwd';
  render();
}

function setupNext() {
  const step = state.setup.step;
  if (step === 1) { goToStep(2, 'fwd'); return; }
  if (step === 2) {
    if (state.setup.mode === 'cards') { startCards(); return; }
    if (state.setup.mode === 'memory') { startMemory(); return; }
    goToStep(state.setup.mode === 'typed' ? 4 : 3, 'fwd');
    return;
  }
  if (step === 3) { goToStep(4, 'fwd'); return; }
  if (step === 4) { goToStep(5, 'fwd'); return; }
}

function startOver() {
  state.setup.step = 1;
  state.setup.anim = 'back';
  render();
}

function setupBack() {
  const step = state.setup.step;
  if (step === 1) { goHome(); return; }
  if (step === 2) { goToStep(1, 'back'); return; }
  if (step === 3) { goToStep(2, 'back'); return; }
  if (step === 4) { goToStep(state.setup.mode === 'mc' ? 3 : 2, 'back'); return; }
  goToStep(4, 'back');
}

/* choosing a format / direction / word count also moves the flow along, so a
   step is a single tap -- prior choices are kept, so Back is non-destructive */
function chooseFormat(m) { setSetupMode(m); setupNext(); }
function chooseDirection(d) { state.setup.direction = d; setupNext(); }
function chooseCount(n) { state.setup.count = n; setupNext(); }

/* ---------- flashcard sessions (no scoring: browsing only, like the review card) ---------- */
function startCards() {
  const selection = selectionFromSetup();
  const pool = poolForSelection(selection);
  if (!pool.length) return;
  stopMemoryTimer();
  state.quiz = null;
  state.memory = null;
  state.cards = { selection, items: shuffle(pool), index: 0, revealed: false, done: false, startedAt: Date.now() };
  state.lastSession = 'cards';
  state.screen = 'cards';
  render();
}

function cardsInProgress() { return !!(state.cards && !state.cards.done); }
function cardsSummaryUp() { return !!(state.cards && state.cards.done); }

function nextCard() {
  const c = state.cards;
  if (!c) return;
  /* the end of the deck is a finished session, not a dismissal, so it gets
     its own card rather than dropping the student back on Home */
  if (c.index >= c.items.length - 1) { c.done = true; recordCardsSession(); render(); return; }
  c.index += 1;
  c.revealed = false;
  render();
}

function prevCard() {
  const c = state.cards;
  if (!c || c.index === 0) return;
  c.index -= 1;
  c.revealed = false;
  render();
}

/* Flashcards are unscored, so the record says how many cards were met and
   leaves `right` empty rather than inventing a mark for them. A deck read to
   the end is logged the moment it ends, so walking away by the tab bar does
   not lose it; leaving part way logs what was read. `logged` keeps the two
   paths from writing the same session twice. */
function recordCardsSession() {
  const c = state.cards;
  if (!c || c.logged) return;
  c.logged = true;
  recordSession({
    mode: 'cards',
    scope: scopeFromSelection(c.selection),
    asked: Math.min(c.index + 1, c.items.length),
    right: null,
    ms: Date.now() - c.startedAt
  });
}

function exitCards() {
  recordCardsSession();
  state.cards = null;
  state.screen = 'home';
  render();
}

function launchSetupQuiz() {
  const selection = selectionFromSetup();
  const pool = poolForSelection(selection);
  const minNeeded = state.setup.mode === 'typed' ? 1 : 4;
  if (pool.length < minNeeded) return;
  startQuiz({
    selection,
    count: state.setup.count,
    direction: state.setup.direction,
    mode: state.setup.mode
  });
}

/* ---------- memory game ----------
   a matching board: half the tiles are Greek, half are the English meanings.
   It is a game rather than a graded drill, so it keeps the daily streak alive
   but does not feed the per-word accuracy stats. */
function formatTime(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}

/* a fresh board drawn from a selection: the words are re-sampled every time,
   so replaying a large selection deals a different set */
function newMemorySession(selection) {
  const pool = poolForSelection(selection);
  if (!pool.length) return null;
  /* a full board is 5 pairs; a thin selection just plays with fewer */
  const pairs = Math.min(MEMORY_PAIRS, pool.length);
  const tiles = [];
  shuffle(pool).slice(0, pairs).forEach((w, i) => {
    tiles.push({ id: 'g' + i, pair: i, kind: 'greek', text: w.greek, matched: false });
    tiles.push({ id: 'e' + i, pair: i, kind: 'english', text: w.english, matched: false });
  });
  return {
    selection,
    poolSize: pool.length,
    pairs,
    tiles: shuffle(tiles),
    flipped: [],
    matched: 0,
    busy: false,
    startedAt: null,
    finishedMs: null,
    previousBest: null,
    beatBest: false,
    timerId: null
  };
}

function startMemory() {
  const session = newMemorySession(selectionFromSetup());
  if (!session) return;
  memoryFocus = 0;
  stopMemoryTimer();
  state.quiz = null;
  state.cards = null;
  state.memory = session;
  state.lastSession = 'memory';
  state.screen = 'memory';
  render();
}

function memoryElapsed() {
  const m = state.memory;
  if (!m) return 0;
  if (m.finishedMs !== null) return m.finishedMs;
  return m.startedAt ? Date.now() - m.startedAt : 0;
}

function stopMemoryTimer() {
  if (state.memory && state.memory.timerId) {
    clearInterval(state.memory.timerId);
    state.memory.timerId = null;
  }
}

/* the clock runs from the first flip to the last match, and ticks in place
   rather than through a re-render, which would interrupt the flips */
function tickMemoryClock() {
  const el = document.getElementById('mem-timer');
  if (el) el.textContent = formatTime(memoryElapsed());
}

function updateMemoryCounter() {
  const m = state.memory;
  const el = document.getElementById('mem-count');
  if (m && el) el.textContent = `Pairs ${m.matched} of ${m.pairs}`;
}

function exitMemory() {
  stopMemoryTimer();
  state.memory = null;
  state.screen = 'home';
  render();
}

function replayMemory() {
  stopMemoryTimer();
  memoryFocus = 0;
  const session = state.memory ? newMemorySession(state.memory.selection) : null;
  if (!session) { goHome(); return; }
  state.memory = session;
  state.screen = 'memory';
  render();
}

function memoryTile(id) {
  const m = state.memory;
  return m ? m.tiles.find(t => t.id === id) : null;
}

function flipMemoryTile(id) {
  const m = state.memory;
  if (!m || m.busy || m.finishedMs !== null) return;
  const tile = memoryTile(id);
  if (!tile || tile.matched || m.flipped.indexOf(id) !== -1) return;

  if (!m.startedAt) {
    m.startedAt = Date.now();
    m.timerId = setInterval(tickMemoryClock, 250);
  }

  const node = document.getElementById('mem-' + id);
  if (node) node.classList.add('is-flipped');
  m.flipped.push(id);
  if (m.flipped.length < 2) return;

  const a = memoryTile(m.flipped[0]), b = memoryTile(m.flipped[1]);
  if (a.pair === b.pair) {
    a.matched = true;
    b.matched = true;
    m.matched += 1;
    const matchedIds = m.flipped.slice();
    m.flipped = [];
    updateMemoryCounter();
    setTimeout(() => {
      if (state.memory !== m) return;
      matchedIds.forEach(tid => {
        const n = document.getElementById('mem-' + tid);
        if (n) n.classList.add('is-matched');
      });
    }, 300);
    if (m.matched === m.pairs) finishMemory();
  } else {
    /* hold the board while the mismatch is readable, then flip both back */
    m.busy = true;
    setTimeout(() => {
      if (state.memory !== m) return;
      m.flipped.forEach(tid => {
        const n = document.getElementById('mem-' + tid);
        if (n) n.classList.remove('is-flipped');
      });
      m.flipped = [];
      m.busy = false;
    }, 850);
  }
}

function finishMemory() {
  const m = state.memory;
  m.finishedMs = m.startedAt ? Date.now() - m.startedAt : 0;
  stopMemoryTimer();
  bumpStreak();
  recordSession({
    mode: 'memory',
    scope: scopeFromSelection(m.selection),
    asked: m.pairs,
    right: m.pairs,           /* the board is only finished when every pair is found */
    ms: m.finishedMs
  });
  m.previousBest = state.memoryBest;
  if (state.memoryBest === null || m.finishedMs < state.memoryBest) {
    m.beatBest = state.memoryBest !== null;
    state.memoryBest = m.finishedMs;
    saveMemoryBest();
  }
  /* let the last flip and its match pulse finish before the completion state */
  setTimeout(() => { if (state.memory === m) render(); }, 1050);
}

/* ---------- answering ---------- */
function goNextQuestion(q) {
  if (q.index < q.items.length - 1) {
    q.index += 1;
    q.answered = false;
    q.selectedOpt = null;
    q.typedValue = '';
    q.typedCorrect = null;
    render();
  } else {
    /* both scored formats end on the report: it is the only place the
       session says what it taught rather than what it asked */
    q.done = true;
    recordQuizSession(q);
    /* a finished chapter is the bigger event, so it takes the screen and the
       report stands down for that session */
    const done = chaptersJustCompleted();
    if (done.length) {
      state.celebrate = { chapters: done, i: 0 };
      state.screen = 'chapterDone';
    }
    render();
  }
}

function recordQuizSession(q) {
  recordSession({
    mode: q.settings.mode,
    scope: scopeFromSelection(q.settings.selection),
    asked: q.items.length,
    right: q.score,
    learned: q.learnedWords.length,
    ms: Date.now() - q.startedAt
  });
}

function selectOption(opt) {
  const q = state.quiz;
  if (!q || q.answered) return;
  q.answered = true;
  q.selectedOpt = opt;
  const current = q.items[q.index];
  const correct = opt === current.correctAnswer;
  if (correct) q.score += 1;
  q.results.push({
    prompt: current.prompt,
    correctAnswer: current.correctAnswer,
    typed: opt,               /* what was picked, shown the same way a typed answer is */
    correct
  });
  bumpStreak();
  if (recordAttempt(current.item.chapter, current.item.greek, correct)) q.learnedWords.push(current.item.greek);
  render();
  setTimeout(() => { if (state.quiz === q) goNextQuestion(q); }, correct ? 650 : 1500);
}

/* the two faces of the mark the card turns over to reveal -- the same paths
   the multiple-choice options use, drawn larger */
function resultMarkSvg(correct) {
  return correct
    ? '<svg width="40" height="40" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg width="36" height="36" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
}

function submitTyped() {
  const q = state.quiz;
  if (!q || q.answered) return;
  const input = document.getElementById('typed-input');
  const val = input ? input.value : '';
  const current = q.items[q.index];
  const correct = checkTypedAnswer(val, current.correctAnswer);
  q.answered = true;
  q.typedValue = val;
  q.typedCorrect = correct;
  if (correct) q.score += 1;
  q.results.push({
    prompt: current.prompt,
    correctAnswer: current.correctAnswer,
    typed: val.trim(),
    correct
  });
  bumpStreak();
  if (recordAttempt(current.item.chapter, current.item.greek, correct)) q.learnedWords.push(current.item.greek);
  /* flipped in the DOM rather than re-rendered, for the same reason
     wireFlipCard is: a re-render would replace the card mid-transition and the
     flip would never play. The advance below still re-renders as it always did. */
  flipResultCard(correct);
  setTimeout(() => { if (state.quiz === q) goNextQuestion(q); }, correct ? 650 : 1800);
}

/* turns the prompt card over onto its mark and closes the input behind it */
function flipResultCard(correct) {
  const card = document.getElementById('typed-card');
  const face = document.getElementById('typed-result');
  if (face) {
    face.className = 'result-face' + (correct ? '' : ' is-wrong');
    face.innerHTML = `
      <div class="result-mark ${correct ? 'is-correct' : 'is-wrong'}">${resultMarkSvg(correct)}</div>
      <div class="kicker">${correct ? 'CORRECT' : 'NOT QUITE'}</div>
    `;
  }
  if (card) card.classList.add('is-flipped');
  /* the running score used to come along with the re-render this replaces */
  const scoreEl = document.getElementById('quiz-score');
  if (scoreEl) scoreEl.textContent = `Score ${state.quiz.score}`;
  const input = document.getElementById('typed-input');
  const submit = document.getElementById('typed-submit');
  if (input) { input.blur(); input.disabled = true; }
  if (submit) submit.disabled = true;
}

/* ---------- rendering ---------- */
function glassLayer() { return '<div class="glass-fill"></div><div class="glass-edge"></div>'; }

/* time-of-day greeting, unless a session has already been logged today */
function greeting() {
  if (state.streak.lastDate === todayStr()) return 'Welcome Back!';
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Good Morning!';
  if (h >= 12 && h < 18) return 'Good Afternoon!';
  return 'Good Evening!';
}

function renderHeader(isHome, pillLabel, showClose, pillId, sessionHint) {
  let right = '';
  if (showClose) {
    right = `<div class="header-right">
         ${sessionHint ? `<span class="session-keys">${sessionHint}</span>` : ''}
         <span class="key-hint">Esc to exit</span>
         <button class="icon-btn" id="btn-exit-quiz" title="Close" aria-label="Close">
           <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 2.5l11 11M13.5 2.5l-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
         </button>
       </div>`;
  } else if (!isHome) {
    const inner = `${glassLayer()}<div class="glass-content">${pillLabel}</div>`;
    right = pillId
      ? `<button class="pill glass" id="${pillId}">${inner}</button>`
      : `<div class="pill glass">${inner}</div>`;
  }
  return `
    <div class="header-row">
      <div class="header-brand">
        <p class="app-title">Oikos</p>
      </div>
      ${right}
    </div>
  `;
}

/* a flip card: same component for a flashcard session and the review word */
function flipCard(id, frontKicker, frontText, backKicker, backText, backHint) {
  return `
    <div class="prompt-panel glass flip" id="${id}">
      ${glassLayer()}
      <div class="glass-content flip-inner">
        <div class="flip-face flip-front">
          <div class="kicker">${frontKicker}</div>
          <div class="prompt-word" style="margin-top:12px">${frontText}</div>
        </div>
        <div class="flip-face flip-back">
          <div class="kicker">${backKicker}</div>
          <div class="prompt-word is-english" style="margin-top:12px">${backText}</div>
          ${backHint ? `<div class="flip-hint text-muted">${backHint}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

/* Daily Review's entry point: its own action, separate from Start Learning,
   because it is a different kind of session -- scheduled by FSRS rather than
   chosen. It goes quiet rather than disappearing when there is nothing due. */
function reviewCta() {
  const due = reviewDueCount();
  if (due === 0) {
    /* Daily Review done for today -- offer the weak words instead of a dead
       end. Styled as the quieter option, since it is optional practice rather
       than something the schedule is asking for. */
    const weak = wordsToReview(REVIEW_QUIZ_SIZE).length;
    if (weak === 0) {
      return `<div class="review-caught-up text-muted">All caught up — nothing due for review.</div>`;
    }
    return `
      <div class="review-caught-up text-muted">All caught up — nothing due today.</div>
      <button class="review-cta is-practice" id="btn-review-quiz">
        <span>
          <span class="review-cta-main">Review ${weak} word${weak === 1 ? '' : 's'} you've missed</span>
          <span class="review-cta-sub">Multiple choice · Greek ⇄ English</span>
        </span>
        <span class="review-cta-count">${weak}</span>
      </button>
    `;
  }
  return `
    <button class="review-cta" id="btn-daily-review">
      <span>
        <span class="review-cta-main">Daily Review</span>
        <span class="review-cta-sub">${due} word${due === 1 ? '' : 's'} due · spaced repetition</span>
      </span>
      <span class="review-cta-play">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 3.6 16 10 4 16.4V3.6Z" fill="currentColor"/></svg>
      </span>
    </button>
  `;
}

/* ---------- home: the hub ----------
   Two modules, one streak card, and Daily Review on the floor of the screen.
   Each module card is a single tappable thing -- icon, name, where you are,
   and one bar -- rather than a panel of figures: Progress is where numbers
   are read, and Home only has to say which door to go through. */

const HOME_TICK = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const HUB_CHEVRON = '<svg width="7" height="12" viewBox="0 0 8 13" fill="none"><path d="M1.5 1.5 6.5 6.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DAY_INITIALS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

function streakCard() {
  const { days, doneToday } = currentStreak();
  const best = bestStreak();
  const today = todayStr();
  const week = lastNDays(7).map(d => {
    const isToday = d.date === today;
    const cls = d.studied ? 'is-studied' : (d.rested ? 'is-rested' : (isToday ? 'is-open' : ''));
    const [y, m, dd] = d.date.split('-').map(Number);
    const label = isToday ? 'TODAY' : DAY_INITIALS[new Date(y, m - 1, dd).getDay()];
    return `
      <span class="streak-day ${isToday ? 'is-today' : ''}">
        <span class="streak-dot ${cls}">${d.studied ? HOME_TICK : ''}</span>
        <span class="streak-day-label">${label}</span>
      </span>`;
  }).join('');
  return `
    <div class="streak-card">
      <div class="streak-card-head">
        <span class="streak-run">${days} day streak</span>
        <span class="streak-best">${best > 0 ? `Best so far: ${best}` : (doneToday ? 'Your first day' : 'Not started yet')}</span>
      </div>
      <div class="streak-week">${week}</div>
    </div>
  `;
}

function hubCard(id, icon, title, sub, action, pct, pctLabel, labelClass) {
  return `
    <div class="hub-card" id="${id}" role="button" tabindex="0">
      <div class="hub-row">
        <span class="hub-icon">${icon}</span>
        <span class="hub-text">
          <span class="hub-title">${title}</span>
          <span class="hub-sub">${sub}</span>
        </span>
        <span class="hub-pill">${action}${HUB_CHEVRON}</span>
      </div>
      <div class="hub-bar">
        <span class="hub-track"><span class="hub-fill" style="width:${pct}%"></span></span>
        <span class="${labelClass || 'hub-pct'}">${pctLabel}</span>
      </div>
    </div>
  `;
}

function vocabHubCard() {
  const st = overallStats();
  const learned = learnedWordsCount();
  const pct = st.totalWords > 0 ? Math.round((learned / st.totalWords) * 100) : 0;
  const icon = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 5.2C8.4 4 6.2 3.6 3 3.8v11.4c3.2-.2 5.4.2 7 1.4 1.6-1.2 3.8-1.6 7-1.4V3.8c-3.2-.2-5.4.2-7 1.4Z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 5.2v11.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
  return hubCard('hub-vocab', icon, 'Vocabulary', `${learned} of ${st.totalWords} words learned`, 'Study', pct, pct + '%');
}

function grammarHubCard() {
  const mastered = paradigmsMastered();
  const pct = PARADIGMS.length ? Math.round((mastered / PARADIGMS.length) * 100) : 0;
  const icon = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3.5" width="15" height="13" rx="1.6" stroke="currentColor" stroke-width="1.9"/><path d="M2.5 8h15M7.5 8v8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
  return hubCard('hub-grammar', icon, 'Grammar', `${mastered} of ${PARADIGMS.length} paradigms mastered`, 'Drill', pct, pct + '%');
}

function renderHome() {
  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(true)}

      <div class="home-screen">
        <h1 class="greeting">${greeting()}</h1>

        ${streakCard()}

        <div class="hub-grid">
          ${vocabHubCard()}
          ${grammarHubCard()}
        </div>

        <div class="home-fill"></div>

        ${reviewCta()}
      </div>
    </div>
  `;

  const openCard = (id, go) => {
    const el = document.getElementById(id);
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
  };
  openCard('hub-vocab', openSetup);
  openCard('hub-grammar', goGrammar);
  const reviewBtn = document.getElementById('btn-daily-review');
  if (reviewBtn) reviewBtn.addEventListener('click', startDailyReview);
  const weakBtn = document.getElementById('btn-review-quiz');
  if (weakBtn) weakBtn.addEventListener('click', startReviewQuiz);
}

/* ---------- step-by-step quiz setup ---------- */
const FORMAT_LABELS = { mc: 'Multiple Choice', typed: 'Type Answer', cards: 'Flashcards', memory: 'Memory Game' };
const DIRECTION_LABELS = { gtoe: 'Greek → English', etog: 'English → Greek', mixed: 'Mixed' };

function chaptersLabel(chapters) {
  if (!chapters.length) return 'No chapters';
  if (chapters.length === CHAPTERS.length) return `All ${CHAPTERS.length} chapters`;
  return `${chapters.length} chapter${chapters.length === 1 ? '' : 's'}`;
}

function categoriesLabel(cats) {
  if (!cats.length) return 'No categories';
  if (cats.length === CATEGORY_NAMES.length) return `All ${CATEGORY_NAMES.length} categories`;
  return `${cats.length} categor${cats.length === 1 ? 'y' : 'ies'}`;
}

/* the short form used on buttons and summaries -- "3 chapters" / "2 categories" */
function selectionLabel(sel) {
  return sel.by === 'categories' ? categoriesLabel(sel.categories) : chaptersLabel(sel.chapters);
}

/* the long form underneath it -- which chapters, or which categories */
function selectionDetail(sel) {
  if (sel.by === 'categories') {
    if (!sel.categories.length) return 'No categories selected';
    if (sel.categories.length === CATEGORY_NAMES.length) return 'Every category in the course';
    return sel.categories.join(', ');
  }
  return sel.chapters.length && sel.chapters.length !== CHAPTERS.length
    ? 'Chapter ' + sel.chapters.join(', ')
    : 'Every chapter in the course';
}

function tickIcon() {
  return '<span class="choice-tick"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
}

function choiceBtn(attr, value, active, label, sub) {
  return `
    <button class="choice-btn ${active ? 'active' : ''}" ${attr}="${value}">
      <span><span>${label}</span>${sub ? `<span class="choice-sub">${sub}</span>` : ''}</span>
      ${tickIcon()}
    </button>
  `;
}

function renderSetup() {
  const s = state.setup;
  const path = stepPath();
  const stepIndex = Math.max(0, path.indexOf(s.step));
  const selection = selectionFromSetup();
  const byCategory = selection.by === 'categories';
  const chosenCount = selectionSize(selection);
  const poolSize = poolForSelection(selection).length;

  let title = '', hint = '', body = '', footer = '';

  if (s.step === 1) {
    title = byCategory ? 'Choose your categories' : 'Choose your chapters';
    hint = 'Pick one, several, or all of them.';
    const grid = byCategory
      ? `<div class="categories-grid">${CATEGORIES.map(c =>
          `<button class="cat-chip ${s.selectedCategories.has(c.name) ? 'selected' : ''}" data-cat="${c.name}"><span class="cat-name">${c.name}</span><span class="cat-count">${c.count} word${c.count === 1 ? '' : 's'}</span></button>`
        ).join('')}</div>`
      : `<div class="chapters-grid">${CHAPTERS.map(c =>
          `<button class="chapter-chip selectable ${s.selectedChapters.has(c) ? 'selected' : ''}" data-ch="${c}">${c}</button>`
        ).join('')}</div>`;
    body = `
      <div class="segmented select-toggle">
        <button class="seg-btn ${byCategory ? '' : 'active'}" data-by="chapters">Chapters</button>
        <button class="seg-btn ${byCategory ? 'active' : ''}" data-by="categories">Categories</button>
      </div>
      <div class="setup-label-row">
        <span class="kicker">${byCategory ? 'CATEGORIES' : 'CHAPTERS'}</span>
        <span>
          <button class="link-btn" id="btn-sel-all">Select all</button>
          &nbsp;&nbsp;
          <button class="link-btn" id="btn-sel-none">Clear</button>
        </span>
      </div>
      ${grid}
    `;
    const emptyLabel = byCategory ? 'Select at least one category' : 'Select at least one chapter';
    footer = `
      <button class="start-btn step-next" id="btn-step-next" ${chosenCount ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${chosenCount ? `Next — ${selectionLabel(selection)}, ${poolSize} words` : emptyLabel}</span>
        ${chosenCount ? '<span class="key-hint on-accent kh-btn">↵</span>' : ''}
      </button>
    `;
  } else if (s.step === 2) {
    title = 'How do you want to learn?';
    hint = 'Flashcards and the Memory Game start straight away — no further setup.';
    body = `<div class="stack">
      ${choiceBtn('data-mode', 'cards', s.mode === 'cards', 'Flashcards', 'Tap to flip — browse at your own pace')}
      ${choiceBtn('data-mode', 'mc', s.mode === 'mc', 'Multiple Choice', 'Pick the right meaning from four options')}
      ${choiceBtn('data-mode', 'typed', s.mode === 'typed', 'Type Answer', 'Write the English meaning yourself')}
      ${choiceBtn('data-mode', 'memory', s.mode === 'memory', 'Memory Game', 'Match Greek to English against the clock')}
    </div>`;
  } else if (s.step === 3) {
    title = 'Which direction?';
    hint = 'How each question is asked.';
    body = `<div class="stack">
      ${choiceBtn('data-dir', 'gtoe', s.direction === 'gtoe', DIRECTION_LABELS.gtoe, 'See the Greek, choose the meaning')}
      ${choiceBtn('data-dir', 'etog', s.direction === 'etog', DIRECTION_LABELS.etog, 'See the meaning, choose the Greek')}
      ${choiceBtn('data-dir', 'mixed', s.direction === 'mixed', DIRECTION_LABELS.mixed, 'A mix of both, question by question')}
    </div>`;
  } else if (s.step === 4) {
    title = 'How many words?';
    hint = poolSize < 30 ? `Your selection has ${poolSize} words — shorter quizzes stop early.` : 'Drawn at random from your chapters.';
    body = `<div class="stack">
      ${choiceBtn('data-count', '10', s.count === 10, '10 words', 'A quick session')}
      ${choiceBtn('data-count', '20', s.count === 20, '20 words', 'The usual drill')}
      ${choiceBtn('data-count', '30', s.count === 30, '30 words', 'A longer stretch')}
    </div>`;
  } else {
    const minNeeded = s.mode === 'typed' ? 1 : 4;
    const canStart = poolSize >= minNeeded;
    const parts = [selectionLabel(selection), FORMAT_LABELS[s.mode]];
    parts.push(s.mode === 'typed' ? DIRECTION_LABELS.gtoe : DIRECTION_LABELS[s.direction]);
    parts.push(`${Math.min(s.count, poolSize)} words`);
    title = 'Ready when you are';
    hint = '';
    body = `
      <div class="summary-card">
        <div class="summary-line">${parts.join(' · ')}</div>
        <div class="summary-sub text-muted">${selectionDetail(selection)}</div>
      </div>
    `;
    footer = `
      <button class="start-btn step-next" id="btn-launch" ${canStart ? '' : 'disabled'}>
        <div class="resume-fill"></div>
        <div class="resume-edge"></div>
        <span>${canStart ? 'Start Learning' : (byCategory ? 'Select more categories' : 'Select more chapters')}</span>
        ${canStart ? '<span class="key-hint on-accent kh-btn">↵</span>' : ''}
      </button>
    `;
  }

  const pct = Math.round(((stepIndex + 1) / path.length) * 100);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Start Over', false, 'btn-start-over')}

      <div class="setup-panel glass">
        ${glassLayer()}
        <div class="glass-content">
          <div class="setup-topbar">
            <button class="back-btn" id="btn-step-back" title="Back" aria-label="Back">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 2.5 4.5 8l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="step-count">Step ${stepIndex + 1}</span>
            <span class="setup-esc key-hint">Esc to leave setup</span>
          </div>
          <div class="step-track"><div class="step-fill" style="width:${pct}%"></div></div>

          <div class="${s.anim === 'back' ? 'step-in-back' : 'step-in-fwd'}">
            <h2 class="step-title">${title}</h2>
            ${hint ? `<p class="step-hint text-muted">${hint}</p>` : ''}
            ${body}
            ${footer}
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btn-step-back').addEventListener('click', setupBack);
  document.getElementById('btn-start-over').addEventListener('click', startOver);

  if (s.step === 1) {
    document.querySelectorAll('[data-by]').forEach(el => el.addEventListener('click', () => setSelectBy(el.dataset.by)));
    document.querySelectorAll('.chapter-chip').forEach(el => {
      el.addEventListener('click', () => toggleSetupChapter(Number(el.dataset.ch)));
    });
    document.querySelectorAll('.cat-chip').forEach(el => {
      el.addEventListener('click', () => toggleSetupCategory(el.dataset.cat));
    });
    document.getElementById('btn-sel-all').addEventListener('click', setupSelectAll);
    document.getElementById('btn-sel-none').addEventListener('click', setupSelectNone);
    if (chosenCount) document.getElementById('btn-step-next').addEventListener('click', setupNext);
  } else if (s.step === 2) {
    document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => chooseFormat(el.dataset.mode)));
  } else if (s.step === 3) {
    document.querySelectorAll('[data-dir]').forEach(el => el.addEventListener('click', () => chooseDirection(el.dataset.dir)));
  } else if (s.step === 4) {
    document.querySelectorAll('[data-count]').forEach(el => el.addEventListener('click', () => chooseCount(Number(el.dataset.count))));
  } else {
    const launch = document.getElementById('btn-launch');
    if (!launch.disabled) launch.addEventListener('click', launchSetupQuiz);
  }
}

/* what the session is drawing from, for the desktop side panel:
   the chapter numbers, or the category names when that is how it was chosen */
function sessionSourceRow(sel) {
  if (!sel) return '';
  const byCat = sel.by === 'categories';
  const list = byCat ? sel.categories : sel.chapters;
  if (!list.length) return '';
  const label = byCat ? (list.length === 1 ? 'Category' : 'Categories') : (list.length === 1 ? 'Chapter' : 'Chapters');
  const value = list.length > 4 ? `${list.length} selected` : list.join(', ');
  return `<div class="side-row"><span>${label}</span><span class="side-row-value">${value}</span></div>`;
}

/* ---------- flashcard session ---------- */
function renderCards() {
  const c = state.cards;
  if (!c) { goHome(); return; }
  const total = c.items.length;
  const w = c.items[c.index];
  const pct = Math.round((c.index / total) * 100);
  const isLast = c.index === total - 1;

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Flashcards', true)}

      <div class="progress-row">
        <span>Card ${c.index + 1} of ${total}</span>
        <span>Reviewed ${c.index}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="cards-layout">
        <div>
          ${flipCard('flip-card', 'GREEK WORD — <span class="hint-tap">TAP TO FLIP</span><span class="hint-key">SPACE TO FLIP</span>', w.greek, 'ENGLISH MEANING', w.english, `Chapter ${w.chapter} · ${w.greek}`)}

          <div class="card-actions">
            <button class="ghost-btn" id="btn-prev-card" ${c.index === 0 ? 'disabled' : ''}><span class="nav-arrow">←&nbsp;</span>Previous</button>
            <button class="start-btn" id="btn-next-card" style="margin-top:0">
              <div class="resume-fill"></div>
              <div class="resume-edge"></div>
              <span>${isLast ? 'Finish' : 'Next card'}<span class="nav-arrow">&nbsp;→</span></span>
            </button>
          </div>
        </div>

        <aside class="side-panel">
          <div class="side-panel-card">
            <span class="kicker">THIS SESSION</span>
            ${sessionSourceRow(c.selection)}
            <div class="side-row"><span>Cards</span><span class="side-row-value">${total}</span></div>
            <div class="side-row"><span>Reviewed</span><span class="side-row-value">${c.index}</span></div>
          </div>
          <div class="side-panel-card">
            <span class="kicker">KEYS</span>
            <div class="side-row"><span>Flip card</span><span class="key-hint">Space</span></div>
            <div class="side-row"><span>Previous</span><span class="key-hint">←</span></div>
            <div class="side-row"><span>Next</span><span class="key-hint">→</span></div>
            <div class="side-row"><span>Exit</span><span class="key-hint">Esc</span></div>
          </div>
        </aside>
      </div>
    </div>
  `;

  wireFlipCard('flip-card', () => { c.revealed = true; });
  document.getElementById('btn-prev-card').addEventListener('click', prevCard);
  document.getElementById('btn-next-card').addEventListener('click', nextCard);
  document.getElementById('btn-exit-quiz').addEventListener('click', exitCards);
}

/* flips in the DOM rather than re-rendering, so the transition actually plays */
function wireFlipCard(id, onFlip) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', () => {
    const flipped = el.classList.toggle('is-flipped');
    if (flipped && onFlip) onFlip();
  });
}

/* ---------- daily review screens ---------- */
function renderDailyReview() {
  const r = state.review;
  if (!r) { goHome(); return; }
  if (r.done) { renderReviewDone(); return; }

  const total = r.queue.length;
  const entry = r.queue[r.index];
  const w = entry.word;
  const pct = Math.round((r.index / total) * 100);
  const isNew = !state.fsrs.cards[entry.key];
  const previews = ratingPreviews(entry);
  const label = isNew ? (missRank(w).missed ? 'New word · often missed' : 'New word') : 'Review';

  const rateButtons = RATINGS.map((rt, i) => `
    <button class="rate-btn ${rt.cls}" data-rating="${rt.value}">
      <span class="rate-key">${i + 1}</span>
      <span class="rate-label">${rt.label}</span>
      <span class="rate-when">${previews[rt.value]}</span>
    </button>
  `).join('');

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Daily Review', true)}

      <div class="progress-row">
        <span>Card ${r.index + 1} of ${total}</span>
        <span>${label}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="review-layout">
        <div>
          ${flipCard('review-card', 'GREEK WORD — <span class="hint-tap">TAP TO REVEAL</span><span class="hint-key">SPACE TO REVEAL</span>', w.greek, 'ENGLISH MEANING', w.english, `Chapter ${w.chapter} · ${w.greek}`)}

          <div class="rate-hint text-muted" id="rate-hint">Tap the card, then rate how well you recalled it.</div>
          <div class="rate-row" id="rate-row" hidden>${rateButtons}</div>
        </div>

        <aside class="side-panel">
          <div class="side-panel-card">
            <span class="kicker">THIS SESSION</span>
            <div class="side-row"><span>Reviewed</span><span class="side-row-value">${r.reviewed}</span></div>
            <div class="side-row"><span>Remaining</span><span class="side-row-value">${total - r.index}</span></div>
            <div class="side-row"><span>New today</span><span class="side-row-value">${newIntroducedToday()} of ${NEW_CARDS_PER_DAY}</span></div>
            <div class="side-note">Space reveals the card. 1–4 grade it once revealed.</div>
          </div>
        </aside>
      </div>
    </div>
  `;

  wireFlipCard('review-card', () => {
    r.revealed = true;
    document.getElementById('rate-row').hidden = false;
    document.getElementById('rate-hint').hidden = true;
  });
  document.querySelectorAll('#rate-row .rate-btn').forEach(btn => {
    btn.addEventListener('click', () => submitRating(Number(btn.dataset.rating)));
  });
  document.getElementById('btn-exit-quiz').addEventListener('click', exitReview);
}

/* A light close, not a graded one: FSRS sessions have no score -- rating a word
   Again is information for the scheduler, not a mistake to be marked down for. */
/* The review grades on a four-point scale rather than marking right or wrong,
   so its rows carry the grade given. Forgot and Hard lead, for the same reason
   wrong answers lead everywhere else: they are what the report is for. */
function reviewRow(r) {
  const rating = RATINGS.find(rt => rt.value === r.rating);
  return `
    <div class="sum-row">
      <span class="sum-left"><span class="sum-greek">${r.greek}</span></span>
      <span class="sum-answers">
        <div><span class="sum-typed">${escapeHtml(r.english)}</span></div>
        <div><span class="sum-label">Graded</span><span class="sum-correct">${rating ? rating.label : ''}</span></div>
      </span>
    </div>
  `;
}

function reviewSection(title, rows) {
  if (!rows.length) return '';
  return `
    <div class="sum-head">
      <span class="kicker">${title}</span>
      <span class="sum-count">${rows.length}</span>
    </div>
    <div class="list-panel glass">${glassLayer()}<div class="glass-content">
      ${rows.map(reviewRow).join('')}
    </div></div>
  `;
}

function renderReviewDone() {
  const r = state.review;
  const tomorrow = dueWithin(1);
  const week = dueWithin(7);
  const results = r.results || [];
  const shaky = results.filter(x => x.rating < FSRS.Rating.Good);
  const solid = results.filter(x => x.rating >= FSRS.Rating.Good);

  document.getElementById('screen').innerHTML = `
    <div class="fade-in">
      ${renderHeader(false, 'Daily Review', true)}

      ${donePanel('REVIEW COMPLETE', r.reviewed, `word${r.reviewed === 1 ? '' : 's'} reviewed`,
          results.length ? `${solid.length} of ${results.length} came back` : '')}

      ${reviewSection('COMING BACK SOON', shaky)}
      ${reviewSection('RECALLED', solid)}

      <div class="list-panel glass">${glassLayer()}<div class="glass-content">
        <div class="missed-row"><span>Due by tomorrow</span><span class="missed-english">${tomorrow}</span></div>
        <div class="missed-row"><span>Due within a week</span><span class="missed-english">${week}</span></div>
      </div></div>

      <div class="card-actions">
        <button class="ghost-btn" id="btn-review-home">Done</button>
        ${reviewDueCount() > 0 ? `
        <button class="start-btn" id="btn-review-again">
          <div class="resume-fill"></div>
          <div class="resume-edge"></div>
          <span>Keep going</span>
        </button>` : ''}
      </div>
    </div>
  `;

  document.getElementById('btn-review-home').addEventListener('click', exitReview);
  document.getElementById('btn-exit-quiz').addEventListener('click', exitReview);
  const again = document.getElementById('btn-review-again');
  if (again) again.addEventListener('click', startDailyReview);
}


function renderQuizTab() {
  if (sessionSummaryUp()) { renderSessionSummary(); return; }
  if (quizInProgress()) { renderFlashcard(); return; }
  if (cardsSummaryUp()) { renderCardsSummary(); return; }
  if (cardsInProgress()) { renderCards(); return; }
  renderQuizEmpty();
}

/* ---------- the session report ----------
   Shown once, after the last word, by both scored formats. Wrong answers
   lead, because they are the reason to read it at all; the correct ones
   follow so the session can still be seen whole. Nothing here is written to
   storage -- every word was already logged by recordAttempt as it was
   answered, and the session record by recordQuizSession. */

/* thresholds chosen so the top band is genuinely hard to hit and the bottom
   band never reads as a telling-off */
function scoreMessage(pct, total) {
  if (total === 0) return 'Nothing to report.';
  if (pct >= 90) return 'Excellent work — that is a strong session.';
  if (pct >= 75) return 'Well done — most of these are sticking.';
  if (pct >= 50) return 'Good progress — the rest will come with practice.';
  return 'Keep practising — these words are worth another pass.';
}

/* the panel every finished session lands on: one figure, a line under it,
