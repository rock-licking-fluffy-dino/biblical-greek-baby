<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Oikos</title>

<!-- iOS home-screen app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oikos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151714" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    /* surfaces */
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #fbfbf8;
    --hairline: #e2e1d9;
    --hairline-soft: #ecebe3;
    --track: #e6e5dd;

    /* ink */
    --ink: #1c1b19;
    --muted: rgba(28,27,25,0.5);
    --faint: rgba(28,27,25,0.42);

    /* sage ramp */
    --sage-50:  #f0f4f0;
    --sage-100: #eef2ee;
    --sage-200: #c6d3c8;
    --sage-300: #a8bfad;
    --sage-500: #4f7a5c;
    --sage-600: #3f6449;
    --sage-700: #33503b;
    --sage-800: #273d2e;

    --green: var(--sage-500);
    --green-solid: var(--sage-600);
    --green-press: var(--sage-700);
    --green-text: var(--sage-700);
    --green-tint: var(--sage-100);
    --green-border: var(--sage-200);
    --on-green: #ffffff;

    /* shape */
    --r-card: 14px;
    --r-btn: 12px;
    --r-sm: 8px;

    --shadow-card: 0 1px 2px rgba(32,30,29,0.04);
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151714;
      --surface: #1e211c;
      --surface-2: #1a1d19;
      --hairline: #2c302a;
      --hairline-soft: #262a24;
      --track: #2f342e;

      --ink: #edefe9;
      --muted: rgba(237,239,233,0.5);
      --faint: rgba(237,239,233,0.42);

      --sage-100: #222a23;
      --sage-200: #3a4438;
      --sage-300: #4d5c4f;
      --sage-500: #8fb599;
      --sage-600: #8fb599;
      --sage-700: #a9c9b2;
      --sage-800: #c3dbca;

      --green-text: var(--sage-700);
      --on-green: #12150f;
      --shadow-card: none;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--bg);
  }
  body { min-height: 100vh; min-height: 100dvh; }
  #app { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; min-height: 100dvh; }
  #screen { padding: calc(env(safe-area-inset-top) + 34px) 22px 132px; }

  a { color: var(--green-text); }
  a:hover { color: var(--green-press); }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  ::selection { background: var(--green-tint); }

  .text-muted { color: var(--muted); }
  .kicker {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.13em;
    color: var(--green-text); font-weight: 600;
  }

  /* surfaces: opaque, bordered -- the two layer divs the renderers emit stay,
     they just stop being glass */
  .glass { position: relative; }
  .glass-fill, .glass-edge { position: absolute; inset: 0; pointer-events: none; border-radius: var(--r-card); }
  .glass-fill { background: var(--surface); }
  .glass-edge { border: 1px solid var(--hairline); }
  .glass-content { position: relative; z-index: 1; }

  /* header */
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; gap: 14px; }
  .app-title { font-weight: 800; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; margin: 0; }
  .app-tagline { font-size: 10.5px; margin-top: 6px; color: var(--green-text); font-weight: 600; line-height: 1.4; }
  .app-subtitle { font-size: 12px; margin-top: 3px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: var(--r-btn); cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--hairline);
  }
  .icon-btn:hover { background: var(--green-tint); }
  .pill { position: relative; border-radius: var(--r-btn); }
  .pill .glass-fill, .pill .glass-edge { border-radius: var(--r-btn); }
  .pill .glass-content { padding: 9px 14px; font-size: 12px; color: var(--green-text); font-weight: 700; white-space: nowrap; }
  button.pill { border: none; background: transparent; padding: 0; font-family: var(--font-sans); cursor: pointer; }
  button.pill:hover .glass-fill { background: var(--green-tint); }

  /* home: continue card */
  .continue-card { border-radius: var(--r-card); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
  .continue-card h2 { margin: 0 0 6px; font-weight: 800; font-size: 25px; letter-spacing: -0.02em; }
  .continue-words { margin: 0 0 16px; font-size: 13px; }
  .resume-btn { position: relative; width: 100%; border: none; border-radius: var(--r-btn); padding: 15px 0; overflow: hidden; cursor: pointer; }
  .resume-btn .resume-fill { position: absolute; inset: 0; background: var(--green-solid); }
  .resume-btn .resume-edge { position: absolute; inset: 0; }
  .resume-btn span { position: relative; z-index: 1; color: var(--on-green); font-weight: 800; font-size: 14px; }
  .resume-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* stats row */
  .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat-chip { flex: 1; border-radius: var(--r-sm); padding: 12px 6px; text-align: center; }
  .stat-chip .glass-fill, .stat-chip .glass-edge { border-radius: var(--r-sm); }
  .stat-value { font-weight: 800; font-size: 19px; }
  .stat-label { font-size: 10px; margin-top: 2px; }

  /* chapters grid */
  .chapters-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chapter-chip {
    text-align: center; padding: 10px 0; border-radius: var(--r-sm); font-size: 11.5px;
    cursor: pointer; user-select: none; font-family: var(--font-sans); font-weight: 600;
    background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  }
  .chapter-chip.done { background: var(--green-solid); color: var(--on-green); border-color: var(--green-solid); }
  .chapter-chip.not-done { color: var(--muted); }
  .chapter-chip.selectable:hover { border-color: var(--green-300, var(--sage-300)); background: var(--surface-2); }
  .chapter-chip.selected { background: var(--green-solid); color: var(--on-green); border-color: var(--green-solid); }

  /* setup panel */
  .setup-panel { border-radius: var(--r-card); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
  .setup-section + .setup-section { margin-top: 16px; }
  .setup-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .link-btn {
    background: none; border: none; color: var(--green-text); font-size: 12px; font-weight: 700;
    cursor: pointer; padding: 0; font-family: var(--font-sans); text-decoration: underline; text-underline-offset: 3px;
  }
  .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    flex: 1 1 auto; border: 1px solid var(--hairline); background: var(--surface);
    color: var(--ink); border-radius: var(--r-sm); padding: 11px 8px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; font-family: var(--font-sans); text-align: center; white-space: nowrap;
  }
  .seg-btn.active { background: var(--green-solid); color: var(--on-green); border-color: var(--green-solid); }
  .seg-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .setup-note { font-size: 11.5px; margin-top: 8px; line-height: 1.5; }

  .start-btn {
    position: relative; width: 100%; border: none; border-radius: var(--r-btn); padding: 16px 0;
    overflow: hidden; cursor: pointer; margin-top: 16px;
  }
  .start-btn .resume-fill { position: absolute; inset: 0; background: var(--green-solid); transition: background 150ms ease; }
  .start-btn .resume-edge { position: absolute; inset: 0; }
  .start-btn span { position: relative; z-index: 1; color: var(--on-green); font-weight: 800; font-size: 14.5px; }
  .start-btn:not(:disabled):hover .resume-fill { background: var(--green-press); }
  .start-btn:disabled .resume-fill { background: var(--track); }
  .start-btn:disabled span { color: var(--muted); }
  .start-btn:disabled { cursor: not-allowed; }

  /* quiz session */
  .progress-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 10px; font-feature-settings: 'tnum'; }
  .progress-track { height: 6px; background: var(--track); border-radius: 3px; margin-bottom: 26px; overflow: hidden; }
  .progress-fill { height: 6px; background: var(--green); border-radius: 3px; transition: width 0.25s ease; }
  .prompt-panel { border-radius: var(--r-card); padding: 34px 20px; margin-bottom: 22px; box-shadow: var(--shadow-card); text-align: center; }
  .prompt-word { font-weight: 800; font-size: 42px; line-height: 1.1; letter-spacing: -0.02em; word-break: break-word; }
  .prompt-word.is-english { font-size: 26px; line-height: 1.3; letter-spacing: -0.01em; }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option-btn { position: relative; border: none; background: transparent; border-radius: var(--r-btn); padding: 16px; text-align: left; cursor: pointer; font-family: var(--font-sans); }
  .option-btn:disabled { cursor: default; }
  .option-fill { position: absolute; inset: 0; border-radius: var(--r-btn); background: var(--surface); }
  .option-edge { position: absolute; inset: 0; border-radius: var(--r-btn); border: 1px solid var(--hairline); }
  .option-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 500; color: var(--ink); gap: 10px; }
  .option-btn:not(:disabled):hover .option-edge { border-color: var(--sage-300); }
  .option-btn:not(:disabled):hover .option-fill { background: var(--surface-2); }
  .option-btn.is-correct .option-fill { background: var(--green-tint); }
  .option-btn.is-correct .option-edge { border: 1.5px solid var(--green); }
  .option-btn.is-correct .option-content { color: var(--green-text); font-weight: 600; }
  .option-btn.is-wrong .option-fill { background: var(--surface-2); }
  .option-btn.is-wrong .option-content { color: var(--muted); }
  .option-btn.is-faded .option-content { color: var(--muted); }
  .option-icon { flex-shrink: 0; display: flex; }

  /* typed answer */
  .typed-row { display: flex; gap: 8px; }
  .typed-input-wrap { position: relative; flex: 1; border-radius: var(--r-btn); overflow: hidden; }
  .typed-input-wrap .glass-fill, .typed-input-wrap .glass-edge { border-radius: var(--r-btn); }
  .typed-input {
    position: relative; z-index: 1; width: 100%; border: none; background: transparent;
    padding: 16px; font-size: 15px; font-family: var(--font-sans); color: var(--ink); outline: none;
  }
  .typed-input::placeholder { color: var(--faint); }
  .typed-input-wrap.is-correct .glass-fill { background: var(--green-tint); }
  .typed-input-wrap.is-correct .glass-edge { border: 1.5px solid var(--green); }
  .typed-input-wrap.is-correct .typed-input { color: var(--green-text); }
  .typed-input-wrap.is-wrong .glass-fill { background: var(--surface-2); }
  .typed-input-wrap.is-wrong .typed-input { color: var(--muted); }
  .typed-submit { position: relative; border: none; background: transparent; border-radius: var(--r-btn); padding: 0 22px; overflow: hidden; cursor: pointer; }
  .typed-submit .resume-fill { position: absolute; inset: 0; background: var(--green-solid); transition: background 150ms ease; }
  .typed-submit:not(:disabled):hover .resume-fill { background: var(--green-press); }
  .typed-submit span { position: relative; z-index: 1; color: var(--on-green); font-weight: 800; font-size: 13.5px; }
  .typed-submit:disabled { cursor: not-allowed; opacity: 0.45; }
  .typed-feedback { text-align: center; font-size: 12.5px; margin-top: 14px; min-height: 16px; }

  /* progress screen */
  .rings-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .rings-row .ring-panel { flex: 1; margin-bottom: 0; padding: 20px 10px; }
  .ring-panel { border-radius: var(--r-card); padding: 26px 20px; margin-bottom: 16px; box-shadow: var(--shadow-card); text-align: center; }
  .ring-panel .kicker { margin-bottom: 12px; }
  .ring-label { font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  .ring-caption { font-size: 11.5px; margin-top: 2px; line-height: 1.4; }

  /* review-tab empty state */
  .quiz-empty-note { text-align: center; font-size: 12.5px; margin-bottom: 18px; line-height: 1.5; }
  .flip-hint { font-size: 11px; margin-top: 14px; }
  .quiz-empty-actions { display: flex; gap: 10px; margin-top: 6px; }
  .quiz-empty-actions .start-btn { width: auto; flex: 1; }
  .ghost-btn {
    flex: 1; border-radius: var(--r-btn); padding: 15px 0; cursor: pointer;
    background: transparent; border: 1.5px solid var(--green-border); color: var(--green-text); font-weight: 700;
    font-family: var(--font-sans); font-size: 14px;
  }
  .ghost-btn:not(:disabled):hover { background: var(--green-tint); }
  .list-panel { border-radius: var(--r-card); padding: 4px 18px; margin-bottom: 18px; box-shadow: var(--shadow-card); }
  .chapter-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .chapter-row + .chapter-row { border-top: 1px solid var(--hairline-soft); }
  .chapter-row .ch-num { width: 20px; font-size: 12px; color: var(--muted); font-feature-settings: 'tnum'; }
  .chapter-row .ch-track { flex: 1; height: 6px; background: var(--track); border-radius: 3px; }
  .chapter-row .ch-fill { height: 6px; background: var(--green); border-radius: 3px; }
  .chapter-row .ch-pct { width: 34px; text-align: right; font-size: 12px; color: var(--muted); font-feature-settings: 'tnum'; }
  .missed-row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; font-size: 14px; }
  .missed-row + .missed-row { border-top: 1px solid var(--hairline-soft); }
  .missed-greek { font-weight: 700; }
  .missed-english { text-align: right; }
  .missed-right { display: flex; align-items: center; justify-content: flex-end; gap: 9px; text-align: right; min-width: 0; }
  /* progress towards clearing a word off the review list */
  .streak-dots { display: inline-flex; gap: 3px; flex-shrink: 0; }
  .streak-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--track); display: block; }
  .streak-dots i.on { background: var(--green); }
  .empty-note { text-align: center; font-size: 13px; padding: 16px 0; }

  /* nav bar: full width, opaque, hairline top edge.
     the WRAP carries the background, the border and the bottom safe-area pad --
     the buttons stay capped at 480px, but the bar itself spans the viewport, so
     a window wider than 480px but still on the mobile layout (landscape phone,
     split-screen laptop) has no page background showing beside the nav. */
  .tab-bar-wrap {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: center; pointer-events: auto;
    background: var(--surface); border-top: 1px solid var(--hairline);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-bar {
    position: relative; pointer-events: auto; display: flex; width: 100%; max-width: 480px;
    background: transparent; border-top: none;
    padding: 12px 0 14px;
  }
  .tab-bar .glass-fill, .tab-bar .glass-edge { display: none; }
  .tab-btn {
    position: relative; z-index: 1; flex: 1; border: none; background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 4px 0; cursor: pointer; color: var(--muted); font-family: var(--font-sans);
  }
  .tab-btn.active { color: var(--green-text); }
  .tab-btn svg { width: 26px; height: 26px; }
  .tab-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; }

  /* ---------- home ---------- */
  .home-screen {
    display: flex; flex-direction: column; justify-content: center;
    min-height: calc(100vh - env(safe-area-inset-top) - 240px);
    min-height: calc(100dvh - env(safe-area-inset-top) - 240px);
  }
  .greeting {
    margin: 0; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02;
    font-size: clamp(38px, 12vw, 46px);
  }
  .home-slogan { display: none; }
  .stat-rings {
    display: flex; margin: 32px 0 0;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--r-card); box-shadow: var(--shadow-card);
  }
  .stat-ring { flex: 1; text-align: center; padding: 20px 6px 16px; }
  .stat-ring + .stat-ring { border-left: 1px solid var(--hairline-soft); }
  .stat-ring-label { font-size: 10.5px; line-height: 1.3; margin-top: 9px; color: var(--muted); font-weight: 500; }
  .stat-caption { text-align: center; font-size: 11px; margin-top: 14px; color: var(--faint); font-weight: 500; font-feature-settings: 'tnum'; }
  .stat-caption .sep, .progress-row .sep { color: var(--track); margin: 0 6px; }
  .home-actions { margin-top: 34px; }
  .home-actions .start-btn { margin-top: 0; padding: 18px 0; }
  .home-actions .start-btn span { font-size: 15px; }
  .secondary-btn {
    width: 100%; margin-top: 10px; padding: 16px 0; border-radius: var(--r-btn); cursor: pointer;
    font-family: var(--font-sans); font-size: 14px; font-weight: 700; color: var(--green-text);
    background: transparent; border: 1.5px solid var(--green-border);
  }
  .secondary-btn:hover { background: var(--green-tint); }

  /* ---------- step-by-step setup ---------- */
  .setup-topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .back-btn {
    width: 34px; height: 34px; border-radius: var(--r-sm); flex-shrink: 0; cursor: pointer;
    border: 1px solid var(--hairline); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .back-btn:hover { background: var(--green-tint); }
  .step-count { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.13em; font-weight: 600; color: var(--green-text); }
  .step-track { height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
  .step-fill { height: 4px; background: var(--green); border-radius: 2px; transition: width 240ms cubic-bezier(.2,.7,.3,1); }
  .step-title { margin: 0 0 5px; font-size: 22px; font-weight: 800; letter-spacing: -0.025em; }
  .step-hint { margin: 0 0 18px; font-size: 12.5px; line-height: 1.5; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    position: relative; width: 100%; text-align: left; cursor: pointer; font-family: var(--font-sans);
    border: 1px solid var(--hairline); background: var(--surface); border-radius: var(--r-btn);
    padding: 15px 16px; font-size: 14.5px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .choice-btn:hover { border-color: var(--sage-300); background: var(--surface-2); }
  .choice-btn.active { background: var(--green-solid); border-color: var(--green-solid); color: var(--on-green); }
  .choice-sub { display: block; font-size: 11.5px; font-weight: 400; margin-top: 3px; color: var(--muted); }
  .choice-btn.active .choice-sub { color: color-mix(in srgb, var(--on-green) 78%, transparent); }
  .choice-tick { flex-shrink: 0; opacity: 0; transition: opacity 150ms ease; }
  .choice-btn.active .choice-tick { opacity: 1; }
  .summary-card {
    border-radius: var(--r-btn); padding: 16px; background: var(--surface-2);
    border: 1px solid var(--hairline);
  }
  .summary-line { font-size: 13.5px; font-weight: 700; line-height: 1.5; }
  .summary-sub { font-size: 11.5px; margin-top: 5px; line-height: 1.45; }
  .setup-panel .start-btn.step-next { margin-top: 18px; }

  /* ---------- flip card ---------- */
  .flip { perspective: 1200px; cursor: pointer; }
  .flip-inner {
    position: relative; transition: transform 280ms cubic-bezier(.2,.7,.3,1);
    transform-style: preserve-3d; min-height: 116px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .flip.is-flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; width: 100%; }
  .flip-back { position: absolute; top: 50%; left: 0; transform: translateY(-50%) rotateY(180deg); }
  .card-actions { display: flex; gap: 10px; margin-top: 18px; }
  .card-actions .ghost-btn, .card-actions .start-btn { flex: 1; margin-top: 0; }
  .card-actions .ghost-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- category chips ---------- */
  .select-toggle { margin-bottom: 14px; }
  .categories-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-chip {
    display: inline-flex; align-items: center; gap: 6px; text-align: left;
    padding: 9px 11px; border-radius: var(--r-sm); font-size: 11.5px; line-height: 1.25;
    cursor: pointer; user-select: none; font-family: var(--font-sans); font-weight: 600;
    background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  }
  .cat-chip:hover { border-color: var(--sage-300); background: var(--surface-2); }
  .cat-chip.selected { background: var(--green-solid); color: var(--on-green); border-color: var(--green-solid); }
  .cat-count { font-size: 10px; font-weight: 700; color: var(--muted); font-feature-settings: 'tnum'; }
  .cat-chip.selected .cat-count { color: var(--on-green); opacity: 0.72; }

  /* ---------- memory game ---------- */
  .mem-note { font-size: 11.5px; margin: 0 0 14px; line-height: 1.5; text-align: center; }
  .mem-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .mem-tile {
    position: relative; perspective: 900px; background: none; border: none; padding: 0;
    flex: 0 0 calc((100% - 16px) / 3); cursor: pointer;
    font-family: var(--font-sans); aspect-ratio: 1 / 1;
  }
  .mem-tile-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 280ms cubic-bezier(.2,.7,.3,1); transform-style: preserve-3d;
  }
  .mem-tile.is-flipped .mem-tile-inner { transform: rotateY(180deg); }
  .mem-face {
    position: absolute; inset: 0; border-radius: var(--r-sm); overflow: hidden;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid var(--hairline); background: var(--surface); box-shadow: var(--shadow-card);
  }
  .mem-front { background: var(--green-tint); border-color: var(--green-border); color: var(--green-text); }
  .mem-back { transform: rotateY(180deg); font-size: 11.5px; font-weight: 600; line-height: 1.32; color: var(--ink); }
  .mem-back.is-greek { font-size: 13.5px; font-weight: 700; }
  .mem-tile.is-matched { pointer-events: none; }
  .mem-tile.is-matched .mem-tile-inner { animation: oikos-match 420ms cubic-bezier(.2,.7,.3,1) both; }
  .mem-tile.is-matched .mem-back {
    background: var(--green-tint); border-color: var(--green-border);
    color: var(--green-text); box-shadow: none; opacity: 0.78;
    transition: background 200ms ease, color 200ms ease, opacity 200ms ease;
  }
  @keyframes oikos-match {
    0%   { transform: rotateY(180deg) scale(1); }
    45%  { transform: rotateY(180deg) scale(1.055); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .mem-done-time {
    font-weight: 800; font-size: 40px; font-feature-settings: 'tnum';
    letter-spacing: -0.02em; margin: 6px 0 2px;
  }
  .mem-done-badge {
    display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 999px;
    background: var(--green-tint); border: 1px solid var(--green-border);
    color: var(--green-text); font-size: 11.5px; font-weight: 700;
  }

  /* ---------- motion ---------- */
  button { transition: transform 150ms cubic-bezier(.2,.7,.3,1), background 150ms ease, border-color 150ms ease; }
  button:not(:disabled):active { transform: scale(0.98); }
  .step-in-fwd { animation: oikos-step-fwd 220ms cubic-bezier(.2,.7,.3,1); }
  .step-in-back { animation: oikos-step-back 220ms cubic-bezier(.2,.7,.3,1); }
  @keyframes oikos-step-fwd { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes oikos-step-back { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  @keyframes oikos-pulse-correct {
    0% { background: var(--surface); }
    45% { background: var(--sage-200); }
    100% { background: var(--green-tint); }
  }
  @keyframes oikos-pulse-wrong {
    0% { background: var(--surface); }
    45% { background: var(--track); }
    100% { background: var(--surface-2); }
  }
  .option-btn.is-correct .option-fill { animation: oikos-pulse-correct 300ms ease both; }
  .option-btn.is-wrong .option-fill { animation: oikos-pulse-wrong 300ms ease both; }
  .typed-input-wrap.is-correct .glass-fill { animation: oikos-pulse-correct 300ms ease both; }
  .typed-input-wrap.is-wrong .glass-fill { animation: oikos-pulse-wrong 300ms ease both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- daily review (FSRS) ---------- */
  .review-cta {
    position: relative; width: 100%; margin-top: 10px; padding: 15px 16px; cursor: pointer;
    font-family: var(--font-sans); text-align: left; border-radius: var(--r-btn);
    background: var(--green-tint); border: 1.5px solid var(--green-border); color: var(--green-text);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .review-cta:hover { border-color: var(--sage-300); }
  .review-cta-main { font-size: 14px; font-weight: 800; }
  .review-cta-sub { display: block; font-size: 11.5px; font-weight: 500; margin-top: 3px; color: var(--muted); }
  .review-cta-count {
    flex-shrink: 0; min-width: 34px; text-align: center; padding: 5px 9px; border-radius: 999px;
    background: var(--green-solid); color: var(--on-green); font-size: 12.5px; font-weight: 800;
    font-feature-settings: 'tnum';
  }
  .review-caught-up {
    margin-top: 12px; text-align: center; font-size: 11.5px; font-weight: 500; line-height: 1.5;
  }

  /* the optional weak-words action: same shape as the due action, deliberately
     quieter, so a scheduled review always reads as the primary one */
  .review-cta.is-practice {
    background: transparent; border-color: var(--hairline); color: var(--ink); margin-top: 8px;
  }
  .review-cta.is-practice:hover { border-color: var(--sage-300); background: var(--surface-2); }
  .review-cta.is-practice .review-cta-count {
    background: var(--surface-2); border: 1px solid var(--hairline); color: var(--muted);
  }

  /* the four-grade rating row -- revealed once the card is flipped */
  .rate-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 18px; }
  .rate-btn {
    border-radius: var(--r-sm); padding: 12px 4px 10px; cursor: pointer; font-family: var(--font-sans);
    background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .rate-btn:hover { border-color: var(--sage-300); background: var(--surface-2); }
  .rate-label { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .rate-when { font-size: 10px; font-weight: 600; color: var(--muted); font-feature-settings: 'tnum'; }
  .rate-btn.rate-again .rate-label { color: var(--muted); }
  .rate-btn.rate-good { background: var(--green-tint); border-color: var(--green-border); }
  .rate-btn.rate-good .rate-label { color: var(--green-text); }
  .rate-hint { text-align: center; font-size: 12px; margin-top: 22px; line-height: 1.5; }

  /* the rating row and the reveal hint swap in place, without a re-render, so
     the flip animation is never interrupted */
  .rate-row[hidden], .rate-hint[hidden] { display: none; }

  /* FSRS state breakdown on the Progress tab */
  .fsrs-row { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; font-size: 14px; }
  .fsrs-row + .fsrs-row { border-top: 1px solid var(--hairline-soft); }
  .fsrs-count { font-weight: 700; font-feature-settings: 'tnum'; }
  .fsrs-row.is-due .fsrs-count { color: var(--green-text); }

  .fade-in { animation: oikos-fade 0.18s ease; }
  @keyframes oikos-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  /* ===================================================================
     RESPONSIVE TIERS
     Base (above) is the phone layout and is left alone, bar the category
     grid, which is a deliberate change at all three tiers.

     Token note: the brief for this work used a different set of token
     names to the ones in :root. They map straight across, so nothing new
     is introduced here:
       border → --hairline          border-soft → --hairline-soft
       surface-hover → --surface-2  border-hover → --sage-300
       accent → --green-solid       accent-soft → --green-tint
       accent-ink → --green-text    accent-line → --green
       accent-dark → --green-press
     =================================================================== */

  /* Pieces that only exist on a wider tier stay out of the way on the phone.
     They are rendered at every width so the tier is decided by CSS alone. */
  .nav-brand,
  .tab-label-full,
  .key-hint,
  .prompt-meta,
  .opt-key,
  .rate-key,
  .side-panel,
  .stat-ring-label-lg,
  .hint-key,
  .nav-arrow,
  .session-keys,
  .typed-note,
  .setup-esc { display: none; }

  /* ---------- category cells: a uniform grid at every tier ----------
     Replaces the text-width pill chips. Same cell language as the chapter
     number grid: one border, one fill, one selected state. */
  .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .cat-chip {
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    /* stretch, not the inline-pill's centre, so the name sits flush left */
    align-items: stretch;
    text-align: left; padding: 11px; min-height: 62px; border-radius: var(--r-sm);
    font-size: 11.5px; line-height: 1.25; cursor: pointer; user-select: none;
    font-family: var(--font-sans); font-weight: 600;
    background: var(--surface); border: 1px solid var(--hairline); color: var(--ink);
  }
  .cat-name { display: block; }
  .cat-count { display: block; font-size: 10px; font-weight: 700; color: var(--muted); font-feature-settings: 'tnum'; }

  /* ---------- side panels (desktop only, hidden above) ---------- */
  .side-panel-card {
    border-radius: var(--r-card); border: 1px solid var(--hairline); background: var(--surface);
    box-shadow: var(--shadow-card); padding: 16px 18px;
  }
  .side-panel-card + .side-panel-card { margin-top: 14px; }
  .side-panel .kicker { display: block; margin-bottom: 10px; }
  .side-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 12.5px; color: var(--muted); }
  .side-row + .side-row { border-top: 1px solid var(--hairline-soft); }
  .side-row-value { font-weight: 700; color: var(--ink); font-feature-settings: 'tnum'; }
  .side-note { margin-top: 12px; font-size: 11.5px; line-height: 1.5; color: var(--muted); }

  /* ---------- key hints: one uniform chip, desktop only ---------- */
  .key-hint {
    font-size: 10.5px; font-weight: 700; line-height: 1; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 5px; padding: 4px 6px;
    font-family: var(--font-sans); white-space: nowrap;
  }
  .key-hint.on-accent { color: color-mix(in srgb, var(--on-green) 70%, transparent); border-color: color-mix(in srgb, var(--on-green) 34%, transparent); }
  .header-right { display: flex; align-items: center; gap: 12px; }

  /* focus ring for the memory board — outline, so the tile never shifts */
  .mem-tile.is-focused { outline: 2px solid var(--green); outline-offset: 2px; border-radius: var(--r-sm); }

  /* ===================================================================
     TABLET — 768px and up. 88px icon rail, content capped at 720px.
     =================================================================== */
  @media (min-width: 768px) {
    #app { max-width: none; margin: 0; padding-left: 88px; }
    #screen { max-width: 720px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 28px 72px; }

    /* the wordmark lives in the rail now */
    .header-brand { display: none; }
    .header-row { justify-content: flex-end; min-height: 38px; margin-bottom: 22px; }

    /* ---- the rail ---- */
    .tab-bar-wrap {
      top: 0; bottom: 0; left: 0; right: auto; width: 88px; display: block;
      background: transparent; border-top: none; padding-bottom: 0;
    }
    .tab-bar {
      flex-direction: column; align-items: center; justify-content: flex-start;
      width: 88px; max-width: none; height: 100%; gap: 6px;
      background: var(--surface);
      border-top: none; border-right: 1px solid var(--hairline);
      padding: 26px 0 calc(env(safe-area-inset-bottom) + 20px);
    }
    .nav-brand { display: block; writing-mode: vertical-rl; transform: rotate(180deg); margin-bottom: 28px; }
    .nav-brand .app-title { font-size: 13px; }
    .nav-brand .app-tagline { display: none; }
    .tab-btn { flex: 0 0 auto; width: 64px; padding: 12px 0; border-radius: var(--r-sm); gap: 6px; }
    .tab-btn.active { background: var(--green-tint); color: var(--green-text); }
    .tab-btn svg { width: 24px; height: 24px; }

    /* ---- home ---- */
    .home-screen { min-height: calc(100vh - env(safe-area-inset-top) - 180px);
      min-height: calc(100dvh - env(safe-area-inset-top) - 180px); }
    .greeting { font-size: 62px; }
    .stat-rings { margin-top: 38px; }
    .stat-ring { padding: 26px 10px 22px; }
    .stat-ring-label { font-size: 11.5px; margin-top: 11px; }
    .stat-caption { font-size: 12px; margin-top: 16px; }
    .home-actions { margin-top: 38px; }
    .home-actions .start-btn { padding: 20px 0; }
    .home-actions .start-btn span { font-size: 16px; }

    /* ---- setup ---- */
    .setup-panel { padding: 26px; }
    .step-title { font-size: 28px; }
    .step-hint { font-size: 13.5px; }
    .chapters-grid { grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .chapter-chip { padding: 13px 0; font-size: 12.5px; }
    .categories-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cat-chip { padding: 14px; min-height: 68px; font-size: 13px; }
    .cat-count { font-size: 11px; }
    .seg-btn { padding: 13px 10px; font-size: 13.5px; }

    /* ---- study screens ---- */
    .prompt-word { font-size: 66px; }
    .prompt-word.is-english { font-size: 42px; }
    .prompt-panel { padding: 52px 28px; }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .option-content { font-size: 16px; }
    .typed-input { padding: 19px; font-size: 17px; }
    .typed-submit span { font-size: 14.5px; }
    .flip-inner { min-height: 300px; }
    .flip .prompt-word { font-size: 72px; }
    .card-actions { gap: 14px; }

    /* memory: four to a row, centred rather than filling the width */
    .mem-grid { gap: 16px; align-content: flex-start; }
    .mem-tile { flex: 0 0 150px; box-sizing: border-box; }
    .mem-face { padding: 12px; }
    .mem-back { font-size: 15.5px; }
    .mem-back.is-greek { font-size: 20px; }
    .mem-front svg { width: 34px; height: 34px; }

    /* daily review: the grade row stays four across, it is a scale */
    .rate-row { gap: 10px; }
    .rate-btn { padding: 16px 6px 14px; }

    /* ---- progress ---- */
    .prog-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px;
      grid-template-areas: "rings rings" "review srs" "memory memory" "chapters chapters"; }
    .prog-rings { grid-area: rings; }
    .prog-review { grid-area: review; }
    .prog-srs { grid-area: srs; }
    .prog-memory { grid-area: memory; }
    .prog-chapters { grid-area: chapters; }
    .prog-chapters .glass-content { columns: 2; column-gap: 28px; }
    .prog-chapters .chapter-row { break-inside: avoid; }
    .prog-chapters .chapter-row + .chapter-row { border-top: none; }
  }

  /* ===================================================================
     DESKTOP — 1180px and up. 220px labelled sidebar, content capped at
     1180px, hover states and keyboard hints switch on here.
     =================================================================== */
  @media (min-width: 1180px) {
    #app { padding-left: 220px; }
    #screen { max-width: 1180px; padding: 48px 40px 80px; }

    /* ---- the sidebar ---- */
    .tab-bar-wrap { width: 220px; }
    .tab-bar { width: 220px; align-items: stretch; padding: 30px 16px calc(env(safe-area-inset-bottom) + 22px); gap: 4px; }
    .nav-brand { writing-mode: horizontal-tb; transform: none; margin: 0 6px 30px; }
    .nav-brand .app-title { font-size: 15px; }
    .nav-brand .app-tagline { display: block; font-size: 10.5px; }
    .tab-btn {
      width: auto; flex-direction: row; align-items: center; justify-content: flex-start;
      gap: 12px; padding: 13px 12px; border-radius: var(--r-sm);
    }
    .tab-btn svg { width: 22px; height: 22px; }
    .tab-label { display: none; }
    .tab-label-full { display: block; font-size: 13px; font-weight: 600; }

    /* key hints are always visible here, never below */
    .key-hint, .prompt-meta, .opt-key, .rate-key, .side-panel,
    .nav-arrow, .session-keys, .typed-note, .setup-esc { display: block; }
    .key-hint, .opt-key, .rate-key, .nav-arrow { display: inline-block; }
    .hint-tap { display: none; }
    .hint-key { display: inline; }

    /* ---- home: one centred column, not a split ---- */
    .home-screen { max-width: 1000px; margin: 0 auto; }
    .greeting { font-size: 88px; font-weight: 800; letter-spacing: -0.04em; text-align: left; }
    .stat-rings { margin-top: 44px; }
    .stat-ring { padding: 34px 16px 30px; }
    .stat-ring svg { width: 168px; height: 168px; }
    .stat-ring-label { display: none; }
    .stat-ring-label-lg { display: block; margin-top: 16px; }
    .srl-figure { display: block; font-size: 15px; font-weight: 600; color: var(--ink); font-feature-settings: 'tnum'; }
    .srl-qualifier { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    /* the numbers live in the ring labels here, so the caption would repeat them */
    .stat-caption { display: none; }
    .home-actions { margin-top: 38px; }
    .home-actions .start-btn { position: relative; padding: 24px 0; }
    .home-actions .start-btn span { font-size: 17px; }
    .start-btn .key-hint, .typed-submit .key-hint { font-size: 10.5px; font-weight: 700; }
    .start-btn .kh-btn { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); z-index: 2; }
    .home-actions-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .home-actions-row > .secondary-btn,
    .home-actions-row > .review-cta { flex: 1 1 0; min-width: 0; margin-top: 0; width: auto; }
    /* flex-basis: 0 is content-box, so the two halves are only equal when their
       horizontal padding matches -- the CTA's 16px, on a centred label */
    .home-actions-row > .secondary-btn { padding-left: 16px; padding-right: 16px; }
    .home-actions-row > .review-caught-up { flex: 1 1 100%; margin-top: 0; }

    /* ---- setup ---- */
    .setup-panel { padding: 34px 36px; }
    .setup-topbar { gap: 14px; }
    .step-title { font-size: 34px; }
    .chapters-grid { grid-template-columns: repeat(12, 1fr); gap: 8px; }
    .categories-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cat-chip { font-size: 13.5px; }
    .setup-panel .start-btn.step-next { position: relative; padding: 19px 0; }

    /* ---- multiple choice: prompt beside the answers ---- */
    .prompt-word { font-size: 84px; }
    .prompt-word.is-english { font-size: 54px; }
    .quiz-body.is-mc {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 40px; align-items: center;
    }
    .quiz-body.is-mc .prompt-panel { margin-bottom: 0; }
    .quiz-body.is-mc .options { gap: 14px; }
    .prompt-meta { margin-top: 14px; font-size: 11.5px; color: var(--muted); }
    .option-btn { min-height: 120px; padding: 14px 18px 18px; display: flex; }
    .option-btn .option-content { flex: 1; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 0; font-size: 17px; }
    .opt-key { font-size: 11px; font-weight: 800; color: var(--muted); border: 1px solid var(--hairline); border-radius: 5px; padding: 3px 7px; line-height: 1; }
    .option-icon { position: absolute; right: 16px; bottom: 18px; }

    /* ---- type answer: one column, the eye runs Greek → caret ---- */
    .quiz-body.is-typed { max-width: 820px; margin: 0 auto; }
    .quiz-body.is-typed .typed-input-wrap .glass-edge { border: 1.5px solid var(--green); }
    .typed-input { padding: 22px; font-size: 19px; }
    .typed-submit { position: relative; padding: 0 28px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .typed-submit span { font-size: 14.5px; }
    .typed-submit .key-hint { position: relative; z-index: 1; }
    .typed-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }

    /* ---- flashcards: a quiet column beside the card ---- */
    .cards-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
    .flip-inner { min-height: 420px; }
    .flip .prompt-word { font-size: 104px; }
    .card-actions .start-btn { position: relative; }

    /* ---- memory: 5 x 2, centred ---- */
    .mem-grid { display: grid; grid-template-columns: repeat(5, 200px); gap: 24px; justify-content: center; align-content: flex-start; }
    .mem-tile { flex: none; width: 200px; }
    .mem-back { font-size: 17.5px; }
    .mem-back.is-greek { font-size: 24px; }
    .mem-front svg { width: 40px; height: 40px; }
    .session-keys { font-size: 11.5px; color: var(--muted); }

    /* ---- daily review ---- */
    .review-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; align-items: start; }
    .review-layout .flip-inner { min-height: 340px; }
    .review-layout .prompt-word.is-english { font-size: 54px; }
    .rate-row { gap: 12px; margin-top: 20px; }
    .rate-btn { padding: 14px 8px 16px; gap: 6px; }
    .rate-key { font-size: 11px; font-weight: 800; color: var(--muted); border: 1px solid var(--hairline); border-radius: 5px; padding: 3px 7px; line-height: 1; }
    .rate-label { font-size: 13.5px; }

    /* ---- progress: rings and the memory best in one row, lists beside ---- */
    .prog-grid { grid-template-columns: 1fr 1fr 1fr; column-gap: 20px;
      grid-template-areas: "rings rings memory" "review review chapters" "srs srs chapters"; }
    .prog-srs .glass-content { columns: 2; column-gap: 28px; }
    .prog-srs .fsrs-row { break-inside: avoid; }
    .prog-chapters .glass-content { column-gap: 34px; }
    .prog-memory .mem-done-time { font-size: 34px; }
  }

  /* ===================================================================
     HOVER — desktop pointers only, so a tap never leaves a stuck state.
     Existing timing is reused; no transforms, lifts or scale.
     =================================================================== */
  @media (hover: hover) and (min-width: 1180px) {
    .tab-btn:hover { background: var(--surface-2); color: var(--ink); }
    .tab-btn.active:hover { background: var(--green-tint); color: var(--green-text); }

    .cat-chip:not(.selected):hover { border-color: var(--sage-300); background: var(--surface-2); }
    .cat-chip.selected:hover { background: var(--green-solid); border-color: var(--green-solid); }
    .chapter-chip.selectable:not(.selected):hover { border-color: var(--sage-300); background: var(--surface-2); }
    .chapter-chip.selected:hover { background: var(--green-solid); border-color: var(--green-solid); }

    .option-btn:not(:disabled):hover .option-edge { border-color: var(--sage-300); }
    .option-btn:not(:disabled):hover .option-fill { background: var(--surface-2); }
    .mem-tile:not(.is-flipped):not(.is-matched):hover .mem-face { border-color: var(--sage-300); background: var(--surface-2); }
    .rate-btn:hover { border-color: var(--sage-300); background: var(--surface-2); }

    .start-btn:not(:disabled):hover .resume-fill,
    .typed-submit:not(:disabled):hover .resume-fill,
    .resume-btn:not(:disabled):hover .resume-fill { background: var(--green-press); }

    .ghost-btn:not(:disabled):hover,
    .secondary-btn:hover,
    .back-btn:hover,
    .icon-btn:hover { background: var(--green-tint); }

    .chapter-row:hover, .missed-row:hover, .fsrs-row:hover { background: var(--surface-2); }
  }

  /* hover belongs to pointers: on a touch screen a tap must not leave a
     stuck hover state, so the base hovers are neutralised there */
  @media (hover: none) {
    .icon-btn:hover { background: var(--surface); }
    button.pill:hover .glass-fill { background: var(--surface); }
    .chapter-chip.selectable:hover { border-color: var(--hairline); background: var(--surface); }
    .chapter-chip.selectable.selected:hover { border-color: var(--green-solid); background: var(--green-solid); }
    .start-btn:not(:disabled):hover .resume-fill,
    .typed-submit:not(:disabled):hover .resume-fill { background: var(--green-solid); }
    .option-btn:not(:disabled):hover .option-edge { border-color: var(--hairline); }
    .option-btn:not(:disabled):hover .option-fill { background: var(--surface); }
    .choice-btn:hover { border-color: var(--hairline); background: var(--surface); }
    .choice-btn.active:hover { border-color: var(--green-solid); background: var(--green-solid); }
    .cat-chip:hover { border-color: var(--hairline); background: var(--surface); }
    .cat-chip.selected:hover { border-color: var(--green-solid); background: var(--green-solid); }
    .ghost-btn:not(:disabled):hover, .secondary-btn:hover, .back-btn:hover { background: transparent; }
    .rate-btn:hover { border-color: var(--hairline); background: var(--surface); }
    .rate-btn.rate-good:hover { border-color: var(--green-border); background: var(--green-tint); }
    .review-cta:hover { border-color: var(--green-border); }
    .review-cta.is-practice:hover { border-color: var(--hairline); background: transparent; }
  }

  /* ---------- first-run onboarding walkthrough ----------
     A full-screen sequence layered in front of the app on first launch. It
     sits above the tab bar / rail (which is hidden while it is up) and takes
     every colour, radius and type step from the tokens in :root. The one
     literal is the body-copy alpha: a step darker than --muted so the long
     paragraphs keep 4.5:1. */
  .onb-root {
    --onb-body: rgba(28,27,25,0.72);
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .onb-root { --onb-body: rgba(237,239,233,0.72); }
  }
  body.onboarding-open .tab-bar-wrap { display: none; }

  /* the quiet way back into the walkthrough, at the very bottom of Progress */
  .prog-replay { margin-top: 22px; text-align: center; }

  .onb-header {
    flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; padding: clamp(20px,3vw,34px) clamp(20px,5vw,48px) 0;
  }
  .onb-skip {
    border: none; background: none; padding: 8px 2px; cursor: pointer;
    font-family: var(--font-sans); font-size: 12px; font-weight: 700; color: var(--muted);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .onb-skip:hover { color: var(--green-text); }

  .onb-viewport { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  /* one track translated by whole screens -- the app's slide language
     (compare oikos-step-fwd), kept as a transform so a swipe could later
     track the finger continuously rather than snapping. */
  .onb-track {
    display: flex; height: 100%; width: 100%;
    transition: transform 320ms cubic-bezier(.2,.7,.3,1);
  }
  .onb-screen {
    flex: 0 0 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(20px,4vw,56px) clamp(20px,5vw,48px);
  }
  /* the two-column / stacked switch is done by flex-wrap and clamp(), so the
     app's 768px and 1180px tiers need no onboarding-specific rules */
  .onb-inner {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: clamp(26px,4vw,60px); max-width: 1000px; width: 100%;
  }
  .onb-icon {
    flex: 0 0 auto; width: clamp(92px,20vw,190px); height: clamp(92px,20vw,190px);
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--r-card); box-shadow: var(--shadow-card);
    display: flex; align-items: center; justify-content: center; color: var(--green);
  }
  .onb-icon svg { width: clamp(38px,8vw,72px); height: clamp(38px,8vw,72px); }
  .onb-icon.is-tinted {
    background: var(--green-tint); border-color: var(--green-border);
    color: var(--green-text); box-shadow: none;
  }
  .onb-text { flex: 1 1 340px; min-width: 0; }
  .onb-title {
    margin: 10px 0 0; font-weight: 800;
    font-size: clamp(30px,6vw,56px); line-height: 1.04; letter-spacing: -0.035em;
  }
  .onb-title.is-wordmark {
    font-size: clamp(34px,7vw,64px); line-height: 1.02; letter-spacing: -0.02em;
  }
  .onb-lede {
    margin-top: 10px; font-size: clamp(14px,1.6vw,17px);
    font-weight: 600; color: var(--green-text);
  }
  .onb-body {
    margin: 16px 0 0; font-size: clamp(14.5px,1.6vw,18px); line-height: 1.6;
    color: var(--onb-body); max-width: 52ch; text-wrap: pretty;
  }
  .onb-note { margin: 14px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

  .onb-footer {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: clamp(14px,2vw,20px);
    padding: 0 clamp(20px,5vw,48px) calc(env(safe-area-inset-bottom) + clamp(22px,3vw,36px));
  }
  .onb-progress {
    max-width: 1000px; width: 100%; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .onb-dots { display: flex; align-items: center; gap: 6px; }
  .onb-dot {
    display: block; height: 6px; width: 6px; border-radius: 3px; background: var(--track);
    transition: width 200ms ease, background 200ms ease;
  }
  .onb-dot.active { width: 22px; background: var(--green); }
  .onb-count { font-size: 11px; font-weight: 600; color: var(--faint); font-feature-settings: 'tnum'; }
  .onb-buttons { max-width: 1000px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
  .onb-buttons .secondary-btn { flex: 0 1 180px; width: auto; margin-top: 0; }
  .onb-buttons .secondary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .onb-buttons .secondary-btn:disabled:hover { background: transparent; }
  .onb-buttons .start-btn { flex: 1 1 auto; width: auto; margin-top: 0; padding: 18px 0; }
  .onb-buttons .start-btn span { font-size: 15px; }

  /* a phone in landscape has almost no vertical room -- shrink the type ramp
     rather than letting the screen body scroll under the footer */
  @media (max-height: 520px) {
    .onb-title { font-size: clamp(26px,5vw,38px); }
    .onb-title.is-wordmark { font-size: clamp(28px,5.5vw,40px); }
    .onb-icon { width: clamp(72px,14vw,120px); height: clamp(72px,14vw,120px); }
    .onb-icon svg { width: clamp(32px,6vw,52px); height: clamp(32px,6vw,52px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .onb-track { transition: none; }
  }
</style>
</head>

const CHAPTERS = Object.keys(VOCAB).map(Number).sort((a,b)=>a-b);
const MASTERY_THRESHOLD = 80;

/* categories come from the vocabulary data itself -- every word carries the
   category it was tagged with, so the list and the counts can never drift
   apart from the words. Ordered by size, largest first. */
const CATEGORIES = (() => {
  const counts = new Map();
  CHAPTERS.forEach(ch => (VOCAB[ch] || []).forEach(w => counts.set(w.cat, (counts.get(w.cat) || 0) + 1)));
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([name, count]) => ({ name, count }));
})();
const CATEGORY_NAMES = CATEGORIES.map(c => c.name);

/* the memory game is a fixed 5 pairs / 10 tiles -- that is the ceiling for a
   legible grid on a phone, so it deliberately ignores the 10/20/30 setting */
const MEMORY_PAIRS = 5;

/* ---------- storage: works inside Claude artifacts (window.storage) and on any
   normal web host / home-screen app (falls back to localStorage) ---------- */
const storageAdapter = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }
    } catch (e) { /* key may not exist yet */ }
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(key, value, false);
        return;
      }
    } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(key, value); } catch (e) { /* non-fatal */ }
  }
};
